[pytest]
# `scripts` is listed so helpers under it get collected when they acquire tests;
# nothing matches there today, and adding the path costs nothing.
testpaths = tests app/harness/tests scripts
asyncio_mode = auto
markers =
    live_vault: reads the live ~/obsidian vault, which no round under test controls.
        The autoimplement gate runs `-m "not live_vault"`: these assertions are about a
        file an hourly autoresearch promotion or a nightly job can rewrite between
        rounds, so on a hard gate rung they would fail the next author for the
        previous writer's change. Enforcement lives at the writers (see
        prompt_surface.check_contract); this mark is the reporting copy.
