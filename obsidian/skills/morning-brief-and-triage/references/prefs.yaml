# Morning Brief & Triage — Filtering Preferences
# ================================================

# Allowlist — senders whose emails are always kept
watch_senders:
  - alan@example.com
  - alan@alansrobotlab.com
  - gestalt73@gmail.com

# Allowlist — domains whose emails are always kept
watch_domains:
  - alansrobotlab.com
  - robotlab.ai

# Mailing lists to watch
mailing_lists:
  - team@alansrobotlab.com
  - research@robotlab.ai

# Blocklist — senders whose emails are always skipped
block_senders:
  - noreply@github.com
  - notifications@github.com

# Blocklist — domains whose emails are always skipped
block_domains:
  - sendgrid.net
  - mailgun.org

# Priority keywords — force-surface if present in subject (case-insensitive)
priority_keywords:
  - "urgent"
  - "asap"
  - "deadline"
  - "rsvp"
  - "expires"
  - "last chance"
  - "action required"
  - "meeting"
  - "tomorrow"
  - "tonight"
  - "today"

# Ignore substrings — force-skip if present in subject (case-insensitive)
ignore_subjects:
  - "spam"
  - "test email"
  - "digest"

# Calendar names to watch — if non-empty, only surface these calendars
watch_calendars:
  - ""
