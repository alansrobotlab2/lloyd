# Data pipeline configuration for nightly_extraction.py
# Generated 2026-07-19 to fix missing config dependency

extraction:
  # Number of parallel worker processes
  workers: 4
  # Max file size to process (bytes)
  max_file_size: 5242880  # 5MB
  # Maximum number of files per run
  max_files: 5000

sources:
  # The corpus, as an ALLOW-LIST. nightly_extraction reads this (it did not
  # until 2026-09-04: it walked the whole vault minus a deny-list, so every
  # new directory was ingested by default and roughly half of the 205k facts
  # in the pre-rebuild tree came from re-extracting the pipeline's own
  # output). A directory is ingested because it is named here.
  #
  # Deliberately absent:
  #   skills/     - the agent's own instructions, not knowledge about the world
  #   autonomy/   - task frontmatter the scheduler rewrites every ~15 min
  #   agents/, facts/, sessions/, templates/, images/ - pipeline plumbing
  #   architecture/, backlog/, lloyd/ - written by the agent about itself
  #   youtube/    - raw transcript dumps; the knowledge/ notes distil them
  paths:
    - "~/obsidian/knowledge"
    - "~/obsidian/projects"
    - "~/obsidian/people"
    - "~/obsidian/personal"
    - "~/obsidian/work"
    # Daily notes, but only once they have settled — today's is appended to
    # all day, so nightly_extraction skips anything dated today or later.
    - "~/obsidian/memory"

  # Belt and braces. The allow-list above already excludes these; the walk
  # applies them again so a mistaken path entry cannot drag them in.
  exclude_patterns:
    - ".git/"
    - "__pycache__/"
    - "node_modules/"
    - "*.bak"
    - "*.tmp"
    - ".DS_Store"
    - "/facts/"
    - "/_pipeline/"
    - "/skills/"
    - "/agents/"
    - "/autonomy/"
    - "/memory/vault-maintenance/"

  # Patterns to include (Markdown)
  include_patterns:
    - "*.md"

processing:
  # Enable fact extraction from vault files
  fact_extraction:
    enabled: true
    max_facts_per_file: 50

  # Enable relationship discovery
  relationship_discovery:
    enabled: true
    min_confidence: 0.3
    max_edges_per_node: 200

  # Enable index rebuild
  index_rebuild:
    enabled: true

  # Enable semantic analysis
  semantic_analysis:
    enabled: true
    max_tokens: 4096
    embedding_model: "local"  # Use local model for embeddings

  # Conversation relation linking
  conversation_relinking:
    enabled: true
    max_links_per_conversation: 10

hashing:
  # Algorithm for content hashing
  algorithm: "sha256"
  # Path to store hashes
  hash_store: "~/lloyd/_pipeline/content-hashes.json"

logging:
  # Log file path
  log_file: "~/lloyd/_pipeline/nightly-extraction.log"
  # Log level (DEBUG, INFO, WARNING, ERROR)
  level: "INFO"
  # Print progress every N files
  progress_interval: 50

performance:
  # Memory limit per worker (MB)
  worker_memory_limit: 512
  # Batch size for processing
  batch_size: 10
  # Timeout for individual file processing (seconds)
  file_timeout: 30