# Code-shape rules the landing gate checks on every self-mod round (#2574).
#
# This is the surface where Lloyd states, in the tree, that a code shape must
# never appear in a diff — mechanically, in any round, with the incident that
# produced it sitting next to the pattern. Before #2574 the only defence against
# repeating a recorded code-shape defect was that a human, or the `review` grader
# on a good day, remembered the class.
#
# Loader and matcher implementations: `scripts/automod/code_rules.py`. The runner
# is stdlib `ast` only and reports observe-only (#2574's own split, copied from
# #679): nothing here can fail a round. Flipping a rule to blocking is a human
# ruling after the soak, not a commit to this file — and #2809 wrote that soak, its
# denominator and its ruling into this block, so the zero is readable from the tree
# instead of only from a closed item's activity log.
#
# ---------------------------------------------------------------------------
# THE SOAK, AS MEASURED ON 2026-10-19 (#2809 wrote the record #2574 left owed; #2992
# re-ran the block below and raised the figures it had aged out of).
#
# WHO MAY CHANGE THE FIGURES IN THIS BLOCK. The owed-check pass alone decides that this
# soak record has gone stale, and it alone raises the figures, by publishing the fresh
# measurement in its decision. A round changes these comment lines only inside an
# organic edit it is already making for another reason. That is #2809's ruling, which
# #2992's owed-check pass restated on 2026-10-24 naming #3263 as the organic edit this
# sentence sits inside; `tests/test_automod_code_rules.py` carries the same two
# sentences above `RULES_LANDED_AT`, and one node there requires both files to hold
# them, so the ruling cannot be refreshed in one place and left stale in the other.
#
#   0 flags. Zero hits, and zero sites rescued by an allow list, over 384 `gate`
#   rows from 249 distinct rounds, every one of them `status: evaluated` — not a
#   single row came back `unevaluated`, which is the state in which a zero would
#   mean only that the instrument never ran.
#   Date span 2026-10-13T03:41:47Z .. 2026-10-19T03:14:48Z.
#
# 4592296e is the commit that put these rules on the gate, and the rung
# (`scripts/automod/gate.py`, `rung_code_rules`) writes its own result onto every
# `gate` event in the automod ledger, so the soak replays from the ledger rather than
# being remembered. SOAK_GATE_ROWS_AT_RECORDING = 384 is that denominator, and the
# block below is the command that recomputes the rows, the flag count, the distinct-round
# count and the span — then the per-rule coverage, then how many of those rows were
# gated against #2810's widened scope — read-only from that ledger. Every figure in this
# block has a command in that block; a figure with no command is a caption.
#
# THE WINDOW IS BOUNDED AT BOTH ENDS. `UNTIL` defaults to the span end recorded above,
# and every command below filters on it as well as on `SINCE`, so re-running the block
# replays THIS record instead of counting whatever the ledger has grown since. The zero
# is therefore a statement about the window the record describes, not about the ledger
# today: rows past the bound exist, and measuring them is the owed-check pass's job under
# the ruling above, not a figure to be re-quoted from a run of this block.
#
# RECOMPUTE-BEGIN
# L="${CODE_RULES_LEDGER:-$HOME/.local/state/lloyd-automod/promotions.jsonl}"
# SINCE="${CODE_RULES_SOAK_SINCE:-2026-10-13T03:07:36Z}"   # 4592296e's commit time, UTC
# UNTIL="${CODE_RULES_SOAK_UNTIL:-2026-10-19T03:14:48Z}"   # the Date span end above, UTC
# jq -s --arg s "$SINCE" --arg u "$UNTIL" '[.[] | select(.event=="gate" and .code_rules and .created_at>=$s and .created_at<=$u)]
#   | "rows \(length)  flags \([.[].code_rules | (.counts|add // 0)] | add // 0)  span \([.[].created_at]|min) .. \([.[].created_at]|max)"' "$L"
# jq -s --arg s "$SINCE" --arg u "$UNTIL" '
#   [.[] | select(.event=="gate" and .code_rules and .created_at>=$s and .created_at<=$u)] as $rs
#   | [$rs[] | .code_rules.totals.coverage | to_entries[] | [.key, .value.covered]]
#   | group_by(.[0]) | .[]
#   | "\(.[0][0]): \(.|map(select(.[1]>0))|length)/\($rs|length) rows saw >=1 file, \(.|map(.[1])|add) file-reads"' "$L"
# WIDENED="${CODE_RULES_SCOPE_WIDENED:-2026-10-16T09:03:23Z}"   # 1168247e's commit time, UTC
# jq -s --arg s "$SINCE" --arg u "$UNTIL" '[.[] | select(.event=="gate" and .code_rules and .created_at>=$s and .created_at<=$u)]
#   | "rows \(length)  distinct_rounds \([.[].round_id]|unique|length)  unevaluated \([.[]|select(.code_rules.status!="evaluated")]|length)"' "$L"
# jq -s --arg w "$WIDENED" --arg u "$UNTIL" '[.[] | select(.event=="gate" and .code_rules and .created_at>=$w and .created_at<=$u)]
#   | "rows at or after the #2810 widening: \(length)"' "$L"
# RECOMPUTE-END
#
# WHY THE DENOMINATOR IS THE LEDGER'S ROW COUNT AND NOT THE LANDING COUNT. The item
# was filed with "110 promoted landings with .py changes"; the same command read 120
# the day #2809 wrote this, and 205 when #2992 re-ran it on 2026-10-19 —
# LANDED_PY_COMMITS_AT_RECORDING = 205, recompute with
# `git log --oneline 4592296e..HEAD -- '*.py' | wc -l` — so a bare count in prose is
# false inside a week. `tests/test_automod_vet.py` learned exactly that ("a control
# that pins a count rots within days") and `tests/test_automod_code_rules.py` restates
# it: name the command beside the figure, and pin a figure as a lower bound, never as
# an equality.
#
# COVERAGE, PER RULE, OVER THOSE SAME 384 ROWS — the figure that decides what the
# zero is worth. `code_rules.run` carries `totals.coverage` for precisely this reason
# (its own comment: "a rule that covered nothing for twenty landings has a zero nobody
# should have believed"), and the second jq command above prints it per rule:
#   opens-kg-store-outside-kg-store       383/384 rows saw >=1 file, 1181 file-reads
#   broad-except-swallow-same-line        383/384 rows saw >=1 file, 1181 file-reads
#   exports-lloyd-data-to-process-environ 383/384 rows saw >=1 file, 1181 file-reads
#   naive-now-in-artifact-name            159/384 rows saw >=1 file,  249 file-reads
#   guardian-import-hygiene                 6/384 rows saw >=1 file,    6 file-reads
# A RULE'S ZERO IS ONLY AS STRONG AS ITS COVERAGE, so "0 flags" is a statement about
# the three `**/*.py` rules and close to nothing about the other two. A round that
# touched only `tests/` and non-scope `scripts/` offered `naive-now-in-artifact-name`
# nothing to read, which is 159 rows of the 384, and #2810's widening of that rule's
# scope (1168247e) landed inside this window, so only 162 rows of the 384 were gated
# against the wider scope at all — the block's last command re-runs that cut at
# 1168247e's commit time, 2026-10-16T09:03:23Z, which is the bound the count needs.
# `guardian-import-hygiene` saw exactly one guardian file in each of 6 rows from 4
# distinct rounds, because that is how many rounds touched
# `agent-services/guardian/`. Any later reading of this zero has to carry those
# fractions with it, and the two instruments that could carry them are different
# instruments: the FRACTIONS above come only from re-running the RECOMPUTE block
# against the ledger, while `scripts/maintenance/code_rules_census.py` watches the
# RULES — it scores every tracked .py in the tree (its `of` denominator is
# `tracked_python`, `whole_tree`; it never reads the ledger, so it can report whether a
# rule still fires and says nothing about what the soak's denominator has become).
#
# NO RULE HAS FLIPPED TO BLOCKING, and this soak does not license flipping one. #679
# is the precedent on the same shape of finding: its owed-human sweep ruled "keep
# observe-only (1 s, costs nothing), flip nothing to blocking", and its owed-check
# then closed the observe-only half on the zero-finding soak as "not the defect class
# here", measured over 790 `vet` rows carrying a record and 400 promoted landing
# events. This soak is smaller — 384 rows over six days — and two of its five rules
# barely ran, so the same call applies here with even less reason to reverse it.
# Nothing flips.
#
# THE BOUND ON A FLIP, which no future round should read as "20 landings, go".
# `scripts/automod/gate.py`, `rung_code_rules`, already publishes the first condition
# — a human ruling after a soak of at least 20 landings — and that number stays
# published THERE. This file adds a second condition to it rather than restating a
# competing one:
#   (a) the >=20 landings of soak `rung_code_rules` names, counted over evaluated rows
#       and read beside a per-rule coverage table like the one above; AND
#   (b) at least 1 confirmed real catch in a live diff — a hit that a human agreed was
#       a genuine defect. A soak of 20 landings with zero catches is #679's outcome
#       ("not the defect class here"), not a licence to flip. A label this file's own
#       runner writes onto a ledger row is the instrument counting itself, not that
#       agreement, and a round which was aborted before it landed is the furthest
#       possible thing from a human agreeing on its diff; and
#   (c) the round that flips a rule adds the allow list that rule will need in the
#       SAME diff, because a blocking rule whose known exceptions land later refuses
#       every round in between, including the round sent to fix them.
# Flipping stays a human ruling in the way #679's was ("ruled (delegated by Alan)"),
# never a self-mod round's editorial choice about a file it is already editing.
#
# WHY #669'S CLOSURE IS NOT THE ROUTE FOR THIS RECORD. #669 (measure structural code
# quality per self-mod landing) is the other zero-finding soak in this area, and it
# ended `up_next → done: hand sweep 2026-09-24 (stale)`. That route is REJECTED here,
# on its face: two automod triages had confirmed #669 and a hand sweep closed it as
# stale anyway, which erases a settled ruling instead of answering it — the owed-check
# that later went looking for its artifact found `scripts/code_quality_metrics.py`
# absent, because nothing had ever been measured. A soak that HAS been run fails the
# other way under the same treatment: the number is real and re-measurable, and a
# `done` item's activity log is the one place the next reader does not look. So the
# ruling lives here, in the file the rules live in, and #669's stale-close is not a
# reason to close this one. What retires this record is what #679 named: a confirmed
# real catch, or a human ruling to flip or delete a rule.
#
# ---------------------------------------------------------------------------
#
# The three rules every candidate had to clear to get in here (item #2574 step 2):
#   (a) its exception list is nameable in one line;
#   (b) it scores zero violators at HEAD, or the exceptions are written below;
#   (c) it names the incident or doc claim it encodes. An uncited rule is a load
#       error, and the loader refuses it — not a warning, not a tuning.
# Rules that did NOT qualify and why, so nobody re-derives the census:
#   a bare `datetime.now()` anywhere — 101 sites across app/, agent_mcp/,
#     scripts/, workers/ at HEAD 2026-10-11. An open set; a rule on the shape
#     would flag legitimate code in any round that touches those files.
#   an `except Exception:` whose body is a `pass` on the NEXT line — 132 sites.
#     Open set, so this file's rule is the same-line form only (2 sites).
#   a date filter comparing an epoch float where the row is an ISO string — needs
#     cross-expression semantics an `ast` pattern match cannot express. Not faked
#     with a name grep.
#   `kg.sqlite` as a literal anywhere — 20+ files; the store-ownership property
#     is over an open set. The rule below is the narrower `sqlite3.connect(...)`
#     call that names the store, which scores 1 allowlisted site.
# Cap: `MAX_RULES` in code_rules.py is 8. The item's ceiling.

[meta]
version = 1

[[rule]]
id = "guardian-import-hygiene"
matcher = "guardian_nonstdlib_import"
summary = """the guardian is staged as a flat snapshot of its own directory and runs \
on /usr/bin/python3, so an import that is not stdlib or not a module beside it is \
a watchdog that dies at boot on the machine that is already down."""
cite = """CLAUDE.md §Automod, 'Rules before touching it': 'The guardian is a \
systemd unit, stdlib-only on /usr/bin/python3, never imports app/' and 'A module \
it imports must live in that directory or it is not staged (§7)'."""
scope = ["agent-services/guardian/*.py"]
allow = []

[[rule]]
id = "opens-kg-store-outside-kg-store"
matcher = "opens_kg_store"
summary = """the knowledge graph has one owner: opening its store from anywhere \
else reaches past `app.kg_store`'s WAL/busy_timeout and its rebuild-transaction \
protocol, which is the same class as 2026-09-10's MEMORY.md clobber — a second \
writer that no single reader can see."""
cite = """CLAUDE.md §Knowledge graph: '`app.kg_store` is the only writer of the \
store — no script, router or fixture writes or opens it for a mutation.' The one \
allowed opener, the guardian's read-only `count_kg_rows` tripwire, is named there \
and opens no handle through `sqlite3.connect` on a restated path (#1525)."""
scope = ["**/*.py"]
exclude = ["app/kg_store.py"]          # the owner
allow = [
    { path = "tests/test_data_home.py", why = """§3's tripwire test: it opens a \
kg.sqlite it just created inside its own tmp_path scratch tree (#642), so the live \
store is never touched. Named here rather than scoped out because the doc claim \
above covers fixtures.""" },
]

[[rule]]
id = "broad-except-swallow-same-line"
matcher = "broad_except_swallow_same_line"
summary = """an `except <broad>: pass` on one line discards the exception where a \
reader cannot see it; the shape this encodes is a run that did nothing and exited \
0 being read as a clean run."""
cite = """#2574 step 2, which measured this as the only closed-set survivor of its \
three expected survivors (2 sites, 1 file, HEAD 2026-10-11), for the class #1667 \
is on the record about: a run that appended nothing and exited 0, indistinguishable \
from success. The multi-line form of the same shape is 132 sites at HEAD and is \
deliberately NOT this rule."""
scope = ["**/*.py"]
allow = [
    { path = "app/sessions_io.py", why = """two queue drains (the ambient-queue \
dedup cap and its `AMBIENT_QUEUE_CAP` trim) where the event `put_nowait` is \
best-effort and the turn is already marked preempted; both measured at HEAD \
2026-10-11 and both are the whole shape's population.""" },
]

[[rule]]
id = "naive-now-in-artifact-name"
matcher = "naive_now_in_artifact_name"
summary = """a no-arg `datetime.now()` is local wall clock, so a name or path \
built from one and read back by a later job is a naive timestamp in a \
machine-facing payload — every later reader takes it as UTC."""
cite = """#548's findings for round SM_20260916_022959: a `--rerender` flag took \
`datetime.now()` for both the artifact filename and its `captured:` line and so \
minted a second committed table claiming a capture time it never captured. The \
same class is the loaded-memory rule of 2026-09-21 ('a naive local timestamp \
inside a machine-facing payload is read as UTC by every later reader')."""
# Scope was "the code the supervisor runs" until #2810 took the widening #2574 left
# owed. The evidence was harm on disk, not the shape: the rebuild snapshot
# `~/lloyd-data/_pipeline/backups/rebuild-20260922T212107Z` names 21:21:07Z while
# `TZ=UTC stat` gives its mtime as 2026-09-23 04:21:08 +0000 — a 7-hour skew this
# file's own `kg_rebuild.py` wrote, and `:315` reads that name back out of saved
# state, so a resume trusts it. Worse on the quarantine names:
# `scripts/groundskeeper/retention-sweep.py:2806-2813` ages `facts-quarantine-*`
# directories on the `%Y%m%dT%H%M%SZ` in the NAME as UTC, so a locally-stamped name
# mis-ages a directory the sweep is allowed to delete. The 12 naive sites in the
# three roots added below were converted to an explicit `timezone.utc` in the same
# commit, so the widened scope has nothing to report on the tree it now reads.
#
# WHAT A ZERO OVER THESE ROOTS DOES NOT MEAN. The matcher fires only when the no-arg
# `now()` sits inside the path expression itself, so a stamp built through a variable
# — `ts = now()` on one line, `dir / f"x-{ts}.sqlite"` on the next — is invisible to
# it. Five sites in this scope are that shape: `scripts/memory/revert-suffix-merges.py:367`,
# `scripts/memory/seed_relationship_edges.py:332`,
# `scripts/memory/next-gen-memory/fact_extractor.py:900`,
# `scripts/memory/next-gen-memory/nightly_extraction.py:166` and
# `scripts/maintenance/qmd_index_maintenance.py:2565`. All five were converted by
# hand because of it, and all five would stay unreported if somebody put a naive
# clock back at them. Teaching the matcher the variable hop is #2810's other owed
# ruling; until that lands, 0 hits here means "no name built inline off a naive
# clock", not "no naive name".
scope = ["app/**", "agent_mcp/**", "workers/**", "server.py", "scripts/automod/**",
         "agent-services/**/*.py", "scripts/memory/**", "scripts/benchmark.py",
         "scripts/maintenance/**"]
allow = []

[[rule]]
id = "exports-lloyd-data-to-process-environ"
matcher = "process_environ_lloyd_data"
summary = """exporting the live data root into the process environment from \
ordinary code makes every child of that process — including a child running a \
worktree's code — write live data, which is the leak the data-root rules exist to \
prevent."""
cite = """architecture/data-home.md §3: 'Nothing exports `LLOYD_DATA` in \
production, and nothing should', with its owners named there as the gate, the \
canary and the test suite; restated in CLAUDE.md §Runtime data lives in \
~/lloyd-data, never in the tree ('Never export it from a shell profile or a \
launcher')."""
scope = ["**/*.py"]
allow = [
    { path = "tests/conftest.py", why = """the test suite is the third owner \
architecture/data-home.md §3 names: it points a test run at a scratch root for the \
whole process, which is what makes the live tree unreadable to the suite.""" },
    { path = "tests/test_youtube_artifact_phase.py", why = """restores a value it \
saved from its own process on teardown (#2519's scratch-root test); a save/restore \
inside one pytest process, not an export.""" },
]
