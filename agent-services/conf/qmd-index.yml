# qmd collection definitions — TRACKED REFERENCE COPY.
#
# The file the qmd daemon actually reads is ~/.config/qmd/index.yml. Nothing at
# runtime opens this one — there is no installer (git grep -n qmd-index HEAD
# finds only SETUP.md, architecture/subliminal.md and a report filename), so the
# only thing keeping the two files agreeing is the manual re-sync SETUP.md
# prescribes, in this direction, from the repo root, AFTER editing the live file:
#
#   cp ~/.config/qmd/index.yml agent-services/conf/qmd-index.yml
#
# scripts/maintenance/qmd_index_maintenance.py compares them nightly and writes
# the verdict into _pipeline/reflection/qmd-index-maintenance-<date>.json as
# `config_drift` (#1298). Between 2026-09-07 and 2026-09-19 nobody ran the
# re-sync: two hand-edits to the live file retargeted `sessions` onto the real
# export directory and dropped `facts`, and neither was recorded here, so the
# one file a restore or a new host reads described a collection set the daemon
# had stopped serving.
collections:
  facts:
    path: /home/alansrobotlab/obsidian/facts
    pattern: "**/*.md"
  memory:
    path: /home/alansrobotlab/obsidian/memory
    pattern: "**/*.md"
  knowledge:
    path: /home/alansrobotlab/obsidian/knowledge
    pattern: "**/*.md"
  projects:
    path: /home/alansrobotlab/obsidian/projects
    pattern: "**/*.md"
  lloyd:
    path: /home/alansrobotlab/obsidian/lloyd
    pattern: "**/*.md"
  personal:
    path: /home/alansrobotlab/obsidian/personal
    pattern: "**/*.md"
  work:
    path: /home/alansrobotlab/obsidian/work
    pattern: "**/*.md"
  skills:
    path: /home/alansrobotlab/obsidian/skills
    pattern: "**/*.md"
  people:
    path: /home/alansrobotlab/obsidian/people
    pattern: "**/*.md"
  subliminal:
    path: /home/alansrobotlab/obsidian
    pattern: "**/*.md"
    ignore:
      - agents/**
      - templates/**
  backlog:
    path: /home/alansrobotlab/obsidian/backlog
    pattern: "**/*.md"
  autonomy:
    path: /home/alansrobotlab/obsidian/autonomy
    pattern: "*.md"
  # Autonomy run records. architecture/autonomy-system.md claimed these were
  # indexed long before anything indexed them, so ~19 MB of diagnoses written by
  # tasks #67, #78 and #80 were unsearchable. Only current-format run_*.md
  # records; the 844 legacy epoch-named files are retention fodder, not knowledge.
  autonomy-runs:
    path: /home/alansrobotlab/lloyd-data/autonomy-runs
    pattern: "*/run_*.md"
  sessions:
    # The real session-recall export target: app/post_capture.py writes records
    # under app.paths.VAULT_SESSIONS_DIR (the data root, architecture/data-home.md) — not
    # ~/obsidian/sessions, which exists but is empty. ~650 indexed documents
    # live on this path; pointing the collection at the vault directory drops
    # every one of them from both the FTS and the vector legs (#1298).
    path: /home/alansrobotlab/lloyd-data/_pipeline/vault-derived/sessions
    pattern: "**/*.md"
  architecture:
    path: /home/alansrobotlab/obsidian/architecture
    pattern: "**/*.md"
models:
  embed: hf:Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
