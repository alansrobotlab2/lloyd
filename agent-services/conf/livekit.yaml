# LiveKit server config for Lloyd (local-only, dev keys).
# Bound to 127.0.0.1 — not reachable from other hosts without an explicit reverse
# proxy. Browser clients connect via ws://127.0.0.1:7880.
#
# Dev API key/secret. Rotate before exposing this server to anything beyond
# localhost.

port: 7880
bind_addresses:
  - 127.0.0.1

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

keys:
  lloyddevkey: lloyd-dev-secret-do-not-ship-replace-me-32chars-min

logging:
  level: info
  json: false

room:
  empty_timeout: 300       # auto-close empty rooms after 5 min
  departure_timeout: 20    # delay before considering a participant gone

webhook:
  api_key: lloyddevkey
  urls: []                 # add http://127.0.0.1:8080/api/webhooks/livekit in Phase 3
