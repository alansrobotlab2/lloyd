# LiveKit server config for Lloyd. Reached from LAN browsers via Vite's
# wss:///livekit ws-proxy (Vite terminates TLS, then forwards plain ws to
# 127.0.0.1:7880). Bind to 0.0.0.0 because RTC media (UDP 50000-50100) and
# the TCP fallback (7881) need to be reachable directly from LAN clients.
#
# API key/secret are sourced from <repo>/.env (LIVEKIT_API_KEY, LIVEKIT_API_SECRET)
# and substituted at startup by agent-services/bin/start-livekit-server.sh.
# Rotate via: bash scripts/gen-livekit-secrets.sh

port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Pin the ICE candidate to the Tailscale IP. Every tailnet client (LAN and
  # remote) reaches LiveKit media via this address. The host can also reach
  # itself at this IP through the local tailscale0 interface, so browsers on
  # the host machine still work. Trade-off: LAN-only clients (no Tailscale)
  # can't use voice — that's intentional for now.
  #
  # DO NOT HARDCODE THIS. The Tailscale address is reassigned (it changed
  # 100.72.151.100 -> 100.105.113.88 at the 08-22 box migration, which
  # silently killed all voice: LiveKit advertised an address the host no
  # longer owns, every ICE negotiation failed with `wait_pc_connection timed
  # out`, the agent never joined a room, and no audio ever reached ASR).
  # start-livekit-server.sh resolves ${LIVEKIT_NODE_IP} at boot from
  # `tailscale ip -4`, falling back to the default-route source address.
  node_ip: ${LIVEKIT_NODE_IP}
  use_external_ip: false

keys:
  # Substituted at startup by start-livekit-server.sh from .env
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

logging:
  level: info
  json: false

room:
  empty_timeout: 300       # auto-close empty rooms after 5 min
  departure_timeout: 20    # delay before considering a participant gone

webhook:
  # Must match a key in the `keys:` block above; signs webhook callbacks.
  api_key: ${LIVEKIT_API_KEY}
  urls: []                 # add http://127.0.0.1:8080/api/webhooks/livekit in Phase 3
