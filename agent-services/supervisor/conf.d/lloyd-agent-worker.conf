[program:lloyd-agent-worker]
command=/home/alansrobotlab/lloyd/.venvs/lloyd/bin/python /home/alansrobotlab/lloyd/agent-services/livekit_worker.py
directory=/home/alansrobotlab/lloyd
user=alansrobotlab
environment=HOME="/home/alansrobotlab",PYTHONUNBUFFERED="1"
autorestart=true
startsecs=3
startretries=3
autostart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/logs/lloyd-agent-worker.log
stderr_logfile=/home/alansrobotlab/lloyd/logs/lloyd-agent-worker.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
