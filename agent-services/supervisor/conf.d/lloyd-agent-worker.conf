[program:lloyd-agent-worker]
command=/home/alansrobotlab/lloyd/.venvs/lloyd/bin/python /home/alansrobotlab/lloyd/agent-services/livekit_worker.py
directory=/home/alansrobotlab/lloyd
user=alansrobotlab
; Pinned to GPU 0 (the desktop RTX 3090), NOT the RTX PRO 6000. This worker
; previously defaulted onto the PRO 6000 and grew 552 MiB -> 1.08 GiB, which
; starved vLLM and caused a CUDA OOM mid-request on 2026-09-03 12:07:52 (vLLM
; sizes gpu-memory-utilization once at startup, so a co-tenant that grows later
; has no slack to grow into). That is the constraint that still binds: keep it
; off GPU 1.
;
; It sat on GPU 2 until 2026-09-06, when the secondary slot became
; Qwen3.6-35B-A3B-UD-Q3_K_XL at the full 262144 window (~21.7 GiB of 24). That
; leaves no room for a 3.3 GiB co-tenant, so this moved to GPU 0 and GPU 2 is
; now single-tenant. GPU 0 also hosts the desktop, agent-tts and the qmd daemon
; (~8 GiB), so it has the headroom this does not.
;
; STT and VAD are both device: cpu in config.yaml — the VRAM comes from a
; dependency initialising a CUDA context, not from this file.
; CUDA_DEVICE_ORDER is mandatory — without it the runtime reorders by capability.
environment=HOME="/home/alansrobotlab",PYTHONUNBUFFERED="1",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0"
autorestart=true
startsecs=3
startretries=3
autostart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/logs/lloyd-agent-worker.log
stderr_logfile=/home/alansrobotlab/lloyd/logs/lloyd-agent-worker.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
