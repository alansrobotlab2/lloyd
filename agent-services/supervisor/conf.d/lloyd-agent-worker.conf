[program:lloyd-agent-worker]
command=/home/alansrobotlab/lloyd/.venvs/lloyd/bin/python /home/alansrobotlab/lloyd/agent-services/livekit_worker.py
directory=/home/alansrobotlab/lloyd
user=alansrobotlab
; Pinned to GPU 2 (idle RTX 3090). This worker previously defaulted onto the
; RTX PRO 6000 and grew 552 MiB -> 1.08 GiB, which starved vLLM and caused a
; CUDA OOM mid-request on 2026-09-03 12:07:52 (vLLM sizes gpu-memory-utilization
; once at startup, so a co-tenant that grows later has no slack to grow into).
; STT and VAD are both device: cpu in config.yaml — the VRAM comes from a
; dependency initialising a CUDA context, not from this file. GPU 0 is the other
; 3090 but already hosts the desktop and the qmd daemon; GPU 2 is idle.
; CUDA_DEVICE_ORDER is mandatory — without it the runtime reorders by capability.
environment=HOME="/home/alansrobotlab",PYTHONUNBUFFERED="1",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="2"
autorestart=true
startsecs=3
startretries=3
autostart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/logs/lloyd-agent-worker.log
stderr_logfile=/home/alansrobotlab/lloyd/logs/lloyd-agent-worker.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
