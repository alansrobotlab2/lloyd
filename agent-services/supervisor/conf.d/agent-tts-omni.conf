[program:agent-tts-omni]
command=/home/alansrobotlab/lloyd/agent-services/bin/start-qwen3-tts-omni.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
# Qwen3-TTS 1.7B Base on vLLM-Omni, :8093, GPU 3 (pinned by UUID — the
# launcher carries the same default). The server voice mode uses since
# 2026-10-09; `agent-tts` (:8090, GPU 0) is the previous engine, kept as the
# fallback. architecture/voice.md "The TTS server".
#
# startsecs 30: the two engines take ~2.5 min to come up and `/health` answers
# only at the end; supervisor's "started" is the process surviving its first
# half minute, not readiness. The worker gets connection refusals meanwhile,
# which it logs and drops — nothing hangs.
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="GPU-0bd41021-2916-fb5d-c100-5bdc5a9c41c0",LD_LIBRARY_PATH="/usr/lib:/opt/cuda/lib64"
autorestart=true
startsecs=30
startretries=3
autostart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-tts-omni.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-tts-omni.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
