[program:agent-llm-primary]
; The :8096 "primary slot". Exactly one model serves it at a time.
; Swap by pointing `command` at a different start script and running:
;   supervisorctl -c agent-services/supervisor/supervisord.conf reread
;   supervisorctl -c agent-services/supervisor/supervisord.conf update agent-llm-primary
; Previous occupant (revert target):
;   /home/alansrobotlab/lloyd/agent-services/bin/start-qwen3.8-27b-nvfp4.sh
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/bin/start-qwen38-flash-next.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
; startsecs must exceed the full cold boot (~240 s: 170 GiB read, 75.1 GiB to the
; card, 95.37 GiB N-gram table to host RAM, then compile + warmup). This is NOT
; the 27B's startsecs=5, deliberately: with a 5 s threshold supervisor marks the
; process RUNNING long before it can serve, so a crash during load counts as an
; unexpected exit and autorestart retries it forever — a 4-minute crash loop that
; pins the GPU. At 300 s a boot-time failure is a *start* failure instead, capped
; by startretries and parked in FATAL where it is visible.
; Cost: `supervisorctl start` takes ~300 s to report success. Poll :8096 instead.
startsecs=300
startretries=3
autostart=true
; 30 s is not enough to tear down 75 GiB of VRAM plus a 95 GiB host-RAM table;
; stopasgroup makes sure the PleOffloadWorker child goes with it.
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-llm-primary.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-llm-primary.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
