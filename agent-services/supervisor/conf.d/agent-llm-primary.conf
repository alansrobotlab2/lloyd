[program:agent-llm-primary]
; The :8096 "primary slot". Exactly one model serves it at a time.
; Swap by pointing `command` at a different start script and running:
;   supervisorctl -c agent-services/supervisor/supervisord.conf reread
;   supervisorctl -c agent-services/supervisor/supervisord.conf update agent-llm-primary
; Previous occupant (revert target):
;   /home/alansrobotlab/lloyd/agent-services/bin/start-qwen3.8-27b-nvfp4.sh
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/bin/start-qwen38-flash-next.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
; Since 2026-09-10 the slot serves from the vLLM-main venv (UVA PLE offload,
; setup/setup-vllm-flash-next-main.sh) with the KV cache in FP8: a x1.74 KV
; pool (692k tokens at the script's 11.5 GiB), and a 239k-token prefill in
; 26 s where the worker build took 149 s. Cost: the drafter accepts fewer
; tokens through the e4m3 cache, 0-17% slower decode by text type. The start
; script reads both variables and adapts everything else; drop them to boot
; the worker build exactly as before (its venv is kept for that). Measured
; in SETUP.md and the script's KV_CACHE_DTYPE comment.
;
; REBUILT 2026-09-17 at vLLM main dff1bde84dd6, same venv path: PR #55557 (the
; FP8 KV path) merged upstream, so the fork overlay is gone, and #55309's fused
; PLE/QSA kernels came with it. The 09-10 build is kept as the revert target —
; change VLLM_VENV below to /home/alansrobotlab/lloyd/.venvs/vllm-flash-next-main-0910
; and restart through `round restart --only agent-llm-primary`.
;
; MAX_NUM_BATCHED_TOKENS=4096 since 2026-09-10, half vLLM's default chunk
; budget. A cold 200k prompt admitted beside a decoding chat costs the chat one
; engine step per chunk: 608 ms p50 at 8192, 333 ms at 4096. And at 8192 the
; prefill transiently references ~2.5x its resident KV (0.90 of the pool beside
; one decoding stream), which is taken from the free pool where paused turns'
; cached prefixes wait; at 4096 that overshoot is gone. Cost: +7% prefill time
; (20.2 -> 21.6 s for 200k). 2048 cut the step to 195 ms for +27%. The arms are
; in architecture/vllm-throughput-mitigation.md §3.3; drop the variable to go
; back to 8192.
;
; KV_CACHE_MEMORY_BYTES=15032385536 (14.0 GiB) since 2026-09-15, over the
; script's 11.5 GiB default. The script's own history: 13.5 GiB OOMed on a
; prefill scratch allocation with ~1 GiB of card free at the 8192 chunk, and
; 11.5 GiB was the measured safe point at 3,057 MiB free. At the 4096 chunk
; above the card read 92,002 of 97,887 MiB at 11.5 GiB — 5,885 MiB free,
; nothing else resident on GPU 1 (the desktop, the TTS and llama.cpp are on
; the other two cards) — so 14.0 GiB leaves ~3,300 MiB, the same headroom as
; the measured safe point with half the transient. Expect ~840k FP8 tokens.
; Read bin/flash-next-bootfacts.sh after the boot; drop the variable to go
; back to the script's default.
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",VLLM_VENV="/home/alansrobotlab/lloyd/.venvs/vllm-flash-next-main",KV_CACHE_DTYPE="fp8",MAX_NUM_BATCHED_TOKENS="4096",KV_CACHE_MEMORY_BYTES="15032385536",LANGUAGE_MODEL_ONLY="0",MM_IMAGES_PER_PROMPT="20"
autorestart=true
; startsecs must exceed the full cold boot. Warm caches: ~240-265 s (170 GiB read,
; 75.1 GiB to the card, 95.37 GiB N-gram table to host RAM, then warmup). But a
; venv change empties the torch.compile / Triton cache and the first boot after
; one sat silent for ~8 minutes between "Model loading took" and the KV cache
; line — 775 s to health, measured 2026-09-10 on the vLLM-main venv. At 300 s
; supervisord would have called that boot a crash and, with autorestart, torn
; down a healthy-but-slow engine three times over. This is NOT the 27B's
; startsecs=5, deliberately: with a 5 s threshold supervisor marks the process
; RUNNING long before it can serve, so a crash during load counts as an
; unexpected exit and autorestart retries it forever — a 4-minute crash loop that
; pins the GPU. At 900 s a boot-time failure is a *start* failure instead, capped
; by startretries and parked in FATAL where it is visible.
; Cost: `supervisorctl start` takes up to 900 s to report success. Poll :8096.
startsecs=900
startretries=3
autostart=true
; 30 s is not enough to tear down 75 GiB of VRAM plus a 95 GiB host-RAM table;
; stopasgroup makes sure the PleOffloadWorker child goes with it.
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-llm-primary.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-llm-primary.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
