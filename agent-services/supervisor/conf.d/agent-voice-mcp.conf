[program:agent-voice-mcp]
command=/home/alansrobotlab/.local/bin/uv run voice_services.py --transport sse --port 8094
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=5
startretries=3
autostart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-voice-mcp.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-voice-mcp.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
