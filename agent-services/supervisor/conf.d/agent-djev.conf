; djev — DiffusionGemma 26B-A4B (NVFP4) structured reads on GPU 2.
;   :8010 vLLM (OpenAI API + /metrics), :8011 structured decisions.
;
; THIS FILE IS WHERE THE ENGINE'S TUNING LIVES. config.yaml carries `djev.enabled`
; and the two URLs the backend reads, and nothing else about how it runs — the
; context length, canvas, concurrency, KV pool and GPU are all `environment=`
; below, the way agent-llm-primary.conf carries the primary's. Two files that
; both claim to set an engine's context is how the secondary's config and the
; model it actually served drifted apart on 2026-09-06.
;
; autostart=false is deliberate and is NOT "disabled". server.py's boot
; reconcile (`_sync_llm_slots`) starts this program when `djev.enabled` is true
; and stops it when false, so autostart=true would mean supervisord loads 17.6
; GiB of weights onto GPU 2 at every boot and the backend kills it three
; seconds later — which is exactly what the secondary used to do. To turn djev
; on, set the flag in config.yaml and restart the backend; do not set
; autostart=true.
;
; GPU 2 holds this OR agent-llm-secondary, never both. Both flags true is
; refused by server.py, and start-djev.sh refuses on the VRAM check.

[program:agent-djev]
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/bin/start-djev.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",GPU="2",PORT="8010",STRUCTURED_PORT="8011",MAX_MODEL_LEN="81920",BATCH_INVARIANT="1",MAX_SEQS="1",CANVAS="128",GPU_UTIL="0.97",ATTN="TRITON_ATTN",KV_CACHE_DTYPE="bfloat16",VLLM_PORT="5300"
autostart=false
autorestart=true
; startsecs is how long the process must stay alive before supervisor calls it
; RUNNING; a death before that is a failed start, counted against startretries,
; and three in a row mark the unit FATAL. At 30 s it was below djev's measured
; time-to-death: on 2026-09-21 nine OOM boots each reached RUNNING at spawn+30 s
; and died at spawn+65..155 s (start-djev.sh's own "vllm exited during
; start-up"), each death "not expected" with a fresh retry budget, so supervisor
; showed RUNNING through 57 minutes of a crash loop and never went FATAL
; (#1359). 180 s clears every observed death; a warm boot is ready in 66-75 s.
; A cold torch.compile / Triton cache can make a boot minutes long, but that
; costs nothing here: the process stays alive while it loads, which is all
; startsecs asks — it only delays the RUNNING label.
startsecs=180
startretries=3
; vLLM does not exit promptly, and the script has two children to take with it.
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-djev.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-djev.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
