[program:agent-obsidian-sync]
command=/home/alansrobotlab/lloyd/agent-services/bin/start-obsidian-sync.sh
directory=/home/alansrobotlab
user=alansrobotlab
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.npm-global/bin:/home/alansrobotlab/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-obsidian-sync.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-obsidian-sync.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
