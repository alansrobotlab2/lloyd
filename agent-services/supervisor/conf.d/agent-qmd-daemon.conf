[program:agent-qmd-daemon]
; QMD_LLM_IDLE_TIMEOUT_MS=0 keeps the embedding model and reranker resident
; (~3 GB on GPU 0) instead of reloading them on the first query after five
; quiet minutes. QMD_RERANK_PARALLELISM=4 pins the reranker pool; left to
; itself it is sized from free VRAM at first use and came out at two.
; QMD_RERANK_WINDOW_CHARS=1200: the reranker reads a 1200-char window of each
; candidate's best chunk, opened at the first query term, instead of the whole
; ~900-token chunk. Pinned-corpus A/B, 2026-09-07 (qmd/WORKLOG.md 6.9):
;   whole chunk  MRR 0.484  NDCG@10 0.590   1848 ms
;   600          MRR 0.463  NDCG@10 0.550   1150 ms   <- the only one that loses
;   1200         MRR 0.504  NDCG@10 0.592   1338 ms   <- deployed
;   2400         MRR 0.528  NDCG@10 0.578   1610 ms
; n=20, so treat 0.02 as noise; 1200 is the size where nothing is worse and
; the reranked fan-out roughly halves. Unset it to rerank whole chunks.
; The fork in ~/lloyd/qmd (branch `lloyd`), built with `npm run build` there.
; Published 2.8.3 stays installed at
;   /home/alansrobotlab/.bun/install/global/node_modules/@tobilu/qmd/dist/cli/qmd.js
; and swapping this line back is the whole revert. Rebuild + restart to deploy
; a change in that tree; editing src/ alone changes nothing here.
command=/usr/bin/node /home/alansrobotlab/lloyd/qmd/dist/cli/qmd.js mcp --http --port 8181
directory=/home/alansrobotlab
user=alansrobotlab
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0",LD_LIBRARY_PATH="/usr/lib:/opt/cuda/lib64",CUDA_PATH="/opt/cuda",CUDA_HOME="/opt/cuda",PATH="/opt/cuda/bin:/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",QMD_LLAMA_GPU="cuda",QMD_LLM_IDLE_TIMEOUT_MS="0",QMD_RERANK_PARALLELISM="4",QMD_RERANK_WINDOW_CHARS="1200"
autorestart=true
startsecs=5
startretries=3
autostart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-qmd-daemon.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-qmd-daemon.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
