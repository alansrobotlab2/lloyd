[program:agent-livekit-server]
command=/home/alansrobotlab/lloyd/agent-services/bin/start-livekit-server.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",LIVEKIT_VERSION="1.11.0"
autorestart=true
startsecs=5
startretries=3
autostart=true
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-livekit-server.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-livekit-server.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
