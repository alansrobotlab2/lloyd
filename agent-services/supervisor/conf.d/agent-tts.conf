[program:agent-tts]
command=/home/alansrobotlab/lloyd/agent-services/bin/start-qwen3-tts.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
# TTS_LAZY_LOAD=false: load and compile at BOOT, not on the first thing anyone
# says. TTS_WARMUP_ON_START rides along but does nothing for this model -- it
# adds a 3-request warmup that logs "Skipping warmup: Base model has no custom
# voice available" -- so do not read it as the thing that fixed this. The
# compile happens inside backend init either way; eager init is the fix.
#
# The backend's default is lazy, and `compile_mode: max-autotune` in the
# (gitignored) qwen3-tts config.yaml means the first synthesis request pays the
# inductor autotune. Measured 2026-09-19: the stack restarted at 19:54, the
# first voice turn arrived at 20:04:42, and audio came out at 20:08:48 --
# 4 min 6 s, of which Warmup 1/3 streaming alone was 2 min 59 s. That config's
# own comment still claims "~75 s".
#
# The worker drains utterances serially through one client with read=120.0
# (livekit_worker.py, TTSStreamer._http), so the cold start does not just delay
# speech, it DISCARDS it: "One moment." timed out at 20:06:42 and "Honestly?" at
# 20:08:42, both exactly 120 s apart, and the answer to a 20:04:39 question was
# first heard at 20:08:56, starting mid-sentence.
#
# Cost of eager loading: the warmup runs inside uvicorn's lifespan, so :8090
# does not answer /health for ~4 min after a restart. That is the right place to
# spend it -- nobody is talking at boot.
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0",LD_LIBRARY_PATH="/usr/lib:/opt/cuda/lib64",TTS_LAZY_LOAD="false",TTS_WARMUP_ON_START="true"
autorestart=true
startsecs=10
startretries=3
autostart=true
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-tts.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-tts.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
