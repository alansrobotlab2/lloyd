[program:agent-tts]
command=/home/alansrobotlab/lloyd/agent-services/bin/start-qwen3-tts.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
# TTS_LAZY_LOAD=false: load and compile at BOOT, not on the first thing anyone
# says. TTS_WARMUP_ON_START rides along but does nothing for this model -- it
# adds a 3-request warmup that logs "Skipping warmup: Base model has no custom
# voice available" -- so do not read it as the thing that fixed this. The
# compile happens inside backend init either way; eager init is the fix.
#
# The backend's default is lazy, and `compile_mode: max-autotune` in the
# (gitignored) qwen3-tts config.yaml means the first synthesis request pays the
# inductor autotune. Measured 2026-09-19: the stack restarted at 19:54, the
# first voice turn arrived at 20:04:42, and audio came out at 20:08:48 --
# 4 min 6 s of first-voice-turn-to-audio latency, of which Warmup 1/3 streaming
# alone was 2 min 59 s. The vendored "~75 s" comment is ruled on further down.
#
# The worker drains utterances serially through one client with read=120.0
# (livekit_worker.py, TTSStreamer._http), so the cold start does not just delay
# speech, it DISCARDS it: "One moment." timed out at 20:06:42 and "Honestly?" at
# 20:08:42, both exactly 120 s apart, and the answer to a 20:04:39 question was
# first heard at 20:08:56, starting mid-sentence.
#
# Cost of eager loading: the warmup runs inside uvicorn's lifespan, so :8090
# does not answer /health for ~4 min after a restart. That is the right place to
# spend it -- nobody is talking at boot.
#
# CLOSED DECISION on the vendored comment: that same config.yaml carries an
# upstream comment saying "max-autotune gives the best throughput after a
# ~75 s compilation on first start". It is upstream's sentence in a gitignored
# clone (pin 783bf0e, see qwen3-tts-upstream-commit.txt), not ours, and the
# owed-check job has retired the ask to hand-edit it twice -- #2147 on
# 2026-10-07 ("this is the last pass that should file it") and #1446 on
# 2026-10-19. #3040's standing rule is that it is corrected only alongside a
# behavioural change to the vendored tree, never for a comment. It is named here
# so a reader who reaches for the figure knows where it came from: compile time
# is unmeasurable from the logs (the "[Decoder] Compiling forward with
# mode=max-autotune" markers sit in the timestamp-less stdout log), so 75 s is
# unrefuted -- and it is a compile figure, not a boot window.
#
# What the eager boot actually costs, measured off agent-tts.err by pairing each
# `lazy_load=` line with the next "Backend ready" and counting the "AUTOTUNE
# benchmarking" blocks between: the discriminator is the inductor autotune. An
# eager boot that ran it took 93-278 s (worst 2026-10-16 10:37:32 -> 10:42:10,
# 4 min 38 s); one whose inductor cache was warm took 10-50 s. Ranges, not boot
# counts -- three boots logged autotune blocks and still reached ready in
# 29-33 s, so any count of how many were cold is a reading of where the parse
# draws that line.
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0",LD_LIBRARY_PATH="/usr/lib:/opt/cuda/lib64",TTS_LAZY_LOAD="false",TTS_WARMUP_ON_START="true"
autorestart=true
startsecs=10
startretries=3
autostart=true
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-tts.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-tts.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
