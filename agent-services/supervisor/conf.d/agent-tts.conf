[program:agent-tts]
command=/home/alansrobotlab/lloyd/agent-services/bin/start-qwen3-tts.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0",LD_LIBRARY_PATH="/usr/lib:/opt/cuda/lib64"
autorestart=true
startsecs=10
startretries=3
autostart=true
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-tts.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-tts.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
