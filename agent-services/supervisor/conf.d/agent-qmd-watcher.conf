[program:agent-qmd-watcher]
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/scripts/qmd-watcher.sh
directory=/home/alansrobotlab
user=alansrobotlab
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0",CUDAARCHS="120",LD_LIBRARY_PATH="/opt/cuda/lib64:/usr/lib",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=5
startretries=3
autostart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-qmd-watcher.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-qmd-watcher.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
