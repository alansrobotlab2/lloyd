[program:lloyd-backend]
command=/home/alansrobotlab/lloyd/.venvs/lloyd/bin/python /home/alansrobotlab/lloyd/server.py
directory=/home/alansrobotlab/lloyd
user=alansrobotlab
; The LAST pair on the `environment=` line below switches the #2670 scheduled-task
; ceiling from SHADOW to ENFORCE. `app/scheduled_ceiling.mode()` reads that one
; variable and nothing else: unset, or any value but that word lower-cased, reads
; `shadow`, and a shadow turn records its would-strip names to
; scheduling/scheduled-ceiling.jsonl while dispatching nothing away — which is why a
; shadow transcript is indistinguishable from a turn that had no ceiling at all.
; ROLLBACK is that pair and nothing else: delete the trailing comma-separated pair
; from the line below (or set its value to `shadow`), then restart lloyd-backend and
; restart lloyd-mcp — both read the variable. The ledger stamps `mode` per dispatch
; dispatch from `mode()`, so the next row reads `shadow` again and the pre-flip
; bars of `python -m scripts.maintenance.scheduled_ceiling_flip_gate` evaluate over
; shadow rows exactly as before the flip. That round-trip is the drill in
; tests/test_scheduled_ceiling_service_unit.py.
; Both units have to carry it: the ceiling is compiled in whichever process
; dispatches the scheduled turn — this backend's autonomy ticker, or a tool-opened
; turn under the aggregator. A flip on one alone leaves the other half of the
; scheduled traffic in shadow while the ledger reports each process's own mode.
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/lloyd/.venvs/lloyd/bin:/home/alansrobotlab/.local/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/home/alansrobotlab/lloyd:/home/alansrobotlab/lloyd/scripts/intel-pipeline",ANTHROPIC_BASE_URL="http://127.0.0.1:8096",ANTHROPIC_API_KEY="no-key-required",ANTHROPIC_CUSTOM_MODEL_OPTION="Qwen3.5-122B-A10B",ANTHROPIC_CUSTOM_MODEL_OPTION_NAME="Qwen 122B Local",LLOYD_SCHEDULED_CEILING_MODE="enforce"
autorestart=true
; startsecs=25, not 5. The backend binds its socket well before
; @app.on_event("startup") finishes (autonomy ticker, worker pool, file
; watcher, secondary-LLM sync). At startsecs=5 supervisord marks it RUNNING
; during that window, so a failure at t=8s counts as an *unexpected exit*
; rather than a start failure — and unexpected exits are retried by
; autorestart forever, never reaching FATAL. That is the same pathology
; agent-llm-primary.conf documents at 300s, one tier down: a crash loop
; that looks RUNNING most times you sample it. At 25s a boot failure is a
; start failure, capped by startretries and parked in FATAL where the
; guardian can see it unambiguously.
; Consequence: `supervisorctl start` blocks 25s. Callers should use
; supervisor_client.restart_process(), which polls instead of blocking.
startsecs=25
startretries=3
autostart=true
stopwaitsecs=15
; stopasgroup/killasgroup are load-bearing for self-modification rollback.
; Without them a Bash tool's child process outlives the parent's stop and can
; still be writing into /home/alansrobotlab/lloyd while the guardian runs
; `git reset --hard` — producing a half-applied revert. Stop the hands before
; moving the floor.
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/server.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/server.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
