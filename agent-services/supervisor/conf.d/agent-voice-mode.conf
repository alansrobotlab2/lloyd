[program:agent-voice-mode]
command=/home/alansrobotlab/lloyd/.venvs/voice-mode/bin/python voice_mode.py --headless
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",CUDA_DEVICE_ORDER="PCI_BUS_ID",CUDA_VISIBLE_DEVICES="0",CUDA_PATH="/opt/cuda",LD_LIBRARY_PATH="/home/alansrobotlab/lloyd/.venvs/whisper/lib/python3.11/site-packages/nvidia/cudnn/lib:/home/alansrobotlab/lloyd/.venvs/whisper/lib/python3.11/site-packages/nvidia/cublas/lib:/run/host/usr/lib:/opt/cuda/lib64",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/cuda/bin"
# Held off during the LiveKit RTC migration (Phases 3-5). The local
# voice pipeline grabs /dev/snd/pcmC0D0c exclusively via PortAudio,
# which blocks the browser mic for WebRTC. Phase 6 retires this
# program entirely; until then, restart manually with:
#   supervisorctl start agent-voice-mode
autorestart=false
startsecs=5
startretries=3
autostart=false
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-voice-mode.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-voice-mode.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
