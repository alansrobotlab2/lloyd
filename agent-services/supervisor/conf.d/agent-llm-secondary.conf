[program:agent-llm-secondary]
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/bin/start-secondary.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=MODEL="qwen35",GPU="2",PORT="8091",HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=5
startretries=3
autostart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-llm-secondary.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-llm-secondary.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
