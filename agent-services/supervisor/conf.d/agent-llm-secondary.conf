[program:agent-llm-secondary]
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/bin/start-secondary.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=MODEL="qwen36",GPU="2",PORT="8091",HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/home/alansrobotlab/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=5
startretries=3
; false since 2026-09-20, with `secondary_enabled: false`. server.py's boot
; reconcile (`_sync_llm_slots`) is what starts and stops this program, so
; autostart=true only meant supervisord loaded 16.9 GiB of GGUF onto GPU 2 at
; every boot for the backend to kill three seconds later. To turn the
; secondary back on, set `secondary_enabled: true` in config.yaml and restart
; the backend — and set `djev.enabled: false` first, because they share GPU 2.
autostart=false
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-llm-secondary.log
stderr_logfile=/home/alansrobotlab/lloyd/agent-services/logs/agent-llm-secondary.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
