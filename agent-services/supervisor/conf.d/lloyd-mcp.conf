[program:lloyd-mcp]
command=/home/alansrobotlab/lloyd/.venvs/lloyd/bin/python -m agent_mcp.main
directory=/home/alansrobotlab/lloyd
environment=DISPLAY=":1",WAYLAND_DISPLAY="wayland-1",XDG_RUNTIME_DIR="/run/user/1000"
autostart=true
autorestart=true
; Was unset (supervisord default: 1s), which meant an aggregator that died
; during module import counted as an unexpected exit and retried forever
; instead of parking in FATAL. 15s covers importing all 21 tool modules.
startsecs=15
startretries=3
stopwaitsecs=15
; This process spawns a headful Chromium (playwright) and a Node bridge for
; Thunderbird. Without stopasgroup/killasgroup every restart orphaned one of
; each, and a rollback could reset the tree underneath a live child.
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd/logs/mcp.log
stderr_logfile=/home/alansrobotlab/lloyd/logs/mcp.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
