[program:lloyd-mcp]
command=/home/alansrobotlab/lloyd/.venvs/lloyd/bin/python -m agent_mcp.main
directory=/home/alansrobotlab/lloyd
; The LAST pair on the `environment=` line below switches the #2670 scheduled-task
; ceiling from SHADOW to ENFORCE — the same flip
; agent-services/supervisor/conf.d/lloyd-backend.conf documents, and it has to be taken
; HERE TOO: the ceiling is compiled in whichever process dispatches the scheduled turn,
; and this aggregator is one of the two candidates. Flipping one unit alone leaves the
; other half of the scheduled traffic in shadow.
; ROLLBACK: delete the trailing comma-separated pair from this line, then restart
; lloyd-mcp and lloyd-backend (both read it). The ledger stamps `mode` per dispatch from
; `mode()`, so the next row reads `shadow` again and the pre-flip bars of `python -m
; scripts.maintenance.scheduled_ceiling_flip_gate` evaluate over shadow rows exactly as
; before the flip. That round-trip is the drill in
; tests/test_scheduled_ceiling_service_unit.py.
environment=DISPLAY=":1",WAYLAND_DISPLAY="wayland-1",XDG_RUNTIME_DIR="/run/user/1000",LLOYD_SCHEDULED_CEILING_MODE="enforce"
autostart=true
autorestart=true
; Was unset (supervisord default: 1s), which meant an aggregator that died
; during module import counted as an unexpected exit and retried forever
; instead of parking in FATAL. 15s covers importing all 21 tool modules.
startsecs=15
startretries=3
stopwaitsecs=15
; This process spawns a headful Chromium (playwright) and a Node bridge for
; Thunderbird. Without stopasgroup/killasgroup every restart orphaned one of
; each, and a rollback could reset the tree underneath a live child.
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/mcp.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/mcp.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
