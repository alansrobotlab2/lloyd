; decider — decider-35b-a3b (NVFP4) typed decisions on GPU 2, :8012.
;   One process: decider.serve_vllm with vLLM in-process. POST /v1/systemone,
;   GET /health /stats /v1/models.
;
; A CANDIDATE, NOT A SERVICE YET. Nothing in the backend reads :8012, no flag in
; config.yaml starts it, and server.py's boot reconcile (`_sync_llm_slots`) does
; not know it exists. It is started and stopped by hand while it is measured
; against djev:
;
;   supervisorctl ... stop agent-djev          (GPU 2 holds one tenant)
;   supervisorctl ... reread && supervisorctl ... update
;   supervisorctl ... start agent-decider
;
; "By hand" means a person, or an attended chat session — the Mission Control Start
; button, or a terminal. It does NOT mean a worker, autonomy or self-modification
; round turn: `app/harness/service_control.py` refuses a background session (a
; four-part id, `…_autocode_…`) BOTH the `supervisorctl start` / `stop` above AND
; the hand boot of the launcher this unit's `command=` runs, because hand-running
; that script is the same act as restarting a live engine — it is in that module's
; `_LAUNCHERS` for exactly that reason. The same call returns None for an attended
; (three-part) id: a person bringing the stack up or down is the intended operator.
; So the three lines above are an operator's, and a round refused them is meeting a
; ruling, not missing plumbing — #2716's owed check weighed the block on 2026-10-18
; and kept it, changing no rail.
;
; What an unattended turn CAN do is exercise the guard this launcher exists to run,
; its free-VRAM check, against a card that is not there:
; `tests/test_llm_slot_vram_preflight.py` drives the script with a PATH-shimmed
; `nvidia-smi` and a fake engine binary (`decider_fakes`, `boot_decider`). The live
; card is not that surface — a boot that succeeds while djev holds GPU 2 displaces
; the ranker, which is the outcome the paragraph above exists to prevent.
;
; autostart=false for the same reason as agent-djev: GPU 2 holds this OR djev OR
; the Qwen3.6 secondary, and a boot-time start would race whichever of them the
; backend's reconcile brings up. start-decider.sh refuses on the VRAM check.
;
; VARIANT picks the checkpoint: "35b" (decider-35b-a3b NVFP4), "4b" (decider-4b
; v2.1 bf16) or "4b-v2" (decider-4b v2 bf16). Switching is an edit here plus
; `reread` and `update`, which
; restarts the program onto the other model.
;
; Tuning lives in start-decider.sh's defaults and header, and in environment=
; below once a boot has been measured — the same rule as agent-djev.conf: one
; file says how the engine runs.

[program:agent-decider]
command=/bin/bash /home/alansrobotlab/lloyd/agent-services/bin/start-decider.sh
directory=/home/alansrobotlab/lloyd/agent-services
user=alansrobotlab
environment=HOME="/home/alansrobotlab",PATH="/home/alansrobotlab/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",GPU="2",PORT="8012",VLLM_PORT="5310",VARIANT="35b"
autostart=false
autorestart=true
; djev's measured lesson (#1359): a boot that dies during loading must die
; inside startsecs, or supervisor calls a crash loop RUNNING with a fresh retry
; budget each time. A 35B load with Marlin repacking, profiling, graph capture
; and serve_vllm's warm-up is minutes on a cold cache.
startsecs=300
startretries=2
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-decider.log
stderr_logfile=/home/alansrobotlab/lloyd-data/logs/services/agent-decider.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
