<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #00d9ff;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.4;
    }
    .status.success {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }
    .status.error {
      background: rgba(255, 85, 85, 0.15);
      border: 1px solid rgba(255, 85, 85, 0.3);
      color: #ff5555;
    }
    .status.info {
      background: rgba(0, 217, 255, 0.15);
      border: 1px solid rgba(0, 217, 255, 0.3);
      color: #00d9ff;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
      color: #1a1a2e;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .video-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .video-info .label {
      color: #888;
      margin-bottom: 4px;
    }
    .video-info .value {
      color: #eaeaea;
      word-break: break-all;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #00d9ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🎥 Lloyd YouTube Capture</h1>
  
  <div id="status" class="status info">
    Click to capture the current video
  </div>
  
  <div id="videoInfo" class="video-info" style="display: none;">
    <div class="label">Video:</div>
    <div class="value" id="videoTitle">Loading...</div>
  </div>
  
  <button id="captureBtn">Capture to Vault</button>

  <script src="popup.js"></script>
</body>
</html>
