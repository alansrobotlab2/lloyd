agent:
  max_turns: 60
  permission_mode: bypassPermissions
inner_voice:
  # Inner Voice (#345) — parallel cognitive process. Stage 0 ships
  # event-log infrastructure only; Brain 2 ensembles + heuristics land in
  # Stages 1–5. The `enabled` flag gates Brain 2 — never on for Chat tab,
  # only on for Inner Voice tab sessions (also flagged via session JSON
  # `inner_voice: true`).
  enabled: false
  model: primary  # Brain 2 model alias; same endpoint as Brain 1 in v1.

  # Stage 1 (no Brain 2). Wired in heuristics.py.
  # Deny rules: regex-matched against the tool's input. Tool name must
  # match exactly. Pattern is case-insensitive multi-line. Reason surfaces
  # in the SDK's deny error to the model.
  #
  # The third rule's regex was rewritten from the spec — the original
  # `> /dev/null \d?>?&?\d? <FILE>.md` shape didn't actually match any
  # truncate-redirect against sentinel files. Current pattern matches any
  # `>` redirect into a path ending in CONFIG.md / MEMORY.md / USER.md /
  # SOUL.md, e.g. `> MEMORY.md`, `> ~/obsidian/lloyd/MEMORY.md`,
  # `: > MEMORY.md`. See app/inner_voice/heuristics.py docstring.
  pretooluse_deny:
    - tool: Bash
      pattern: 'rm\s+-rf\s+.*(?:obsidian|\.openclaw|agent-services|\.venvs|lloyd)'
      reason: "destructive deletion against guarded path"
    - tool: Bash
      pattern: 'git\s+push\s+.*--force.*(?:main|master)'
      reason: "force push to default branch"
    - tool: Bash
      pattern: '>\s*\S*(?:CONFIG|MEMORY|USER|SOUL)\.md\b'
      reason: "redirect-truncate of sentinel file"
  ambient_completion_check: true

  # Stage 2+ (Brain 2 ensembles).
  ensemble:
    default: autonomy_default
    sets:
      autonomy_default: [completion_checker, drift_detector, continuation_drive]
      safety_critical:  [adversarial_red_team, completion_checker, hallucination_flag]
      code_writing:     [drift_detector, completion_checker]
      research_writing: [hallucination_flag, completion_checker, drift_detector]

  # Per-Brain-2-call inference parameters. Reasoning-token consumption is
  # the dominant failure mode on local; prefill + max_tokens cap + closed
  # thinking forces JSON commitment. See knowledge/local-llm-gotchas.
  critic:
    max_tokens: 2500
    thinking_forced_open: false
    prefill: '{"disagrees":'
    timeout_seconds: 5
    json_retry_on_parse_failure: 1
    transcript_window_turns: 5
    include_brain1_thinking: false   # do NOT anchor Brain 2 on Brain 1's reasoning

  disagreement:
    severity_threshold: 0.6        # min severity for steer
    count_threshold: 2             # alt: N personas of M flag
    veto_severity_threshold: 0.85  # required for interrupt or termination veto

  consensus_termination:
    enabled: true
    brain2_timeout_default_to_brain1: true
    three_strike_accept: true
    hard_max_turns: 60

  throughput:
    max_concurrent_personas: 5
    max_critiques_per_session: 50
    max_nudges_per_session: 2
    cool_down_after_escalation_seconds: 60

  brain2_kv_cache_dtype: q4_0

  # Event log — STAGE 0 OPERATIONAL. Captures `brain1.*` events on every
  # session (Chat + Inner Voice tabs). Disk-cheap, never overwritten,
  # exempt from session cleanup. Read with scripts/meta_review/replay.py
  # or GET /api/inner_voice/event_log.
  event_log:
    enabled: true
    stream_sample_tokens: 50      # currently sampled per-delta in messages.py
    blob_threshold_bytes: 4096    # large fields → content-addressed store
    rotation_days: 30             # gzip rotation TBD; manual prune for now
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ~/obsidian/facts/experiments
  ledger_path: ~/lloyd/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    # Lowered from 0.6 to 0.5 on 2026-05-01 per #344 investigation —
    # bench composition makes 0.6 unreachable (avg variant win rate ~30%
    # across 1,557 variants). 89 of 208 variants in last 30 rounds beat
    # baseline mean composite but were rejected; 46 of those held purely
    # on win-fraction. See knowledge/lloyd/autoresearch-promotion-floor.md
    # for full analysis. Watch promotion rate + false-positive rate over
    # next 30 rounds; raise to 0.55 if false-positive rate > 30%.
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ~/lloyd/_pipeline/research
  rounds_dir: ~/lloyd/_pipeline/research/rounds
  snapshots_dir: ~/lloyd/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ~/lloyd/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ${DISCORD_OWNER_ID}
  reactions: true
  require_mention: true
  token: ${DISCORD_BOT_TOKEN}
display:
  personality: kawaii
  streaming: true
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - browser_screenshot
    - pipeline_dispatch
    - pipeline_status
    - pipeline_abort
    name: lloyd-mcp
    type: sse
    url: http://127.0.0.1:8500/sse
model:
  default: primary
models:
  claude-haiku-4-5-20251001:
    alias: haiku
    context_length: 200000
    display_name: Claude Haiku 4.5
    env: {}
  claude-opus-4-7:
    alias: opus
    context_length: 200000
    display_name: Claude Opus 4.7
    effort: high
    env: {}
  claude-sonnet-4-6:
    alias: sonnet
    context_length: 200000
    display_name: Claude Sonnet 4.6
    env: {}
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    context_length: 262144
    display_name: Primary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
server:
  host: 0.0.0.0
  port: 8080
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
tools:
  disabled_builtin:
  - WebSearch
  - WebFetch
workers:
  db_path: ~/lloyd/workers.db
  enabled: true
  max_attempts: 3
  priority_proxy_url: http://127.0.0.1:8097
  slots: 8
  sources:
    autoresearch:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
    domain-research:
      enabled: true
      interval_seconds: 600
      max_inflight: 1
      max_duration_seconds: 600
    gap-fill:
      enabled: true
      interval_seconds: 300
      max_inflight: 2
      max_duration_seconds: 600
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_duration_seconds: 1200
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 300
  staging_root: ~/obsidian/pending-research
  worker_priority: 2
