agent:
  max_turns: 60
  permission_mode: bypassPermissions
inner_voice:
  model: primary
  observer:
    # Per-call cap on observer LLM output (it answers in JSON; no need for more).
    max_tokens: 400
    # Wall-clock cap for the observer's call on iteration / tool boundaries.
    timeout_seconds: 5
    # Tighter cap for the synchronous PreToolUse gate (blocks tool dispatch).
    pretool_timeout_seconds: 3
    # Per-turn intervention budget. After this many inject/cancel/ambient
    # actions, the observer can only noop. Pretool denies don't count.
    intervention_budget: 3
    # Window of accumulated primary text the observer sees in its prompt.
    primary_text_window_chars: 4000
    rotation_days: 30
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ~/obsidian/facts/experiments
  ledger_path: ~/lloyd/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ~/lloyd/_pipeline/research
  rounds_dir: ~/lloyd/_pipeline/research/rounds
  snapshots_dir: ~/lloyd/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ~/lloyd/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ${DISCORD_OWNER_ID}
  reactions: true
  require_mention: true
  token: ${DISCORD_BOT_TOKEN}
display:
  personality: kawaii
  streaming: true
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - browser_screenshot
    name: lloyd-mcp
    type: sse
    url: http://127.0.0.1:8500/sse
model:
  default: primary
compaction:
  # mode: summarize | truncate
  #   summarize → LLM-based summarization of older history when above
  #               threshold (falls back to truncate on any failure)
  #   truncate  → drop-oldest only (legacy behavior; no LLM call)
  mode: summarize
  # Model alias used for summarization. Empty/null → falls back to the
  # global default model (primary). Setting this lets you point compact
  # at a smaller/cheaper local model if one is configured.
  summary_model: primary
  # Number of most-recent turns kept verbatim past the summary boundary.
  # The summary covers everything older.
  keep_recent_turns: 5
  microcompact:
    enabled: true
    keep_recent_tools: 5     # most-recent compactable tool results kept inline
    count_threshold: 20      # microcompact fires when count exceeds this
    # Compactable tool list. Falls back to module default if null/empty.
    compactable_tools: [Read, Bash, Grep, Glob, Edit, Write]
  restore:
    enabled: true
    budget_tokens: 50000     # total budget across all restored files
    max_per_file: 5000
    max_files: 5
  manual:
    # Manual /compact uses a tighter buffer than auto, since the user
    # explicitly asked to compact and is willing to fill more of the
    # context window. Currently informational; the manual handler
    # bypasses the threshold check entirely.
    buffer_tokens: 3000
harness:
  stream_chunk_timeout_seconds: 60
  max_tools_per_request: 128
subagents:
  general-purpose:
    system_prompt: ''
    max_turns: 20
    disallowed_tools: []
    model: primary
    base_url: ''
  read-only:
    system_prompt: You are a read-only research assistant. You may use Read, Grep,
      Glob, and Bash (read-only commands only). Do not write, edit, or delete files.
    max_turns: 15
    disallowed_tools:
    - Write
    - Edit
    - Bash
    model: primary
    base_url: ''
models:
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    context_length: 262144
    display_name: Primary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
server:
  host: 0.0.0.0
  port: 8080
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
workers:
  db_path: ~/lloyd/workers.db
  enabled: true
  max_attempts: 3
  priority_proxy_url: http://127.0.0.1:8097
  slots: 8
  sources:
    autoresearch:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
    domain-research:
      enabled: true
      interval_seconds: 600
      max_inflight: 1
      max_duration_seconds: 600
    gap-fill:
      enabled: true
      interval_seconds: 300
      max_inflight: 2
      max_duration_seconds: 600
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_duration_seconds: 1200
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 300
  staging_root: ~/obsidian/pending-research
  worker_priority: 2
