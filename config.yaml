agent:
  max_turns: 60
  # Upper bound on a per-request `max_turns` to POST /api/message/stream.
  # Worker-driven turns ask for more room than a chat turn (the unattended
  # backlog triage needs ~90; three hand-driven ones used 45, 65 and 76). The
  # ceiling is what stops a tailnet client asking for an unbounded turn.
  max_turns_ceiling: 120
  permission_mode: bypassPermissions
# Authoritative switch for the secondary LLM slot (:8091, Qwen3.6-35B-A3B
# UD-Q3_K_XL on GPU 2's RTX 3090). server.py reconciles the supervisord process
# against this on every boot, so it overrides supervisord's own autostart —
# leaving it false silently stopped the secondary 3 seconds after each backend
# restart.
#
# This slot is llama.cpp, not vLLM (2026-09-06): a GGUF Q3 is the only build of
# Qwen3.6-35B-A3B that fits 24 GB at the full 262144 window. It serves the same
# OpenAI API, so nothing downstream changed — but it reports `llamacpp:` metrics
# rather than `vllm:` ones (app/vllm_metrics.py translates them) and it renders
# preserved thinking from `reasoning_content`, not `reasoning`
# (app/harness/loop.py sends both).
secondary_enabled: true
inner_voice:
  # Pinned to primary deliberately. `secondary_enabled: true` (2026-09-03,
  # de893d7) made resolve_model_alias stop rewriting secondary -> primary,
  # which silently moved the observer from Flash-Next to Qwen3.5-4B. On the
  # first day it ran there it intervened on 40% of LLM-judged events vs 1.7%
  # on primary, fabricated a finding the primary never reported, and cancelled
  # a turn. Revisit only with iv_grade evidence.
  #
  # That evidence is now stale in the observer's favour: the secondary became
  # Qwen3.6-35B-A3B on 2026-09-06, so the 40%-intervention result was measured
  # against a 4B model this slot no longer runs. The pin stays until someone
  # actually re-runs iv_grade against the 35B — but the reason to re-run it is
  # much stronger than it was.
  model: primary
  observer:
    max_tokens: 400
    timeout_seconds: 5
    intervention_budget: 3
    primary_text_window_chars: 4000
    # vLLM scheduling priority. LOWER is higher priority and the primary
    # submits at 0, so the observer must be >0 to actually yield to it.
    priority: 1
    fast_path_enabled: true
    # Pretool cannot block dispatch (hard safety lives in
    # app/harness/safety.py), so an LLM judgment there only produces a
    # nudge that lands after the tool already ran. Observation-only.
    pretool_llm_enabled: false
    # Judge one benign tool result in N; errors, spilled payloads, todo
    # flips and the stalled-progress gate always escalate.
    tool_result_sample_every: 5
    tool_result_escalate_bytes: 20000
    # Run non-terminal judgments off the harness's critical path.
    async_nonterminal: true
    async_drain_timeout_seconds: 6.0
    # Nudge the primary to converge as it approaches harness max_turns.
    iteration_pressure_enabled: true
    iteration_pressure_threshold: 0.8
    # Carry prior turns' interventions into the observer's prompt.
    cross_turn_memory_enabled: true
    cross_turn_memory_limit: 6
    # Show the primary the goal card it is being judged against.
    goal_card_to_primary: true
    # Deterministic repetition guard. Compares the identifiers in each
    # proposed tool call against the recent ones; fires when the same target
    # is queried `repetition_threshold`+1 times inside `repetition_window`.
    # Costs no LLM call, so it runs even with pretool judgment off — it is
    # the only place the observer sees tool ARGUMENTS, and a loop is
    # invisible in the tool name and result alone.
    repetition_guard_enabled: true
    repetition_window: 6
    repetition_threshold: 2
    # Escalate an otherwise fast-pathed assistant_message to LLM judgment
    # after this many consecutive iterations with no user-visible text.
    # 0 disables. The primary produced 33 in a row on 2026-09-04 and nothing
    # with a whole-turn view ever looked.
    silent_iterations_before_review: 10
    # Minimum primary iterations between two discretionary injects.
    # bypass_budget injects (stall rescue, repetition) are exempt.
    inject_cooldown_iterations: 4
    # Ceiling on DETERMINISTIC injects (stall rescue, repetition) per turn.
    # Those bypass the discretionary budget by design, which left nothing
    # bounding a miscalibrated guard: on 2026-09-04 the repetition guard
    # fired 19 times in one evening. Exempt from the budget, not unbounded.
    deterministic_inject_budget: 5
    # Deadline for judgments that run OFF the harness's critical path. The
    # primary is not waiting on these, so the tight `timeout_seconds` that
    # protects the two synchronous terminal calls only threw the work away —
    # all 7 observer errors on 2026-09-04 were `timeout after 5.0s`, every
    # one on a spawned non-terminal call. `async_drain_timeout_seconds` is
    # the real bound at the next terminal event.
    async_timeout_seconds: 12
  todo_stewardship:
    enabled: true
    completion_gate: true
    mark_without_evidence: true
    # Nudge when the primary has run N tool calls without advancing any todo.
    # Complements the repetition guard: that one catches re-running the same
    # query, this one catches busy-but-not-converging with distinct calls.
    stalled_progress: true
    stalled_after_tool_calls: 5
  goal:
    max_attempts: 10
    eval_timeout_seconds: 8
    eval_max_tokens: 300
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ~/lloyd/_pipeline/vault-derived/facts/Experiments
  ledger_path: ~/lloyd/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ~/lloyd/_pipeline/research
  rounds_dir: ~/lloyd/_pipeline/research/rounds
  snapshots_dir: ~/lloyd/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ~/lloyd/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ''
  reactions: true
  require_mention: true
  token: ''
display:
  personality: kawaii
  streaming: true
# Few-word session titles, written by the secondary after a turn completes
# (app/session_titles.py). They are what the chat history, the dashboard's
# agent panel, the Inner Voice picker and the chat header render instead of
# a timestamp id. Off means those surfaces fall back to the preview text.
session_titles:
  enabled: true
# Code graph (agent_mcp/code_graph.py). Structural navigation over
# graphify's deterministic AST extraction — who calls this, what breaks if
# I change it. Built on demand into the gitignored graphify-out/ of
# whichever tree is asked about; no LLM calls, ~15s for this repo.
# There is deliberately no `enabled` flag: the kill switch is
# mcp_servers.lloyd-mcp.disabled_tools, and an enabled:false that emptied
# list_tools() would break the annotation-staleness test in
# tests/test_mcp_layer.py.
code_graph:
  graphify_bin: ~/.local/bin/graphify
  # Rebuild a stale graph on first use. The dirty-file rule matters most
  # inside a selfmod round, where HEAD does not move while the model edits.
  auto_refresh: true
  refresh_timeout_s: 120
  # Floor between automatic rebuilds triggered by uncommitted edits. Below
  # this the query answers from the existing graph and says it is stale.
  min_refresh_interval_s: 30
  max_cached_roots: 4
  max_lines: 60
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - discord_get_home_channel
    - discord_list_channels
    - discord_send
    - discord_send_embed
    name: lloyd-mcp
    type: streamable-http
    url: http://127.0.0.1:8500/mcp
model:
  default: primary
compaction:
  mode: summarize
  summary_model: primary
  keep_recent_turns: 5
  microcompact:
    enabled: true
    # Budget-driven since 2026-09-05. Below `trigger_fraction` of the
    # truncation threshold this pass does nothing; above it, it clears the
    # OLDEST tool results one at a time until the conversation is back
    # under `target_fraction`, spilling each to disk first so the marker
    # can name the file. The old count-only rule cleared 93 of 97 results
    # on a review using 17% of its context window.
    trigger_fraction: 0.8
    target_fraction: 0.6
    # Floor on results kept inline. A code review's working set is 15-25
    # files; the old default of 5 was below the point of usefulness.
    keep_recent_tools: 15
    # Clearing a result smaller than this saves fewer tokens than the
    # marker replacing it costs.
    min_chars_to_clear: 2000
    # Legacy; no longer a trigger. app.compaction passes the budget
    # instead and disables the count rule outright.
    count_threshold: 20
    compactable_tools:
    - Read
    - Bash
    - Grep
    - Glob
    - Edit
    - Write
  restore:
    enabled: true
    budget_tokens: 50000
    max_per_file: 5000
    max_files: 5
  manual:
    buffer_tokens: 3000
harness:
  stream_chunk_timeout_seconds: 60
  # Re-anchor session.todos this often (in agent-loop iterations) when
  # items are still open and the list has gone untouched. The system
  # prompt's <active_todos> block is frozen at turn start, so a turn that
  # creates its own list would otherwise never see it again. 0 disables.
  todo_anchor_interval_iterations: 10
  # Preserved thinking. Carry this many recent iterations' reasoning back
  # into history as each assistant message's `reasoning` field, which
  # Qwen3.8-Flash-Next renders into that turn's <think> block. Its model
  # card calls preserved thinking out as reducing redundant reasoning in
  # agent loops; the harness dropped it entirely until 2026-09-05, so the
  # model saw 50+ prior turns in which it had apparently thought nothing.
  # Bounded because reasoning is not free: an unbounded window on a long
  # review turn would push peak context past the microcompaction trigger,
  # and microcompaction can only clear tool results. 0 disables.
  preserve_thinking_iterations: 6
  # Thinking trace. Persist each agent-loop iteration's reasoning phase as
  # its own `role="thinking"` session entry, so the chat timeline can show
  # a "Thought for 11.8s" row where the thinking actually happened. Before
  # this, one buffer held the current phase and each new phase replaced it,
  # flushing to disk only on an iteration that produced both tool calls and
  # text — so a forty-iteration turn persisted exactly one phase, the last.
  # `role="thinking"` is what keeps these rows out of every transcript
  # generated from the logs — each producer branches on role and none has
  # a case for it — and it is also not a conversation role, so compaction
  # drops them and they never re-enter the prompt. false restores the old
  # behaviour.
  thinking_trace:
    enabled: true
  # Tool-call summaries. Adds a `summary` string parameter to every
  # advertised tool — a short phrase the model writes describing what the
  # call is doing, rendered beside the tool name in the chat and Inner
  # Voice transcripts. Display metadata only: the harness strips it before
  # dispatch and before the call is replayed back as history, so no tool
  # ever receives it. false removes the parameter from every schema and the
  # UI falls back to the bare tool name.
  tool_call_summaries: true
  # Read-before-edit and stale-file gates (agent_mcp/builtin_fs.py). An
  # Edit against a file this session has never Read is a guess; an Edit
  # against one that changed since the Read still matches its old_string and
  # silently reverts whoever wrote in between. Both are refused with an error
  # that says what to do. Creating a new file with Write needs no Read.
  # false keeps the read records but stops refusing.
  edit_gates:
    enabled: true
  # Per-turn record of what a chat turn wrote, with the pre-image beside it,
  # so the chat can say "changed 2 files" and offer to put them back.
  # `~/lloyd` is production — a saved file is a deploy — and until this
  # existed an ordinary turn had no such line and no undo. Off for workers
  # and direct run_query callers: they have no turn id and no reader.
  change_ledger:
    enabled: true
    retention_days: 7
    max_total_mb: 256
  # Diagnostics appended to a successful Edit/Write result, so the model
  # learns about a broken edit at the edit rather than at the gate minutes
  # later. Delta only: the tree carries ~69 tolerated pyflakes findings and
  # reporting them every time would train the model to skip the block.
  # `python` runs pyflakes in-process; `typescript` queues a debounced tsc
  # whose new errors arrive as a notification on a later iteration.
  edit_diagnostics:
    python: true
    typescript: true
    max_lines: 30
  # Structured final answer. When a caller passes RunOptions.final_schema
  # (today: the backlog triage worker), the loop runs one extra completion
  # after the turn ends that restates the verdict as a JSON object. These
  # bound that request; the schema itself is a per-caller contract, never
  # config. Inert for every caller that sends no schema.
  finalizer:
    max_tokens: 1024
    timeout_seconds: 180
  # Concurrent tool dispatch, for READ-ONLY batches only. A batch runs
  # concurrently when EVERY call in it is annotated readOnlyHint (or is a
  # parse error, or ToolSearch); any Bash, Edit, Write or mutating MCP tool
  # in the batch makes the whole batch sequential. Read-only-only because
  # that is the only classification available that is not a guess — see
  # agent_mcp/annotations.py, and note that `Bash(cat ...)` is exactly the
  # shell-command classification the safety hook refuses to attempt.
  # Off until soaked: watch `mcp_pool:` warnings, `[iv.observer] inject`
  # placement in transcripts, and harness.empty_terminal_iteration counts.
  parallel_tool_calls:
    enabled: false
    max_concurrency: 4
  tool_search:
    enabled: false
    threshold_tools: 30
    baseline_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    - skills_search
    - skills_read
    - Bash
    - http_fetch
    - http_request
    - http_search
    - browser_navigate
    - browser_snapshot
    - vault_write
    - vault_recall
    - mc_get_state
    - mc_navigate
    # Code navigation. Paired with data/tool_overrides.yaml in live — the
    # override shadows this key wholesale, so an unpaired edit here means the
    # baseline a fresh clone boots into differs from the one being served,
    # which is what test_config_yaml_agrees_with_the_live_override catches.
    - graph_explain
    - graph_affected
    - ide_open_folder
    - ide_open_file
    - ide_close_tab
    - Task
    - vault_search
    - TodoWrite
    - ambient_decide
    - mc_close_modal
    - SetGoal
    max_results_default: 5
    max_results_cap: 20
subagents:
  general-purpose:
    system_prompt: ''
    # 20 was too low for read-heavy delegation: a review subagent spent
    # all 20 turns reading and returned nothing (session
    # 20260905_151355_iv5174, 231s wasted). Task now reports budget
    # exhaustion as an error rather than an empty answer, but the budget
    # itself also needed room to finish.
    max_turns: 40
    disallowed_tools: []
    # Empty means "inherit the calling turn's model" (agent_mcp/builtin_task.py
    # reads it from the request `_meta`), falling back to `primary` when Task
    # is invoked outside a harness turn. It was pinned to `primary`, so a turn
    # running on the secondary delegated its subagents to the primary and the
    # secondary was never exercised by the fan-out work Task exists for.
    # Re-pin to an alias here to force a specific model for this profile.
    model: ''
    base_url: ''
  read-only:
    system_prompt: You are a read-only research assistant. You may use Read, Grep,
      Glob, and Bash (read-only commands only). Do not write, edit, or delete files.
    max_turns: 30
    disallowed_tools:
    - Write
    - Edit
    - Bash
    model: ''
    base_url: ''
models:
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    context_length: 262144
    display_name: Primary (Local)
    # Case-insensitive substring matched against what the engine reports
    # (vLLM `/v1/models`.root, llama.cpp `/props`.model_path). Checked at
    # boot by app/model_identity.py and on demand via
    # GET /api/models/identity. Update it whenever the slot's occupant
    # changes, otherwise the check just cries wolf.
    expect_model: Qwen3.8-Flash-Next
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    # llama.cpp serves this slot (see agent-services/bin/start-secondary.sh,
    # MODEL=qwen36). The `qwen35` branch of that same script serves a 4B
    # under this identical alias and port, so a reverted launcher is
    # invisible without this check.
    expect_model: Qwen3.6-35B-A3B
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
# Guardian alert behaviour. Read by agent-services/bin/sync-voice-config.py at
# guardian stage time, NOT by the backend — the guardian cannot parse yaml, so
# settings are pushed to it rather than pulled.
guardian:
  voice:
    # Quiet hours for SPOKEN ALERTS ONLY. Deliberately not under livekit.tts:
    # voice mode must stay conversational at any hour, and this must never
    # reach livekit_worker. Inside the window the toast, journal, ledger,
    # vault note and backlog task all still fire — only the sound is withheld,
    # so nothing is lost, it is just waiting in the morning.
    quiet_hours:
      enabled: true
      start: 23              # local hour speech stops
      end: 7                 # local hour it resumes (wraps midnight)
      allow_critical: false  # true = a rollback still wakes you

livekit:
  url: ws://127.0.0.1:7880
  api_key: ${LIVEKIT_API_KEY}
  api_secret: ${LIVEKIT_API_SECRET}
  room_prefix: lloyd-
  agent_identity: lloyd-agent
  stt:
    model: base.en
    device: cpu
    compute_type: int8
    language: en
    beam_size: 1
    hotwords_file: ~/obsidian/hotwords.md
  tts:
    api_url: http://127.0.0.1:8090
    model: qwen3-tts
    # Cloned voice: Dave Cullen (The Dave Cullen Show, @TheDaveCullenShow).
    # Profile: agent-services/services/tts/qwen3-tts/voice_library/profiles/dave_cullen/
    # Provenance + measurements: ~/obsidian/projects/lloyd/voice/voice-source-dave-cullen.md
    # Was `Ryan` (built-in) after the 08-22 rebuild destroyed the old clone:cullen
    # profile.  `Ryan` still works as a fallback, but needs the CustomVoice model —
    # switching back to it means the backend swaps models on the next request.
    voice: clone:dave_cullen
    # Set by ear, not by the words/second match.  Matching Dave's 2.06 w/s put
    # this at 0.70 and that is audibly too slow — the metric is misleading
    # because his reference clip is one deliberate segment and the model places
    # its pauses differently, so the same w/s is a different perceived pace.
    # For the record, one synthesis stretched to each setting:
    #   0.70 -> 2.70 w/s   0.80 -> 3.09   0.85 -> 3.28   0.90 -> 3.47   1.00 -> 3.87
    # Every one of those is already *faster* than Dave's 2.06 by that measure.
    #
    # Applied client-side by livekit_worker, NOT by the server: the server's
    # streaming path (`generate_voice_clone_streaming`) takes no speed argument
    # and silently drops it, so until 2026-09-06 voice mode spoke at 1.0 no
    # matter what this said.  See agent-services/tts_shaping.py.
    speed: 0.85
    sample_rate: 24000
    skip_empty: true
    # Silence appended to every utterance.  _stream_utterance returns once the
    # audio is *queued*, not played, so whatever ran next — an `interrupt()`
    # calling `clear_queue()`, the room going quiet — was cutting the last
    # syllable off.  Padding puts silence in that position instead of speech.
    tail_silence_ms: 250
    # Corrective EQ on the synthesised audio.  The 12 Hz speech tokenizer
    # matches the reference speaker to within 0.5 dB below 1.5 kHz and then
    # rolls off — -1.8 dB at 2 kHz, -3.9 dB at 4 kHz, -6.2 dB above 9 kHz —
    # which is the "he's in a broom closet" sound.  Two high shelves put the
    # presence band back; fitted against the profile's own reference clip, they
    # land BOX and spectral centroid on the real speaker's numbers.
    #
    # This is a vocoder property, not a bad reference: built-in voices with no
    # cloning measure the same, and re-cutting from a second source video did
    # not move it.  Do NOT "fix" it by cutting 300 Hz — that band already
    # matches the reference to 0.1 dB, and cutting it trades hollow for thin.
    shaping:
      presence_eq: true
      shelves:
        - {freq: 1800, gain_db: 2.75, q: 1.0}
        - {freq: 8000, gain_db: 4.0, q: 0.7}
  vad:
    speech_rms: 0.025
    min_speech_frames_to_start: 3
    min_voiced_ratio: 0.3
    silence_ms: 500
    min_utterance_ms: 350
    max_utterance_ms: 30000
  wake:
    enabled: true
    words:
    - lloyd
    - hey lloyd
    - hi lloyd
    - okay lloyd
    - hello lloyd
    continuation_seconds: 6.0
    skip_inject_if_only_wake_word: true
  acoustic_wake:
    enabled: true
    models_dir: agent-services/models/wakeword
    engine_dir: agent-services/models/openwakeword
    threshold: 0.4
  voiceprint:
    enabled: true
    profiles_dir: ~/lloyd/voice_profiles
    profile_threshold: 0.75
    anchor_threshold: 0.4
    device: cpu
    unknown_label: Unknown
# Self-modification loop: worktree -> gate -> promote, with guardian rollback.
# `enabled: false` is the master switch and the default. The machinery lands
# inert; turning it on is a deliberate human act.
selfmod:
  # Enabled 2026-09-06, after the autonomous path was fixed. It had shipped
  # inert since it was written, and the two landings in its history were both
  # driven from a terminal — the MCP path would have failed on first use,
  # because the promoter ran inside the process it restarts.
  enabled: true
  # A round may only be opened from a turn with Inner Voice attached. Two
  # reasons: the observer watches the one activity that rewrites production,
  # and an IV session is the only kind the Inner Voice tab lists, so this is
  # what makes a round reviewable afterwards rather than just a ledger row and
  # a diff. `selfmod_start` enables the flag and refuses once, because the
  # observer attaches at turn start and cannot be added to a turn in flight.
  # The CLI is exempt: no bound session, and a human is their own observer.
  require_inner_voice: true
  canary:
    backend_port: 18080
    mcp_port: 18500
    boot_timeout_s: 180
    smoke_timeout_s: 240
  gate:
    pytest_min_collected: 1000
    mcp_min_tools_excl_thunderbird: 80
  landing:
    idle_max_wait_s: 900
    idle_quiet_polls: 3
    drain_ttl_s: 180
    liveness_window_s: 120
    errors_window_s: 900

server:
  host: 0.0.0.0
  port: 8080
services:
  backend: http://127.0.0.1:8080
  lloyd_mcp: http://127.0.0.1:8500/mcp
  qmd: http://localhost:8181/query
youtube:
  transcript_fallback_chain:
  - youtube_transcript_api
  - browser_evaluate_transcript_extractor
  - vtt_parsing
  max_retries: 5
  retry_delay_seconds: 2
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
workers:
  db_path: ~/lloyd/workers.db
  enabled: true
  max_attempts: 3
  slots: 2
  sources:
    # OFF since 2026-09-08. This source promoted generated prompt variants
    # straight over the live `lloyd/SOUL.md` / `MEMORY.md` every hour with no
    # gate, no test, no review and no revert. It is what produced the #464
    # MEMORY.md clobber, and at 09:54 on 2026-09-08 it overwrote the operating
    # contract *during* the round that was trimming it — re-inflating the gate
    # stack to 64% ninety minutes after #377 cut it to 48%, with a variant
    # whose own hypothesis was "add negative constraints to fix the shape
    # benchmarks", the technique #377 was filed against.
    #
    # `promote()` now refuses a variant that breaks the prompt-surface
    # invariants and commits what it does apply through `selfmod_vault_land`,
    # so the writer is bounded rather than removed. It stays off until backlog
    # #506 closes the rest — `variant.json` written with `json.dump`, and the
    # snapshot directory wired up as a real rollback target. Flip `enabled` to
    # re-arm; nothing else needs changing.
    autoresearch:
      enabled: false
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    # Behavioural-regression check for a landed self-modification. Off until
    # the loop itself is enabled — it is a no-op without a promotion under
    # observation, but there is no reason to schedule it before then.
    selfmod-regression:
      # Enabled as a POST-LANDING check, not a gate rung. The gate's canary is
      # deliberately data-isolated (its own empty scratch vault), so a quality
      # eval run there would score an empty corpus and measure nothing. This
      # has to run against live data in a separate worktree, which is what the
      # paired A/B does. It measures once per promotion and dedups on the
      # commit, so an hourly interval means "shortly after a landing", not
      # hourly evals.
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    # Re-checks one backlog item per run against the system as it is today.
    # Read-only: it reaches a verdict and retires stale items, and never
    # implements anything — confirmed items go through the selfmod gate as a
    # separate, explicit act.
    #
    # 1800 -> 3600 on 2026-09-08. At 30 minutes this pass is a net PRODUCER of
    # backlog: its first 40 runs closed 28 items and filed 78 (R = 1.95), and
    # because spawned items are written `draft` — an OPEN status — every one
    # re-entered the queue it came from. The open board went 19 -> 122 in 48
    # hours with 110 of the 122 self-filed. `backlog.is_quarantined` is the
    # actual fix; this interval is the second half of it. Triage is a pass
    # over a finite stale backlog, not a service, and once it has worked
    # through that backlog the right cadence is "occasionally", not "twice an
    # hour" — it now reports how many items it is holding rather than
    # claiming the board is clear.
    backlog-selfmod:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      # Runs as a real session through /api/message/stream, so it has Inner
      # Voice and a transcript. Budgets are measured, not guessed: the three
      # hand-driven triages took 45, 65 and 76 iterations and 8-30 minutes.
      max_duration_seconds: 3600
      max_turns: 90
      # The item body is truncated from the END, which is where appended triage
      # sections live, so the original content survives. 6000 cut more than
      # half of the oldest item on the board.
      body_chars: 30000
      # Ask the harness to restate the finished turn's verdict as a JSON
      # object under scripts/selfmod/backlog.TRIAGE_VERDICT_SCHEMA, instead of
      # relying on a regex over `VERDICT:` lines. The text block stays in the
      # prompt and the regex stays as the fallback — the finalizer is skipped
      # whenever the turn did not end of its own accord, and a verdict
      # pipeline with no fallback turns a transient engine error into a lost
      # triage. The ledger records `verdict_source` so the fallback rate is
      # visible rather than the two being indistinguishable.
      structured_verdict: true
    # Picks up items triage has CONFIRMED (with an acceptance check) and runs
    # one selfmod round on each through the normal gate. This is the only
    # automated path from a backlog item to landed code, and it is gated
    # hard: refuses while a promotion is under observation, while halted or
    # broken, or while a round is open. One item per run, oldest first.
    #
    # 14400 -> 3600 on 2026-09-08. Four hours made the only drain in this
    # system eight times rarer than the pass that fills it, which is the wrong
    # way round whatever the spawn rate is. It cannot actually run hourly —
    # `_loop_is_free` refuses while a round is open or a promotion is under
    # observation, and a round plus its 15-minute window is most of an hour —
    # so this is "try as soon as the loop is free", with the gates doing the
    # throttling. That is the correct place for it: they know whether a round
    # is safe to start and a clock does not.
    backlog-implement:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 3600
      max_turns: 100
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
    # Researches one registry topic per run through the deep-dive-research
    # skill, and records the outcome back on the topic. Replaces
    # `domain-research`, whose prompt never told the model to search the web:
    # 142 notes, 90 of them empty, none ever promoted. Left disabled until the
    # legacy import has run — an empty registry makes it a no-op either way.
    # One tracked YouTube video per real session (Inner Voice on): the
    # script fetches the transcript into a bundle, the session reads it,
    # writes the vault note, judges it against eval/lloyd_profile.md and
    # files a draft backlog item when something would improve Lloyd.
    # Replaces autonomy task #75's script-only digest for both channels.
    # `batch` is how many sit queued at once (refilled each tick), not a
    # daily cap; `max_inflight: 1` keeps one primary-heavy turn at a time.
    youtube-digest:
      enabled: true
      interval_seconds: 300
      max_inflight: 1
      # 45, not the source default of 60: scheduled-task maps autonomy
      # priorities critical/high/medium/low/background to 10/20/30/50/70
      # and may hold both slots, so at 60 a digest only ran in the gaps
      # between due autonomy tasks — three sat queued for 25 minutes on
      # 2026-09-09 while two low-priority KG jobs held both slots. At 45
      # with max_inflight 1 the digest takes one slot whenever it has work
      # and beats low/background autonomy work for it; medium and above,
      # and a selfmod implement round (40), still go first.
      priority: 45
      max_duration_seconds: 1800
      max_turns: 40
      batch: 3
      inner_voice: true
      channels: [ai-engineer, discover-ai]
    deep-research:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      # The turn's own budget is this minus POOL_TIMEOUT_MARGIN_SECONDS, so it
      # cancels itself in the backend rather than being cancelled from outside.
      max_duration_seconds: 1800
      max_turns: 60
      # A hard ceiling on GPU spent researching per day. The registry can hold
      # 40 topics; without this, one night's proposals become one day's work.
      daily_max: 3
    gap-fill:
      enabled: true
      interval_seconds: 300
      max_inflight: 2
      max_duration_seconds: 600
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_inflight: 2
      # BOTH caps apply, min wins: the task-level timeout_seconds in the .md
      # frontmatter is enforced by autonomy.run_task, this source-level cap by
      # pool.py's asyncio.wait_for. See USER.md tool_reliability "Timeout caps".
      # 1800 -> 3600 on 2026-09-03 (autonomy audit): when the two caps were equal
      # the POOL timer won the race, cancelling run_task with CancelledError so its
      # own handler never ran — no run record, no activity-log line, task file left
      # in_progress (237 such runs / 73.6 GPU-h in workers.db had a NULL task_id).
      # run_task now derives an effective timeout of (this cap - 30s), so the task
      # handler always wins; this headroom also lets #39 (2400s) and #81 (5700s)
      # actually finish instead of being deterministically killed.
      max_duration_seconds: 3600
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 600
  staging_root: ~/lloyd/_pipeline/vault-derived/pending-research

# Fact writes through the fact_add MCP tool. The rebuild sets this
# false so a chat turn cannot add a fact to a tree about to be renamed.
knowledge_graph:
  write_enabled: true
