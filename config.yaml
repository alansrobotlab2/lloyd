agent:
  max_turns: 60
  permission_mode: bypassPermissions
inner_voice:
  enabled: false
  model: primary
  pretooluse_deny:
  - tool: Bash
    pattern: rm\s+-rf\s+.*(?:obsidian|\.openclaw|agent-services|\.venvs|lloyd)
    reason: destructive deletion against guarded path
  - tool: Bash
    pattern: git\s+push\s+.*--force.*(?:main|master)
    reason: force push to default branch
  - tool: Bash
    pattern: '>\s*\S*(?:CONFIG|MEMORY|USER|SOUL)\.md\b'
    reason: redirect-truncate of sentinel file
  ambient_completion_check: true
  ensemble:
    default: autonomy_default
    sets:
      autonomy_default:
      - completion_checker
      - drift_detector
      - continuation_drive
      - skill_recall_checker
      safety_critical:
      - adversarial_red_team
      - completion_checker
      - hallucination_flag
      code_writing:
      - drift_detector
      - completion_checker
      research_writing:
      - hallucination_flag
      - completion_checker
      - drift_detector
      - skill_recall_checker
  critic:
    max_tokens: 2500
    thinking_forced_open: false
    prefill: '{"disagrees":'
    timeout_seconds: 5
    json_retry_on_parse_failure: 1
    transcript_window_turns: 5
    include_brain1_thinking: false
  disagreement:
    severity_threshold: 0.6
    count_threshold: 2
    veto_severity_threshold: 0.85
  mid_turn_drift:
    enabled: true
    min_chars_before_first_check: 250
    check_every_chars: 500
    max_checks_per_turn: 4
  consensus_termination:
    enabled: true
    brain2_timeout_default_to_brain1: true
    three_strike_accept: true
    hard_max_turns: 60
  self_correct_on_nudge: true
  intra_turn:
    enabled: true
    post_tool_use:
      enabled: true
      severity_floor_for_steer: 0.7
      severity_floor_for_cancel: 0.95
      max_calls_per_turn: 5
    progress_monitor:
      enabled: true
      every_n_tool_calls: 5
      every_n_seconds: 60
      severity_floor_for_steer: 0.6
      max_calls_per_turn: 4
  grading:
    enabled: true
    persona: grader
    max_per_session_per_run: 3
    only_grade_within_turns: 5
  throughput:
    max_concurrent_personas: 5
    max_critiques_per_session: 50
    max_nudges_per_session: 2
    cool_down_after_escalation_seconds: 60
  brain2_kv_cache_dtype: q4_0
  event_log:
    enabled: true
    stream_sample_tokens: 50
    blob_threshold_bytes: 4096
    rotation_days: 30
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ~/obsidian/facts/experiments
  ledger_path: ~/lloyd/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ~/lloyd/_pipeline/research
  rounds_dir: ~/lloyd/_pipeline/research/rounds
  snapshots_dir: ~/lloyd/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ~/lloyd/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ${DISCORD_OWNER_ID}
  reactions: true
  require_mention: true
  token: ${DISCORD_BOT_TOKEN}
display:
  personality: kawaii
  streaming: true
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - pipeline_dispatch
    - pipeline_status
    - pipeline_abort
    - browser_screenshot
    name: lloyd-mcp
    type: sse
    url: http://127.0.0.1:8500/sse
model:
  default: primary
harness:
  stream_chunk_timeout_seconds: 60
  max_tools_per_request: 128
subagents:
  general-purpose:
    system_prompt: ''
    max_turns: 20
    disallowed_tools: []
    model: primary
    base_url: ''
  read-only:
    system_prompt: You are a read-only research assistant. You may use Read, Grep,
      Glob, and Bash (read-only commands only). Do not write, edit, or delete files.
    max_turns: 15
    disallowed_tools:
    - Write
    - Edit
    - Bash
    model: primary
    base_url: ''
models:
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    context_length: 262144
    display_name: Primary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
server:
  host: 0.0.0.0
  port: 8080
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
workers:
  db_path: ~/lloyd/workers.db
  enabled: true
  max_attempts: 3
  priority_proxy_url: http://127.0.0.1:8097
  slots: 8
  sources:
    autoresearch:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
    domain-research:
      enabled: true
      interval_seconds: 600
      max_inflight: 1
      max_duration_seconds: 600
    gap-fill:
      enabled: true
      interval_seconds: 300
      max_inflight: 2
      max_duration_seconds: 600
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_duration_seconds: 1200
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 300
  staging_root: ~/obsidian/pending-research
  worker_priority: 2
