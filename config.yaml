# Lloyd Configuration
# Clean-slate agent powered by Claude Agent SDK

# ── Model defaults ────────────────────────────────────────────────────────────
model:
  default: Qwen3.5-122B-A10B

models:
  Qwen3.5-122B-A10B:
    alias: 122b
    display_name: "Qwen 122B Local"
    base_url: "http://127.0.0.1:8096"
    context_length: 262144
    env:
      ANTHROPIC_BASE_URL: "http://127.0.0.1:8096"
      ANTHROPIC_API_KEY: "no-key-required"
      ANTHROPIC_CUSTOM_MODEL_OPTION: "Qwen3.5-122B-A10B"
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: "Qwen 122B"

  Qwen3.5-35B-A3B:
    alias: 35b
    display_name: "Qwen 35B Local"
    base_url: "http://127.0.0.1:8091"
    context_length: 262144
    env:
      ANTHROPIC_BASE_URL: "http://127.0.0.1:8091"
      ANTHROPIC_API_KEY: "no-key-required"
      ANTHROPIC_CUSTOM_MODEL_OPTION: "Qwen3.5-35B-A3B"
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: "Qwen 35B"

  claude-sonnet-4-6:
    alias: sonnet
    display_name: "Claude Sonnet 4.6"
    context_length: 200000
    env: {}

  claude-opus-4-6:
    alias: opus
    display_name: "Claude Opus 4.6"
    context_length: 200000
    env: {}

  claude-haiku-4-5-20251001:
    alias: haiku
    display_name: "Claude Haiku 4.5"
    context_length: 200000
    env: {}

# ── Agent settings ────────────────────────────────────────────────────────────
agent:
  max_turns: 60
  permission_mode: bypassPermissions

# ── MCP servers ───────────────────────────────────────────────────────────────
mcp_servers:
  lloyd:
    type: sse
    url: http://127.0.0.1:8500/sse

# ── Autonomy ──────────────────────────────────────────────────────────────────
autonomy:
  enabled: false
  tick_interval: 60
  task_dir: ~/obsidian/autonomy

# ── Skills ────────────────────────────────────────────────────────────────────
skills:
  directories:
    - ~/obsidian/skills
    - ~/lloyd/skills

# ── Usage ────────────────────────────────────────────────────────────────────
# The Usage tab pings Anthropic (tiny haiku call) to get real rate-limit
# utilization from the API response headers. No manual allocation config needed.

# ── Display ───────────────────────────────────────────────────────────────────
display:
  personality: kawaii
  streaming: true

# ── Server ────────────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8080
