agent:
  max_turns: 60
  permission_mode: bypassPermissions
inner_voice:
  model: secondary
  observer:
    max_tokens: 400
    timeout_seconds: 5
    pretool_timeout_seconds: 3
    intervention_budget: 3
    primary_text_window_chars: 4000
    rotation_days: 30
  todo_stewardship:
    enabled: true
    completion_gate: true
    mark_without_evidence: true
    stalled_progress: false
    stalled_after_tool_calls: 5
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ~/lloyd/_pipeline/vault-derived/facts/experiments
  ledger_path: ~/lloyd/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ~/lloyd/_pipeline/research
  rounds_dir: ~/lloyd/_pipeline/research/rounds
  snapshots_dir: ~/lloyd/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ~/lloyd/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ''
  reactions: true
  require_mention: true
  token: ''
display:
  personality: kawaii
  streaming: true
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - browser_screenshot
    - discord_get_home_channel
    - discord_list_channels
    - discord_send
    - discord_send_embed
    name: lloyd-mcp
    type: sse
    url: http://127.0.0.1:8500/sse
model:
  default: primary
compaction:
  mode: summarize
  summary_model: primary
  keep_recent_turns: 5
  microcompact:
    enabled: true
    keep_recent_tools: 5
    count_threshold: 20
    compactable_tools:
    - Read
    - Bash
    - Grep
    - Glob
    - Edit
    - Write
  restore:
    enabled: true
    budget_tokens: 50000
    max_per_file: 5000
    max_files: 5
  manual:
    buffer_tokens: 3000
harness:
  stream_chunk_timeout_seconds: 60
  max_tools_per_request: 128
  tool_search:
    enabled: true
    threshold_tools: 30
    baseline_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    - skills_search
    - skills_read
    - Bash
    - http_fetch
    - http_request
    - http_search
    - vault_write
    - vault_recall
    - mc_get_state
    - mc_navigate
    - ide_open_folder
    - ide_open_file
    - ide_close_tab
    - Task
    - vault_search
    - TodoWrite
    max_results_default: 5
    max_results_cap: 20
subagents:
  general-purpose:
    system_prompt: ''
    max_turns: 20
    disallowed_tools: []
    model: primary
    base_url: ''
  read-only:
    system_prompt: You are a read-only research assistant. You may use Read, Grep,
      Glob, and Bash (read-only commands only). Do not write, edit, or delete files.
    max_turns: 15
    disallowed_tools:
    - Write
    - Edit
    - Bash
    model: primary
    base_url: ''
models:
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    context_length: 262144
    display_name: Primary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
livekit:
  url: ws://127.0.0.1:7880
  api_key: lloyd_1eec02918cf4
  api_secret: JHjfOpGpwxNs6R4YIx_3dFeoL_XDuC4w7u7QZNWfxfXIs4mp
  room_prefix: lloyd-
  agent_identity: lloyd-agent
  stt:
    model: base.en
    device: cpu
    compute_type: int8
    language: en
    beam_size: 1
    hotwords_file: ~/obsidian/hotwords.md
  tts:
    api_url: http://127.0.0.1:8090
    model: qwen3-tts
    voice: clone:cullen
    speed: 1.0
    sample_rate: 24000
    skip_empty: true
  vad:
    speech_rms: 0.025
    min_speech_frames_to_start: 3
    min_voiced_ratio: 0.3
    silence_ms: 500
    min_utterance_ms: 350
    max_utterance_ms: 30000
  wake:
    enabled: true
    words:
    - lloyd
    - hey lloyd
    - hi lloyd
    - okay lloyd
    - hello lloyd
    continuation_seconds: 6.0
    skip_inject_if_only_wake_word: true
  acoustic_wake:
    enabled: true
    models_dir: agent-services/models/wakeword
    engine_dir: agent-services/models/openwakeword
    threshold: 0.55
  voiceprint:
    enabled: true
    profiles_dir: ~/lloyd/voice_profiles
    profile_threshold: 0.75
    anchor_threshold: 0.4
    device: cpu
    unknown_label: Unknown
server:
  host: 0.0.0.0
  port: 8080
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
workers:
  db_path: ~/lloyd/workers.db
  enabled: true
  max_attempts: 3
  slots: 4
  sources:
    autoresearch:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
    domain-research:
      enabled: true
      interval_seconds: 600
      max_inflight: 1
      max_duration_seconds: 600
    gap-fill:
      enabled: true
      interval_seconds: 300
      max_inflight: 2
      max_duration_seconds: 600
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_inflight: 2
      max_duration_seconds: 1200
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 600
  staging_root: ~/lloyd/_pipeline/vault-derived/pending-research
