agent:
  max_turns: 60
  permission_mode: bypassPermissions
inner_voice:
  model: primary
  observer:
    max_tokens: 400
    timeout_seconds: 5
    pretool_timeout_seconds: 3
    intervention_budget: 3
    primary_text_window_chars: 4000
    rotation_days: 30
  todo_stewardship:
    enabled: true
    completion_gate: true
    mark_without_evidence: true
    stalled_progress: false
    stalled_after_tool_calls: 5
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ~/obsidian/facts/experiments
  ledger_path: ~/lloyd/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ~/lloyd/_pipeline/research
  rounds_dir: ~/lloyd/_pipeline/research/rounds
  snapshots_dir: ~/lloyd/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ~/lloyd/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ${DISCORD_OWNER_ID}
  reactions: true
  require_mention: true
  token: ${DISCORD_BOT_TOKEN}
display:
  personality: kawaii
  streaming: true
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - browser_screenshot
    - discord_get_home_channel
    - discord_list_channels
    - discord_send
    - discord_send_embed
    name: lloyd-mcp
    type: sse
    url: http://127.0.0.1:8500/sse
model:
  default: primary
compaction:
  mode: summarize
  summary_model: primary
  keep_recent_turns: 5
  microcompact:
    enabled: true
    keep_recent_tools: 5
    count_threshold: 20
    compactable_tools:
    - Read
    - Bash
    - Grep
    - Glob
    - Edit
    - Write
  restore:
    enabled: true
    budget_tokens: 50000
    max_per_file: 5000
    max_files: 5
  manual:
    buffer_tokens: 3000
harness:
  stream_chunk_timeout_seconds: 60
  max_tools_per_request: 128
  tool_search:
    enabled: true
    threshold_tools: 30
    baseline_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    - skills_search
    - skills_read
    - Bash
    - http_fetch
    - http_request
    - http_search
    - vault_write
    - vault_recall
    max_results_default: 5
    max_results_cap: 20
subagents:
  general-purpose:
    system_prompt: ''
    max_turns: 20
    disallowed_tools: []
    model: primary
    base_url: ''
  read-only:
    system_prompt: You are a read-only research assistant. You may use Read, Grep,
      Glob, and Bash (read-only commands only). Do not write, edit, or delete files.
    max_turns: 15
    disallowed_tools:
    - Write
    - Edit
    - Bash
    model: primary
    base_url: ''
models:
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    context_length: 262144
    display_name: Primary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
livekit:
  url: ws://127.0.0.1:7880
  api_key: lloyddevkey
  api_secret: lloyd-dev-secret-do-not-ship-replace-me-32chars-min
  room_prefix: lloyd-
  agent_identity: lloyd-agent
  stt:
    model: tiny.en
    device: cpu
    compute_type: int8
    language: en
    beam_size: 1
  tts:
    api_url: http://127.0.0.1:8090
    model: qwen3-tts
    voice: clone:cullen
    speed: 1.0
    sample_rate: 24000
    skip_empty: true
  vad:
    speech_rms: 0.025
    min_speech_frames_to_start: 3
    min_voiced_ratio: 0.3
    silence_ms: 500
    min_utterance_ms: 350
    max_utterance_ms: 30000
  wake:
    # When enabled, the worker drops any utterance that doesn't begin with
    # one of `words`. After a successful wake-word match (or after Lloyd
    # finishes speaking), opens a `continuation_seconds` window during
    # which utterances from the same speaker pass through without requiring
    # the wake-word again. Speaker identity is enforced via voiceprint
    # (see `voiceprint:` below) when enabled, otherwise via the LiveKit
    # participant identity as a proxy.
    enabled: true
    words: [lloyd, "hey lloyd", "hi lloyd", "okay lloyd"]
    continuation_seconds: 12.0
    # If true and the wake-word is the entire utterance ("Lloyd!"), open
    # the continuation window but skip the inject. False would inject the
    # bare wake-word and Lloyd would respond conversationally.
    skip_inject_if_only_wake_word: true
  voiceprint:
    # Resemblyzer-based speaker matching for the wake-word continuation
    # window. When enabled, the wake-word utterance's embedding becomes
    # the "anchor"; each follow-up utterance is embedded and compared
    # (cosine similarity) against the anchor. Anchor mismatch → utterance
    # is dropped even within the continuation window.
    #
    # Independently, every wake-word utterance is also matched against
    # enrolled `profiles_dir` profiles, so the chat sees [Alan]: rather
    # than [Unknown]: when your voice is enrolled.
    enabled: true
    # ~/lloyd/voice_profiles/<name>.npy — managed via the
    # /api/voice/speakers endpoints.
    profiles_dir: ~/lloyd/voice_profiles
    # Cosine threshold for assigning an enrolled profile name. Below this,
    # the speaker is reported as "Unknown". Resemblyzer embeddings are
    # unit-norm so this is effectively the dot product.
    profile_threshold: 0.75
    # Cosine threshold against the wake-word anchor. Lower than the profile
    # threshold because anchor matching is "is this still the same person
    # who just said the wake word", which is an easier task than full
    # speaker recognition. Tune up if continuation lets the wrong speaker
    # through; tune down if it's too strict on your own voice.
    anchor_threshold: 0.65
    # cpu | cuda. CPU is ~20ms per utterance on warm cache and avoids
    # contention with vLLM on the GPU. Set to "cuda" only if you want it.
    device: cpu
    # Anchor reference label when no enrolled profile matches the wake-word
    # utterance. Used as the [Speaker] tag prepended to the injected text.
    unknown_label: Unknown
server:
  host: 0.0.0.0
  port: 8080
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
workers:
  db_path: ~/lloyd/workers.db
  enabled: true
  max_attempts: 3
  slots: 4
  sources:
    autoresearch:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      max_duration_seconds: 1800
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
    domain-research:
      enabled: true
      interval_seconds: 600
      max_inflight: 1
      max_duration_seconds: 600
    gap-fill:
      enabled: true
      interval_seconds: 300
      max_inflight: 2
      max_duration_seconds: 600
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_duration_seconds: 1200
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 300
  staging_root: ~/obsidian/pending-research
