agent:
  max_turns: 60
  # Upper bound on a per-request `max_turns` to POST /api/message/stream.
  # Worker-driven turns ask for more room than a chat turn (the unattended
  # backlog triage needs ~90; three hand-driven ones used 45, 65 and 76). The
  # ceiling is what stops a tailnet client asking for an unbounded turn.
  max_turns_ceiling: 120
  # The same bound for a turn this process is running for itself. A worker
  # source is not a tailnet client — it is the backend asking itself — and
  # it is the caller whose budget is genuinely larger. Round 858 asked for
  # 150, was clamped to 120 with nothing logged anywhere, and died at the
  # cap before it could re-gate a change it had already fixed. Applies to
  # `sessions_io.NON_USER_PLATFORMS` (autonomy, worker) only.
  # 200 -> 300 (2026-09-17) with autocode's max_turns 150 -> 250: see there.
  max_turns_ceiling_worker: 300
  permission_mode: bypassPermissions
# Authoritative switch for the secondary LLM slot (:8091, Qwen3.6-35B-A3B
# UD-Q3_K_XL on GPU 2's RTX 3090). server.py reconciles the supervisord process
# against this on every boot, so it overrides supervisord's own autostart —
# leaving it false silently stopped the secondary 3 seconds after each backend
# restart.
#
# This slot is llama.cpp, not vLLM (2026-09-06): a GGUF Q3 is the only build of
# Qwen3.6-35B-A3B that fits 24 GB at the full 262144 window. It serves the same
# OpenAI API, so nothing downstream changed — but it reports `llamacpp:` metrics
# rather than `vllm:` ones (app/vllm_metrics.py translates them) and it renders
# preserved thinking from `reasoning_content`, not `reasoning`
# (app/harness/loop.py sends both).
#
# OFF since 2026-09-20. Nothing needed the 35B: Inner Voice was pinned to
# primary from the start, and `app/secondary_models.py` routes the post-session
# jobs back to primary the moment this is false, which is the designed
# behaviour and not a degradation. GPU 2 is reassigned to the `djev:` slot
# below — a 24 GiB card is single-tenant for either of them, so this is an
# either/or, not a pair of flags. Flipping this back to true while
# `djev.enabled` is also true will OOM GPU 2; `start-djev.sh` refuses on the
# VRAM check rather than fighting for it.
secondary_enabled: false

# The djev slot (:8010 vLLM, :8011 structured) — DiffusionGemma 26B-A4B NVFP4
# on GPU 2's RTX 3090, from github.com/mmastrac/djev-spark. It answers
# structured decisions through Jev's `POST /v1/systemone`: typed questions
# (yes/no, choice, ordered scale) read off one diffusion canvas, with
# SELF-CONSISTENT SCORES rather than sampled prose.
#
# "self-consistent", not "calibrated", and the correction is measured. Over
# four framings of one question on 2026-09-20, AUC held at 0.72-0.83 — so the
# ORDER is a real signal — while merely reversing the option order moved P by
# 0.324 on average (max 0.851) and each framing had a different optimal
# threshold: 0.39, 0.03, 0.30, 0.01. A fixed 0.5 cutoff is meaningless. Rank
# with it; gate on it only with a threshold measured against its own frozen
# schema (`eval/djev/schemas.py`). The earlier "calibrated probabilities"
# wording here and in 551e9044 read as a licence to do the opposite.
#
# It is NOT a chat slot and deliberately absent from `models:`. Nothing routes
# a TURN here; `resolve_model_alias`, the model dropdown and the harness have
# never heard of it, and that stays true. Since 2026-09-20 it does answer
# three MCP tools (`djev_rank`, `djev_decide`, `djev_status`) and record three
# production seams in shadow — `architecture/djev.md` is the long version.
# What `enabled` does is: server.py reconciles the supervisord process against
# it on boot (the same treatment `secondary_enabled` gets), the Mission
# Control dashboard shows its engine card while it is true, and `app/djev.py`
# reads it through `app/llm_slots.py::is_enabled` so every client and seam
# goes dark together rather than one surface at a time.
#
# GPU 2 holds this OR the secondary, never both — 17.6 GiB of weights plus KV
# leaves no room beside a 21.7 GiB llama.cpp process.
#
# HOW IT RUNS is not here. Every tuning knob (context, canvas, concurrency,
# KV pool, GPU) lives in `agent-services/supervisor/conf.d/agent-djev.conf`
# as `environment=`, the way agent-llm-primary.conf carries the primary's.
# Two files that both claim to set the engine's context length is how the
# secondary's model and its config drifted apart on 2026-09-06.
djev:
  enabled: true
  # vLLM's OpenAI-compatible API and /metrics. This is what the dashboard
  # scrapes; the card renders off the standard `vllm:` Prometheus names with
  # no translation, unlike the llama.cpp secondary.
  base_url: http://127.0.0.1:8010
  # The structured decision server in front of it. Not an OpenAI endpoint —
  # POST /v1/systemone, GET /health.
  structured_url: http://127.0.0.1:8011
  # Recording what djev WOULD have decided beside what production did decide,
  # at three seams. It changes no decision anywhere: the recorder returns
  # None, drops rather than waits, and runs on its own thread.
  #
  # `LLOYD_DJEV_SHADOW=0` mutes it for a process, which every eval and every
  # pinned-corpus regression arm sets — a replay recorded as production
  # traffic would poison the label_mass distribution the floors are read off,
  # and the lead seam lives inside `_vault_recall`, which the rerank arm
  # calls directly.
  shadow:
    enabled: true
    # Small on purpose. The three seams fire a few hundred times a day
    # between them and a decision is ~40 ms plus prefill, so a healthy
    # backlog is single digits; a queue deep enough to hold an hour of
    # traffic would hide the overflow this bound exists to report.
    queue_max: 256
    # Above the client default, because nothing waits on a shadow call and
    # its states are the large ones (a 12-candidate rerank pool, an item
    # body).
    timeout_seconds: 20.0
    # Per-seam switches. A seam ABSENT from this map is ON — adding a seam
    # and forgetting its flag must not be the same as switching it off.
    seams:
      # Reranking, in agent_mcp/vault.py between the demote sort and the
      # slice. The lead seam: both `vault_recall` and `memory_ops.recall`
      # pass through it.
      rerank: true
      # Write-time backlog dedupe, at the backlog_write_task caller that
      # holds the name and description — not at `merge_target`, which sees
      # no text at all.
      dedupe: true
      # The entity SAME/DIFFERENT gate in the resolution sweep. The
      # highest-stakes of the three and the only one with true ground truth
      # behind it (the 151 verified-bad merges of 2026-09-03).
      entity: true
      # P10: every tool call of a worker turn, asked "on task / unrelated /
      # what injected text would ask for" — app/harness/action_review.py,
      # recorded in the backend. Also off by harness.action_review.mode.
      action_review: true
inner_voice:
  # Pinned to primary deliberately. `secondary_enabled: true` (2026-09-03,
  # de893d7) made resolve_model_alias stop rewriting secondary -> primary,
  # which silently moved the observer from Flash-Next to Qwen3.5-4B. On the
  # first day it ran there it intervened on 40% of LLM-judged events vs 1.7%
  # on primary, fabricated a finding the primary never reported, and cancelled
  # a turn. Revisit only with iv_grade evidence.
  #
  # That evidence is now stale in the observer's favour: the secondary became
  # Qwen3.6-35B-A3B on 2026-09-06, so the 40%-intervention result was measured
  # against a 4B model this slot no longer runs. The pin stays until someone
  # actually re-runs iv_grade against the 35B — but the reason to re-run it is
  # much stronger than it was.
  model: primary
  observer:
    max_tokens: 400
    # The two synchronous terminal calls (assistant_message, result). 5 sat on
    # the measured p95 (5,070 ms) and dropped 5% of the chat/steward terminal
    # judgments 09-05..09-14; of late-but-healthy answers, 88% land by 8 s and
    # only 3 points more by 10 s. Only assistant_message delays the chat's
    # `done` frame, by at most +3 s on the few percent that would have been
    # dropped. Not a wall-clock bound: httpx applies it per connect/read phase.
    # Alan's ruling on #458, needs-human sweep 2026-09-14.
    timeout_seconds: 8
    intervention_budget: 3
    primary_text_window_chars: 4000
    # vLLM scheduling priority. LOWER is higher priority and the primary
    # submits at 0, so the observer must be >0 to actually yield to it.
    priority: 1
    fast_path_enabled: true
    # Pretool cannot block dispatch (hard safety lives in
    # app/harness/safety.py), so an LLM judgment there only produces a
    # nudge that lands after the tool already ran. Observation-only.
    pretool_llm_enabled: false
    # Judge one benign tool result in N; errors, spilled payloads, todo
    # flips and the stalled-progress gate always escalate.
    tool_result_sample_every: 5
    tool_result_escalate_bytes: 20000
    # The same two, for a turn nobody is reading. The observer runs on the
    # PRIMARY at the watched turn's priority, so every escalation it makes
    # sits in front of whatever a human is typing — and a worker round
    # produces long benign results all day: a pytest tail clears the 20k
    # threshold and buys an LLM call that says nothing.
    unattended_tool_result_sample_every: 10
    unattended_tool_result_escalate_bytes: 60000
    # Tools whose repetition IS the protocol, merged over the built-in set
    # (automod_gate_wait, automod_status, browser_wait, graph_status,
    # autoresearch_status). On 2026-09-11 the repetition guard fired 16
    # times on autocode turns in one day, 7 of them on the round id alone,
    # and one turn hit the deterministic cap of 5 the moment its gate
    # started. Config adds to this list; it never un-exempts the built-ins.
    repetition_exempt_tools: []
    # The context wall is the other way a turn dies, and in September 2026
    # it was the one that actually killed rounds. Past this fraction of the
    # compaction threshold the observer is told to prefer noop — the
    # <context> anchor has already told the primary, and an inject costs
    # the context the primary needs to act with. Below the loop's own
    # `harness.context_relief.terminal_floor_tokens` the terminal judgment
    # is skipped entirely: nothing said there can be answered.
    context_pressure_enabled: true
    context_pressure_threshold: 0.8
    # On an unattended turn the LLM still decides WHETHER to speak; Python
    # decides what it says. Round 874's observer injected "deliver the final
    # report now" on the invented premise "working tree clean" and a healthy
    # round was abandoned at iteration 38 with 44 minutes left.
    unattended_terminal_content_deterministic: true
    # Run non-terminal judgments off the harness's critical path.
    async_nonterminal: true
    async_drain_timeout_seconds: 6.0
    # Nudge the primary to converge as it approaches harness max_turns.
    iteration_pressure_enabled: true
    iteration_pressure_threshold: 0.8
    # Carry prior turns' interventions into the observer's prompt.
    cross_turn_memory_enabled: true
    cross_turn_memory_limit: 6
    # Show the primary the goal card it is being judged against.
    goal_card_to_primary: true
    # Deterministic repetition guard. Compares the identifiers in each
    # proposed tool call against the recent ones; fires when the same target
    # is queried `repetition_threshold`+1 times inside `repetition_window`.
    # Costs no LLM call, so it runs even with pretool judgment off — it is
    # the only place the observer sees tool ARGUMENTS, and a loop is
    # invisible in the tool name and result alone.
    repetition_guard_enabled: true
    repetition_window: 6
    repetition_threshold: 2
    # Escalate an otherwise fast-pathed assistant_message to LLM judgment
    # after this many consecutive iterations with no user-visible text.
    # 0 disables. The primary produced 33 in a row on 2026-09-04 and nothing
    # with a whole-turn view ever looked.
    silent_iterations_before_review: 10
    # Minimum primary iterations between two discretionary injects.
    # bypass_budget injects (stall rescue, repetition) are exempt.
    inject_cooldown_iterations: 4
    # Ceiling on DETERMINISTIC injects (stall rescue, repetition) per turn.
    # Those bypass the discretionary budget by design, which left nothing
    # bounding a miscalibrated guard: on 2026-09-04 the repetition guard
    # fired 19 times in one evening. Exempt from the budget, not unbounded.
    deterministic_inject_budget: 5
    # Deadline for judgments that run OFF the harness's critical path. The
    # primary is not waiting on these, so the tight `timeout_seconds` that
    # protects the two synchronous terminal calls only threw the work away —
    # all 7 observer errors on 2026-09-04 were `timeout after 5.0s`, every
    # one on a spawned non-terminal call. `async_drain_timeout_seconds` is
    # the real bound at the next terminal event.
    async_timeout_seconds: 12
  todo_stewardship:
    enabled: true
    completion_gate: true
    mark_without_evidence: true
    # Nudge when the primary has run N tool calls without advancing any todo.
    # Complements the repetition guard: that one catches re-running the same
    # query, this one catches busy-but-not-converging with distinct calls.
    stalled_progress: true
    stalled_after_tool_calls: 5
  goal:
    max_attempts: 10
    eval_timeout_seconds: 8
    eval_max_tokens: 300
autonomy:
  enabled: true
  task_dir: ~/obsidian/autonomy
  tick_interval: 60
  # Fleet default for the Inner Voice observer on scheduled-task runs. A task
  # file's own `inner_voice:` frontmatter beats this, so a single task can be
  # watched on a fleet that is off. Off by default because the observer runs
  # on the PRIMARY at priority 1 and spends a goal-extraction call plus a
  # critique per observed turn — at ~120 autonomy runs a day that would sit
  # in front of every chat turn, for runs nobody asked to have watched.
  # Recording (`harness.background_recording`) is unconditional and separate.
  inner_voice: false
autoresearch:
  bench_dir: ~/obsidian/lloyd/bench
  default_budget_minutes: 120
  default_model: primary
  facts_experiments_dir: ${LLOYD_DATA}/_pipeline/vault-derived/facts/Experiments
  ledger_path: ${LLOYD_DATA}/_pipeline/research/ledger.jsonl
  max_variants_per_round: 7
  promotion:
    # Kept at 0.5 on 2026-09-13 (Alan, #428): the first measurement found 0/65
    # promoted rounds dropped past the ledger's own noise floor (0.1289), which
    # is #352's "<20% keep" band. knowledge/evaluation/
    # autoresearch-promotion-fp-rate-at-threshold-0p5.md has the derivation.
    min_bench_win_fraction: 0.5
    min_composite_delta: 0.05
    require_safety_pass: true
    tool_allowlist_consecutive_wins: 2
  research_root: ${LLOYD_DATA}/_pipeline/research
  rounds_dir: ${LLOYD_DATA}/_pipeline/research/rounds
  snapshots_dir: ${LLOYD_DATA}/_pipeline/research/snapshots
  targets:
  - prompts
  - skills
  - retrieval
  - tool_allowlist
  variants_dir: ${LLOYD_DATA}/_pipeline/research/variants
discord:
  allowed_users: []
  auto_thread: true
  auto_thread_archive_duration: 1440
  free_response_channels: []
  home_channel: null
  owner_id: ''
  reactions: true
  require_mention: true
  token: ''
display:
  personality: kawaii
  streaming: true
# Few-word session titles, written by the secondary after a turn completes
# (app/session_titles.py). They are what the chat history, the dashboard's
# agent panel, the Inner Voice picker and the chat header render instead of
# a timestamp id. Off means those surfaces fall back to the preview text.
# memory_add stamps each MEMORY.md entry with its UTC write date, "- (YYYY-MM-DD) …",
# so the date travels with the line through a consolidation rewrite (#622:
# after a reordering rewrite the model acted on the stale value 25/59 and 21/59
# times; with stamps 0/60). Read by agent_mcp/session.py; lloyd-mcp restart.
memory_tools:
  date_stamp_entries: true
  # Review 2026-09-24 P4: memory_add writes "- [type] (date) text", type one of
  # user|feedback|project|reference (param `type`; default user for USER.md,
  # project otherwise). Additive whatever the index eval decides. lloyd-mcp restart.
  typed_entries: true
# What the prompt does with a loaded memory file over its prompt_surface ceiling
# (prompt_builder._load_memories, review 2026-09-24 P4): render_all injects it
# whole (today's bytes); annotate cuts at an entry boundary and appends a
# <memory_overflow> marker, logs ERROR and announces once a day. render_all until
# eval/run_memory_index_ab.py promotes the index. Backend restart.
memory:
  render_overflow: render_all

session_titles:
  enabled: true
# Code graph (agent_mcp/code_graph.py). Structural navigation over
# graphify's deterministic AST extraction — who calls this, what breaks if
# I change it. Built on demand into the gitignored graphify-out/ of
# whichever tree is asked about; no LLM calls, ~15s for this repo.
# There is deliberately no `enabled` flag: the kill switch is
# mcp_servers.lloyd-mcp.disabled_tools, and an enabled:false that emptied
# list_tools() would break the annotation-staleness test in
# tests/test_mcp_layer.py.
desktop:
  # Computer use on Alan's real Hyprland desktop (agent_mcp/desktop,
  # architecture/desktop.md). desktop_capture is read-only; desktop_act needs
  # the lease Alan grants from Mission Control's Desktop tab. Never available
  # to background, worker, bench or eval sessions (refused at dispatch).
  enabled: true
  helper_python: /usr/bin/python3   # has gi.repository.Atspi; no venv does
  max_dimension: 1456               # longest image edge; ~1.2k tokens on Flash-Next's ViT
  max_elements: 200
  listed_elements: 60
  tripwire_px: 24                   # pointer drift that revokes the lease
  deny_windows: [1password, bitwarden, keepassxc, authenticator, hyprlock, polkit, pinentry]

browser:
  # Chromium for the browser_* tools. Headed mode needs a live display the
  # agent-worker unit does not have, so this stays true outside debugging.
  headless: true
  # Refuse hosts on this machine's network: RFC1918, link-local, reserved.
  # Loopback stays allowed, mirroring http_tools.http_request — the agent
  # browses Lloyd's own dashboard, and it already holds Bash and the MCP
  # surface, so refusing the browser there removes no authority an injected
  # page could not reach more directly. What this stops is the LAN: the
  # router, the NAS, the printer, every unauthenticated device on it.
  # LLOYD_BROWSER_BLOCK_PRIVATE=0 turns it off for one process.
  block_private_hosts: true

code_graph:
  graphify_bin: ~/.local/bin/graphify
  # Rebuild a stale graph on first use. The dirty-file rule matters most
  # inside an automod round, where HEAD does not move while the model edits.
  auto_refresh: true
  refresh_timeout_s: 120
  # Floor between automatic rebuilds triggered by uncommitted edits. Below
  # this the query answers from the existing graph and says it is stale.
  min_refresh_interval_s: 30
  max_cached_roots: 4
  max_lines: 60
mcp_servers:
  lloyd-mcp:
    disabled_tools:
    - discord_get_home_channel
    - discord_list_channels
    - discord_send
    - discord_send_embed
    name: lloyd-mcp
    type: streamable-http
    url: http://127.0.0.1:8500/mcp
model:
  default: primary
# The primary's KV usage and request count, sampled in the background
# (app/engine_pressure.py). Read by the worker pool's KV gate, by the
# prefix-miss alert ("was anything else running?"), and by the dashboard's KV
# gauge: p90 over `window_seconds`, with a line at `kv_warn_line`.
engine_pressure:
  enabled: true
  sample_interval_seconds: 5
  window_seconds: 300
  kv_warn_line: 0.65
compaction:
  mode: summarize
  summary_model: primary
  keep_recent_turns: 5
  # D2 (review 2026-09-24, app/compaction_state.py): keep the between-turn
  # summary as data["compaction"] and fold new history into it instead of
  # regenerating it every turn. Ships off until the recall eval's
  # summary_persisted arm is compared (eval/run_compaction_recall_eval.py).
  # The input budget bounds one fold's delta; leftover delta is folded on
  # later turns, at most max_folds_per_turn per turn.
  persist_summary: false
  summary_input_budget_tokens: 48000
  max_folds_per_turn: 3
  microcompact:
    enabled: true
    # Budget-driven since 2026-09-05. Below `trigger_fraction` of the
    # truncation threshold this pass does nothing; above it, it clears the
    # OLDEST tool results one at a time until the conversation is back
    # under `target_fraction`, spilling each to disk first so the marker
    # can name the file. The old count-only rule cleared 93 of 97 results
    # on a review using 17% of its context window.
    #
    # 0.8/0.6 -> 0.72/0.52 on 2026-09-10 (architecture/vllm-throughput-
    # mitigation.md, Layer 2): the trigger drops from ~168k to ~151k of the
    # 210k threshold, and the target moves with it so the band — and so how
    # often a long round compacts — stays 0.2 wide. Every compaction rewrites
    # the middle of the prompt and forces a cold re-prefill of what follows,
    # so narrowing the band would trade resident KV for more of exactly those.
    # A cost knob: less resident KV per long turn, a little less history. The
    # in-turn pass reads these too (app/mcp_discovery.py), which it did not
    # before this change.
    trigger_fraction: 0.72
    target_fraction: 0.52
    # Floor on results kept inline. A code review's working set is 15-25
    # files; the old default of 5 was below the point of usefulness.
    keep_recent_tools: 15
    # Clearing a result smaller than this saves fewer tokens than the
    # marker replacing it costs. Since D1 (transcript_spill below) a stored
    # result over 2k is a ~2.3k <persisted-output> pointer; this pass drops
    # an old pointer's preview down to its header and keeps the path.
    min_chars_to_clear: 2000
    # Legacy; no longer a trigger. app.compaction passes the budget
    # instead and disables the count rule outright.
    count_threshold: 20
    compactable_tools:
    - Read
    - Bash
    - Grep
    - Glob
    - Edit
    - Write
    # Deny-list mode (D10, 2026-09-24): when set, every tool result may be
    # cleared EXCEPT these, and `compactable_tools` above is ignored — so MCP
    # domain results are cleared (spilled first) instead of going straight to
    # truncation. Read by the turn-start pass and the in-turn rung 1. Remove
    # the key (or set null) to go back to the allow-list.
    non_compactable_tools:
    - TodoWrite
    - ToolSearch
    - EnterPlanMode
    - ExitPlanMode
    - SetGoal
    - ClearGoal

  # D1 (review 2026-09-24): a tool result over 2,000 chars is written to
  # <sid>.tool-results/<call_id>.{txt,json} and its transcript row carries a
  # <persisted-output> pointer (path + 2 KB preview), so the next turn's
  # history can Read it back. false = the old 2 KB cut with no pointer.
  transcript_spill:
    enabled: true
  restore:
    enabled: true
    budget_tokens: 50000
    max_per_file: 5000
    max_files: 5
  manual:
    buffer_tokens: 3000
harness:
  # Images tools return (screenshots): app/harness/tool_images.py. A model
  # sees them only when its models.<alias>.supports_vision is literally true
  # (route native); otherwise aux_model describes them, or they are dropped
  # with a note. Base64 never enters history or the session file.
  images:
    enabled: true
    route: auto            # native | aux | auto | drop
    aux_model: ""          # a models.<alias> with supports_vision: true
    max_outbound: 20       # images per request before the oldest batch is evicted
    max_bytes: 25165824
    evict_batch: 8
    keep_on_compaction: 3
    token_estimate: 1500
    dedup_max_consecutive: 2
  stream_chunk_timeout_seconds: 60
  # A broken stream (stall, dropped connection, bad SSE line, 5xx) is
  # re-requested at most max_attempts times a turn, and only while the
  # iteration has sent no tool-call delta. A 4xx is never retried. 0 disables.
  stream_retry:
    max_attempts: 1
    backoff_seconds: 2
  # Re-anchor session.todos this often (in agent-loop iterations) when
  # items are still open and the list has gone untouched. The system
  # prompt's <active_todos> block is frozen at turn start, so a turn that
  # creates its own list would otherwise never see it again. 0 disables.
  todo_anchor_interval_iterations: 10
  # Preserved thinking. Carry this many recent iterations' reasoning back
  # into history as each assistant message's `reasoning` field, which
  # Qwen3.8-Flash-Next renders into that turn's <think> block. Its model
  # card calls preserved thinking out as reducing redundant reasoning in
  # agent loops; the harness dropped it entirely until 2026-09-05, so the
  # model saw 50+ prior turns in which it had apparently thought nothing.
  # Bounded because reasoning is not free: an unbounded window on a long
  # review turn would push peak context past the microcompaction trigger,
  # and microcompaction can only clear tool results. 0 disables.
  preserve_thinking_iterations: 6
  # Context anchor. Tell the model where it is against its own context
  # window, once at `warn_fraction` and once at `critical_fraction`. The
  # model has no other view of this: the engine reports the prompt size,
  # the harness knows it, and until 2026-09-12 nothing passed it on. Three
  # autocode rounds died at the wall on 2026-09-11 with finished work
  # uncommitted in a worktree, still Reading whole files at 241k of
  # 262,144 tokens. Silent before the first usage report — an unmeasured
  # turn is not a turn in trouble.
  # What an unattended turn does NOT carry. USER.md is ~20k tokens
  # describing the person Lloyd works for; a worker round is judged against
  # an acceptance contract, nobody reads its reply, and on 2026-09-11 three
  # rounds died at the context wall carrying it. MEMORY.md stays — it is
  # how Lloyd knows what he has already learned about this machine.
  worker_prompt:
    drop_memory_files: [USER.md]
  context_anchor:
    enabled: true
    warn_fraction: 0.76
    critical_fraction: 0.90
    # Roughly the argument size that starts getting cut off at critical.
    critical_call_tokens: 1500
  # Context relief. The ladder the loop runs when the prompt presses on the
  # window: clear stale tool results, then prune preserved reasoning, then
  # spill Write/Edit bodies out of assistant tool-call arguments, then
  # truncate the largest tool results. Only the first rung existed before,
  # and on 2026-09-11 it freed 1.0 tool result against a 145k-token
  # shortfall — the compactable residue was already gone and the rest of
  # the prompt was reasoning and file bodies nothing could reach.
  context_relief:
    enabled: true
    # Below this much headroom an observer inject on a terminal iteration
    # is dropped and the turn ends `context_exhausted`, rather than
    # spending its last iteration on a completion with no room to write.
    terminal_floor_tokens: 12000
    # Relieve before a request when the completion would have less than
    # this to write into.
    min_completion_tokens: 6000
    # Second reasoning window, applied ONLY under pressure — pruning
    # mid-turn invalidates the cached prefix (#520) and is worth it only
    # when the alternative is losing the turn.
    reasoning_keep_under_pressure: 2
    shrink_arguments: true
    shrink_arguments_min_chars: 2000
    shrink_arguments_tools: [Write, Edit]
    # A/B only. A max_tokens reservation truncates a long think on a short
    # answer, and llama.cpp truncates silently rather than erroring.
    send_max_tokens_reservation: false
  # Thinking trace. Persist each agent-loop iteration's reasoning phase as
  # its own `role="thinking"` session entry, so the chat timeline can show
  # a "Thought for 11.8s" row where the thinking actually happened. Before
  # this, one buffer held the current phase and each new phase replaced it,
  # flushing to disk only on an iteration that produced both tool calls and
  # text — so a forty-iteration turn persisted exactly one phase, the last.
  # `role="thinking"` is what keeps these rows out of every transcript
  # generated from the logs — each producer branches on role and none has
  # a case for it — and it is also not a conversation role, so compaction
  # drops them and they never re-enter the prompt. false restores the old
  # behaviour.
  thinking_trace:
    enabled: true
  # Background recording. Every run that is not a chat turn — every autonomy
  # task, every `run_prompt_on_primary` worker job — writes a session, a
  # transcript and an event log through `app/run_recorder.py`. Before this
  # those two paths left nothing at all: on 2026-09-10 an autonomy task was
  # the prime suspect in a vault wipe and could be neither confirmed nor
  # cleared, because the tool calls it made had never been written down.
  # Recording is cheap and universal; being *watched* by the Inner Voice
  # observer is a separate, per-job opt-in (`autonomy.inner_voice`,
  # `workers.sources.<name>.inner_voice`) because that one costs primary
  # capacity per turn. false restores the old silence.
  background_recording:
    enabled: true
  # Prefix-cache misses on long re-admissions (app/prefix_miss.py). An
  # iteration >= 3 whose prompt is >= 100k tokens and < 50% cached was
  # re-prefilled from cold — the 09-09 stall, one 8k chunk per engine step
  # while every other request waits. Each is logged as `brain1.prefix_miss`,
  # summed onto the turn's usage row (`reprefill_tokens`, `prefix_misses`)
  # and counted on the dashboard. A turn whose misses pass
  # `announce_reprefill_tokens` while another request was running is
  # announced once — journal and toast, news rather than an incident — and
  # not more often than the cooldown. Voice is off: a slow iteration is not
  # worth a sentence said aloud in the room.
  prefix_miss:
    enabled: true
    announce: true
    announce_reprefill_tokens: 100000
    announce_cooldown_seconds: 1800
    announce_voice: false
  # Tool-call summaries. Adds a `summary` string parameter to every
  # advertised tool — a short phrase the model writes describing what the
  # call is doing, rendered beside the tool name in the chat and Inner
  # Voice transcripts. Display metadata only: the harness strips it before
  # dispatch and before the call is replayed back as history, so no tool
  # ever receives it. false removes the parameter from every schema and the
  # UI falls back to the bare tool name.
  tool_call_summaries: true
  # Read-before-edit and stale-file gates (agent_mcp/builtin_fs.py). An
  # Edit against a file this session has never Read is a guess; an Edit
  # against one that changed since the Read still matches its old_string and
  # silently reverts whoever wrote in between. Both are refused with an error
  # that says what to do. Creating a new file with Write needs no Read.
  # false keeps the read records but stops refusing.
  edit_gates:
    enabled: true
  # Per-turn record of what a chat turn wrote, with the pre-image beside it,
  # so the chat can say "changed 2 files" and offer to put them back.
  # `~/lloyd` is production — a saved file is a deploy — and until this
  # existed an ordinary turn had no such line and no undo. Off for workers
  # and direct run_query callers: they have no turn id and no reader.
  change_ledger:
    enabled: true
    retention_days: 7
    max_total_mb: 256
  # #544 effect ledger (agent_mcp/_tool_effects.py): a worker item that is
  # cancelled at its budget and requeued re-runs its whole turn, so every
  # side-effecting tool call the first attempt landed would land again. One
  # row per (tool, arguments, queue item) refuses the duplicate and replays
  # the recorded result. Off the read-only, idempotent and repeat-expected
  # paths entirely (agent_mcp/annotations.py). Over-suppression is the
  # failure that bites, so this is the switch to reach for if a legitimate
  # second call is ever refused. `ok`/`error` rows are pruned after
  # `retention_days`; `unknown` rows (a call that died mid-flight) are kept
  # `unknown_retention_days`, because they are the only record that an
  # effect may have landed.
  effect_ledger:
    enabled: true
    retention_days: 14
    unknown_retention_days: 30
  # Diagnostics appended to a successful Edit/Write result, so the model
  # learns about a broken edit at the edit rather than at the gate minutes
  # later. Delta only: the tree carries ~69 tolerated pyflakes findings and
  # reporting them every time would train the model to skip the block.
  # `python` runs pyflakes in-process; `typescript` queues a debounced tsc
  # whose new errors arrive as a notification on a later iteration.
  edit_diagnostics:
    python: true
    typescript: true
    max_lines: 30
  # Structured final answer. When a caller passes RunOptions.final_schema
  # (today: the backlog triage worker), the loop runs one extra completion
  # after the turn ends that restates the verdict as a JSON object. These
  # bound that request; the schema itself is a per-caller contract, never
  # config. Inert for every caller that sends no schema.
  # max_tokens is the WHOLE completion, thinking included — the grammar
  # only applies after </think>. At 1024, 41% of triage verdicts came back
  # as JSON cut mid-string and fell back to the regex parser (the ledger's
  # `structured_error` says "truncated" for those now). 4096 was the floor
  # once verdicts carried per-clause acceptance — and the review grader's
  # object (five clauses with notes, a test-honesty list, a seams list) cut
  # off at exactly 4096 on its second calibration case. 8192 is a cap, not
  # a spend; do not lower it without re-reading the `verdict_source`
  # distribution and the review ledger's `structured_error`s.
  finalizer:
    max_tokens: 8192
    timeout_seconds: 180
  # Concurrent tool dispatch, for READ-ONLY batches only. A batch runs
  # concurrently when EVERY call in it is annotated readOnlyHint (or is a
  # parse error, or ToolSearch); any Bash, Edit, Write or mutating MCP tool
  # in the batch makes the whole batch sequential. Read-only-only because
  # that is the only classification available that is not a guess — see
  # agent_mcp/annotations.py, and note that `Bash(cat ...)` is exactly the
  # shell-command classification the safety hook refuses to attempt.
  # Off until soaked: watch `mcp_pool:` warnings, `[iv.observer] inject`
  # placement in transcripts, and harness.empty_terminal_iteration counts.
  parallel_tool_calls:
    enabled: false
    max_concurrency: 4
  # P12. discovery_ttl_s: a turn start re-lists the aggregator's tools once the
  # catalog is this old (0 = discover once per pool, as before); a failed or
  # empty refresh keeps the old catalog. per_tool_timeouts: honour the budget
  # a tool declares in `_meta` (agent_mcp/annotations.py TIMEOUT_SECONDS),
  # clamped to the 660 s ceiling; false = the ceiling for every tool.
  mcp_pool:
    discovery_ttl_s: 300
    per_tool_timeouts: true

  # P6, tool_choice levers (architecture/harness.md, Review 2026-09-24).
  # echo_guard.mode: nudge = append a "call the tool" user message (today);
  #   tool_choice = discard the attempt, re-send it with tool_choice=required.
  #   Stays nudge until `required` is measured against qwen3_xml.
  # max_turns_wrapup: at max_turns, one toolless (tool_choice=none) request
  #   asking where the work stands; stop_reason stays max_turns. `models` are
  #   the slots verified to honour `none` with tools present — vLLM only; the
  #   llama.cpp secondary is not verified, so it is left out.
  echo_guard:
    mode: nudge
  max_turns_wrapup:
    enabled: true
    models: [primary]
  # P10, injection resistance for worker turns. Both halves only observe until
  # a week of rows is labelled (architecture/harness.md, Review 2026-09-24).
  # off | shadow | warn.
  # action_review: djev asks, per worker tool call, whether it is on task,
  #   unrelated, or what injected text would ask for (app/harness/
  #   action_review.py). `warn` records like `shadow` until a threshold exists.
  # injection_probe: regex families over fetched text in background sessions
  #   (agent_mcp/_injection_probe.py). shadow logs harness.injection_probe_hit;
  #   warn also appends one <warning> to the tool result.
  action_review:
    mode: shadow
  injection_probe:
    mode: shadow
  tool_search:
    enabled: false
    threshold_tools: 30
    baseline_tools:
    - Read
    - Edit
    - Write
    - Grep
    - Glob
    - skills_search
    - skills_read
    - Bash
    - http_fetch
    - http_request
    - http_search
    - browser_navigate
    - browser_snapshot
    - vault_write
    - vault_recall
    - mc_get_state
    - mc_navigate
    # Code navigation. Paired with data/tool_overrides.yaml in live — the
    # override shadows this key wholesale, so an unpaired edit here means the
    # baseline a fresh clone boots into differs from the one being served,
    # which is what test_config_yaml_agrees_with_the_live_override catches.
    - graph_explain
    - graph_affected
    - ide_open_folder
    - ide_open_file
    - ide_close_tab
    - Task
    - vault_search
    - TodoWrite
    - ambient_decide
    - mc_close_modal
    - SetGoal
    max_results_default: 5
    max_results_cap: 20
subagents:
  general-purpose:
    system_prompt: ''
    # 20 was too low for read-heavy delegation: a review subagent spent
    # all 20 turns reading and returned nothing (session
    # 20260905_151355_iv5174, 231s wasted). Task now reports budget
    # exhaustion as an error rather than an empty answer, but the budget
    # itself also needed room to finish.
    max_turns: 40
    disallowed_tools: []
    # Empty means "inherit the calling turn's model" (agent_mcp/builtin_task.py
    # reads it from the request `_meta`), falling back to `primary` when Task
    # is invoked outside a harness turn. It was pinned to `primary`, so a turn
    # running on the secondary delegated its subagents to the primary and the
    # secondary was never exercised by the fan-out work Task exists for.
    # Re-pin to an alias here to force a specific model for this profile.
    model: ''
    base_url: ''
  read-only:
    system_prompt: You are a read-only research assistant. You may use Read, Grep,
      Glob, and Bash (read-only commands only). Do not write, edit, or delete files.
    max_turns: 30
    disallowed_tools:
    - Write
    - Edit
    - Bash
    model: ''
    base_url: ''
models:
  primary:
    alias: primary
    base_url: http://127.0.0.1:8096
    # Whether this slot accepts image input. Must match the engine: the
    # launcher strips the vision tower unless LANGUAGE_MODEL_ONLY=0 in
    # agent-llm-primary.conf. true with a text-only engine costs one refused
    # request per turn (MultimodalRejectedError), never a dead turn.
    supports_vision: true
    image_token_estimate: 1300   # 1456x819 frame on this ViT (32x32 px per token); measured 640x360 = 220
    context_length: 262144
    display_name: Primary (Local)
    # Case-insensitive substring matched against what the engine reports
    # (vLLM `/v1/models`.root, llama.cpp `/props`.model_path). Checked at
    # boot by app/model_identity.py and on demand via
    # GET /api/models/identity. Update it whenever the slot's occupant
    # changes, otherwise the check just cries wolf.
    expect_model: Qwen3.8-Flash-Next
    # KV-cache regression check, same sweep. The FP8 cutover (2026-09-10) is
    # what fixed the 09-09 stall — a 692,263-token pool where BF16 held
    # 398,175 — and a boot that silently lands back on BF16 (a reverted conf,
    # a dropped KV_CACHE_DTYPE, the old venv) serves perfectly well while
    # undoing it. Read from the engine's own vllm:cache_config_info and logged
    # at ERROR on a miss; agent-services/bin/flash-next-bootfacts.sh asserts
    # the same two things against the boot log.
    expect_kv_cache_dtype: fp8
    expect_kv_pool_tokens_min: 600000
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8096
      ANTHROPIC_CUSTOM_MODEL_OPTION: primary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Primary
  secondary:
    alias: secondary
    base_url: http://127.0.0.1:8091
    context_length: 262144
    display_name: Secondary (Local)
    # llama.cpp serves this slot (see agent-services/bin/start-secondary.sh,
    # MODEL=qwen36). The `qwen35` branch of that same script serves a 4B
    # under this identical alias and port, so a reverted launcher is
    # invisible without this check.
    expect_model: Qwen3.6-35B-A3B
    env:
      ANTHROPIC_API_KEY: no-key-required
      ANTHROPIC_BASE_URL: http://127.0.0.1:8091
      ANTHROPIC_CUSTOM_MODEL_OPTION: secondary
      ANTHROPIC_CUSTOM_MODEL_OPTION_NAME: Secondary
# Guardian alert behaviour. Read by agent-services/bin/sync-voice-config.py at
# guardian stage time, NOT by the backend — the guardian cannot parse yaml, so
# settings are pushed to it rather than pulled.
guardian:
  voice:
    # Quiet hours for SPOKEN ALERTS ONLY. Deliberately not under livekit.tts:
    # voice mode must stay conversational at any hour, and this must never
    # reach livekit_worker. Inside the window the toast, journal, ledger,
    # vault note and backlog task all still fire — only the sound is withheld,
    # so nothing is lost, it is just waiting in the morning.
    quiet_hours:
      enabled: true
      start: 23              # local hour speech stops
      end: 7                 # local hour it resumes (wraps midnight)
      allow_critical: false  # true = a rollback still wakes you

livekit:
  url: ws://127.0.0.1:7880
  api_key: ${LIVEKIT_API_KEY}
  api_secret: ${LIVEKIT_API_SECRET}
  room_prefix: lloyd-
  agent_identity: lloyd-agent
  stt:
    # `parakeet` is NeMo Parakeet TDT 0.6B v3 (int8) through sherpa-onnx;
    # `whisper` is the old faster-whisper path, kept as a fallback.
    #
    # Measured on this box, 2026-09-17, LibriSpeech validation.clean (73 clips,
    # 481 s), via scripts/voice/asr_eval.py:
    #
    #             WER clean   WER @10 dB SNR   RTFx
    #   parakeet    3.83%         9.30%         24x
    #   whisper    10.61%        18.96%         16x
    #
    # Better and faster on both, and the whisper column there is already the
    # *fast* whisper (temperature_fallback off). On short utterances the gap
    # widens: a 1 s clip took base.en 2.76 s and parakeet 0.06 s. Whisper was
    # slower on SHORTER audio (0.57 s for clips over 8 s) because its
    # temperature fallback re-decodes the whole clip on each failed threshold,
    # and short utterances are what trip those thresholds.
    backend: parakeet
    model_dir: agent-services/models/parakeet-tdt-v3
    num_threads: 4
    # Names and terms. Both backends read `hotwords_file` (one per line, the
    # same file the vault keeps for people); Parakeet also reads `hotwords`,
    # and never biases toward a wake word (Lloyd): the worker excludes those,
    # because "Floyd came over" came out "Lloyd came over", which wakes him.
    #
    # Parakeet can only be biased in beam search, and beam search alone is
    # WORSE here (LibriSpeech 3.83% -> 4.78%, 188 of 500 real transcripts
    # changed). So a second, biased decode runs beside greedy and is used only
    # when it gained a word on the list. 2026-09-18, scripts/voice/hotword_eval.py,
    # 132 held-out TTS sentences with a hotword and 72 sound-alikes without:
    #
    #                    hotword recall  false ins.  LibriSpeech clean/10 dB  real changed
    #   greedy               87/132        0/72         3.83% / 9.30%            -
    #   greedy+hw @1.0      106/132        0/72         3.83% / 9.30%          1/500
    #
    # The one real change is "our Lloyd back block" -> "backlog". At 1.5 (a
    # wider list) "the back lot" became "the backlog". Cost: ~+100 ms and ~1 GB for the
    # second model copy. `parakeet_hotwords: false` turns it off. Only terms
    # the eval showed a gain for are listed; autotriage/autocode did nothing.
    hotwords_file: ~/obsidian/hotwords.md
    hotwords: [backlog, LiveKit, Inner Voice]
    hotwords_score: 1.0
    parakeet_hotwords: true
    # --- whisper fallback only; ignored by the parakeet backend ---
    model: base.en
    device: cpu
    compute_type: int8
    language: en
    beam_size: 1
    # The fallback costs ~4.4x wall clock and changes the transcript on about
    # half of short clips — not reliably for the better. Leave off.
    temperature_fallback: false
    streaming:
      # Cache-aware streaming FastConformer CTC, for live partial transcripts
      # in the browser. Display only — the committed transcript is always the
      # offline recogniser's. Off until something reads partials for more than
      # decoration; preemptive LLM generation is the reason to turn it on.
      enabled: false
      model_dir: agent-services/models/nemo-streaming-480ms
      num_threads: 2
  tts:
    api_url: http://127.0.0.1:8090
    model: qwen3-tts
    # Cloned voice: Dave Cullen (The Dave Cullen Show, @TheDaveCullenShow).
    # Profile: agent-services/services/tts/qwen3-tts/voice_library/profiles/dave_cullen/
    # Provenance + measurements: ~/obsidian/projects/lloyd/voice/voice-source-dave-cullen.md
    # Was `Ryan` (built-in) after the 08-22 rebuild destroyed the old clone:cullen
    # profile.  `Ryan` still works as a fallback, but needs the CustomVoice model —
    # switching back to it means the backend swaps models on the next request.
    voice: clone:dave_cullen
    # Set by ear, not by the words/second match.  Matching Dave's 2.06 w/s put
    # this at 0.70 and that is audibly too slow — the metric is misleading
    # because his reference clip is one deliberate segment and the model places
    # its pauses differently, so the same w/s is a different perceived pace.
    # For the record, one synthesis stretched to each setting:
    #   0.70 -> 2.70 w/s   0.80 -> 3.09   0.85 -> 3.28   0.90 -> 3.47   1.00 -> 3.87
    # Every one of those is already *faster* than Dave's 2.06 by that measure.
    #
    # 2026-09-09: still by ear, 0.85 -> 1.02 -> 1.22 (two +20% steps, both
    # judged on the same sentence).  Above 1.0 the WSOLA stretch is
    # *compressing* the model's own output rather than expanding it, which is
    # the cheaper direction — no invented material, just a shorter analysis
    # hop — so there is no quality reason to stop at 1.0.  The audible ceiling
    # is where the similarity search starts dropping whole pitch periods and
    # consonants smear; 1.22 is well short of it.
    #
    # Applied client-side by livekit_worker, NOT by the server: the server's
    # streaming path (`generate_voice_clone_streaming`) takes no speed argument
    # and silently drops it, so until 2026-09-06 voice mode spoke at 1.0 no
    # matter what this said.  See agent-services/tts_shaping.py.
    speed: 1.22
    sample_rate: 24000
    skip_empty: true
    # Silence appended to every utterance.  _stream_utterance returns once the
    # audio is *queued*, not played, so whatever ran next — an `interrupt()`
    # calling `clear_queue()`, the room going quiet — was cutting the last
    # syllable off.  Padding puts silence in that position instead of speech.
    tail_silence_ms: 250
    # Corrective EQ on the synthesised audio.  The 12 Hz speech tokenizer
    # matches the reference speaker to within 0.5 dB below 1.5 kHz and then
    # rolls off — -1.8 dB at 2 kHz, -3.9 dB at 4 kHz, -6.2 dB above 9 kHz —
    # which is the "he's in a broom closet" sound.  Two high shelves put the
    # presence band back; fitted against the profile's own reference clip, they
    # land BOX and spectral centroid on the real speaker's numbers.
    #
    # This is a vocoder property, not a bad reference: built-in voices with no
    # cloning measure the same, and re-cutting from a second source video did
    # not move it.  Do NOT "fix" it by cutting 300 Hz — that band already
    # matches the reference to 0.1 dB, and cutting it trades hollow for thin.
    shaping:
      presence_eq: true
      shelves:
        - {freq: 1800, gain_db: 2.75, q: 1.0}
        - {freq: 8000, gain_db: 4.0, q: 0.7}
  vad:
    # Silero VAD v6 (ONNX), replacing the energy threshold on 2026-09-17.
    #
    # The old `speech_rms: 0.025` was the root cause of voice barely working:
    # every wake-word utterance in the diagnostic corpus measured rms 0.013 to
    # 0.017, i.e. normal speech at a normal distance sat *below* the speech
    # threshold. Only the loudest syllables crossed it, so sentences arrived as
    # fragments with the quiet parts missing. Tuning the number could not fix
    # it, because loudness is the wrong quantity — a fan and a whisper at the
    # same level are the same number to RMS and obviously different to Silero.
    # Measured here: Silero's mean speech probability held at 0.87-0.89 across
    # a 16x attenuation, so it is level-invariant where RMS is nothing but
    # level.
    #
    # 0.45 rather than Silero's own 0.5 default because a false positive is now
    # cheap — the wake word gates everything downstream — while a false
    # negative is a sentence Lloyd never hears.
    threshold: 0.45
    # Closing silence. 380 ms rather than the old 500 ms because Smart Turn
    # (below) catches the mid-sentence pauses that a short silence would
    # otherwise cut; without that this would have to be 700 ms or more.
    min_silence_ms: 380
    # Audio kept from before the onset, so the first phoneme is not clipped.
    # This is the old LEAD_IN_MS, raised from 200 ms because Silero triggers a
    # frame or two later than an energy threshold does on a soft onset.
    speech_pad_ms: 220
    min_utterance_ms: 250
    max_utterance_ms: 30000
  turn_detection:
    # Smart Turn v3.2 (pipecat, BSD-2-Clause): "did the speaker finish?", from
    # the waveform rather than the transcript. Validated on this box against
    # synthesized speech — a complete question scored 0.976 and the same voice
    # cut mid-phrase scored 0.019.
    #
    # This is what lets min_silence_ms be short. When it says the thought is
    # unfinished, the audio is held and glued to whatever comes next, so a
    # breath mid-sentence no longer sends half a question to the model.
    enabled: true
    model_path: agent-services/models/smart-turn/smart-turn-v3.2-cpu.onnx
    threshold: 0.5
    # How long a held turn waits for its continuation before being released
    # anyway. "Unfinished" is also what a trailing-off sentence looks like, and
    # without this one of those would sit in the buffer indefinitely.
    hold_timeout_ms: 2200
    hold_max_seconds: 12.0
  voice_turn:
    # How a spoken turn is asked of the model and spoken back
    # (app/routers/voice.py, agent-services/livekit_worker.py).
    #
    # Speak the reply as it streams, clause by clause, from the turn's own
    # event stream. Off = the old path: wait for the finished message, have the
    # secondary rewrite it, poll it out of the transcript.
    stream_replies: true
    # Tell the model it is being heard, in the prompt's tail (never the text
    # the chat shows). This is what replaced the secondary's rewrite, which
    # cannot run on a reply that has not been written yet.
    reminder: true
    # `off` sends enable_thinking=false for spoken turns only; typed turns are
    # untouched. Measured 2026-09-17 on the live primary with the real system
    # prompt (77 k chars, prefix warm) and this reminder, five conversational
    # questions: time to the first spoken word was median 2.00 s (max 2.67)
    # with thinking on and 0.47 s (max 2.19) with it off, and the answers were
    # equivalent. Thinking earns its keep on multi-step tool work, which is
    # the case to watch if a spoken request goes wrong — flip to "on" for that.
    thinking: "off"
    # When the wake word fires — mid-sentence, ~3 s before the utterance is
    # injected — prefill the session's prompt so the turn finds it cached. A
    # cold first turn measured 4.16 s to the first answer token through a real
    # room, the warm turn after it 0.45 s. Skipped for a session over its
    # compaction threshold (its turn will summarize, changing the prefix).
    prewarm: true
    # Stop and say "The rest is in the chat." past this many characters.
    max_spoken_chars: 1500
    filler:
      # Said once, only while nothing else has been: after `after_seconds` of
      # silence, or when a tool call starts before any words.
      enabled: true
      after_seconds: 2.5
      phrases: ["One moment.", "Let me check.", "Checking now."]
  barge_in:
    # Interrupt Lloyd when the enrolled speaker starts talking over him.
    # Off by default because it needs client-side echo cancellation to be
    # safe: without AEC his own voice returns through the mic and he
    # interrupts himself on every utterance. VoiceRoom's half-duplex mute
    # currently makes that moot; turning this on is a decision to move to
    # full duplex, and wants `?raw_audio=0` (browser APM on).
    enabled: false
  wake:
    enabled: true
    words:
    - lloyd
    - hey lloyd
    - hi lloyd
    - okay lloyd
    - ok lloyd
    - hello lloyd
    continuation_seconds: 6.0
    skip_inject_if_only_wake_word: true
    # Also wake on a transcript that STARTS with one of the phrases above (one
    # leading "uh"/"um"/"oh" allowed). Measured 2026-09-17 over 48 wake
    # phrases in six TTS voices: the acoustic models caught 17-23, the
    # transcript 40; neither path accepted any of 48 near-misses ("Floyd came
    # over", "alloy wheels"), and the transcript path accepted none of 496
    # real utterances of room audio. It costs a Parakeet pass (~60 ms CPU) on
    # every idle utterance — the old gate ran Whisper on every one anyway.
    # The acoustic path stays: it fires mid-word, this one at utterance end.
    text_fallback: true
  acoustic_wake:
    enabled: true
    models_dir: agent-services/models/wakeword
    engine_dir: agent-services/models/openwakeword
    # 0.7 since hey_lloyd.onnx replaced Hey_Lloyd.onnx (2026-09-17, retrained
    # with livekit-wakeword's conv-attention head — scripts/voice/wakeword/).
    # Held-out, 10 TTS voices, through the worker's own runtime
    # (scripts/voice/wake_eval.py):
    #                          hey/hi/okay/hello  bare   near-miss  real room
    #   old models @ 0.4             16/60        7/20     2/80        0
    #   new + old Lloyd @ 0.7        33/60        5/20     0/80        0
    # The new model scores higher on everything, so the old 0.4 would let its
    # tail through: at 0.4-0.6 it fired once on the real-room corpus.
    threshold: 0.7
    # Suppression window after a fire. openWakeWord's score stays above
    # threshold for several frames after the word, so without this one
    # "hey Lloyd" opens the window three times and the diagnostic log reads
    # as three separate wakes.
    refractory_ms: 1500
  voiceprint:
    enabled: true
    profiles_dir: ${LLOYD_DATA}/voice_profiles
    # campplus | resemblyzer. CAM++ since 2026-09-24 (agent-services/speaker_id.py;
    # model from agent-services/setup/fetch-voice-models.sh). Profiles are saved
    # as <name>.<backend>.npy and another backend's are ignored, so a switch
    # needs re-enrolment — AND the two thresholds below, which are per model:
    # Resemblyzer's were 0.75 / 0.4, where its cosines crowd into 0.4-0.9.
    backend: campplus
    # Both thresholds from eval/speaker_embed_eval.py on LibriSpeech test-clean,
    # 40 speakers x 10 crops of 1/2/3/4 s (the worker's utterance lengths):
    #                            pair EER   profile EER   own-voice margin
    #   resemblyzer (old)          9.7%        4.3%           +0.07
    #   CAM++ (this)               4.7%        2.5%           +0.31
    # Profile = the mean of 3 clips, scored against the speaker's other 7 and
    # 39 other speakers' 7. At 0.40 CAM++ misses 5.0% of a speaker's clips and
    # names the wrong person on 0.48% — Resemblyzer's 0.75 had the same 0.48%
    # false accepts for 13.6% misses. Clean read speech: expect more misses in
    # the room, fewer if a profile is enrolled from several clips.
    profile_threshold: 0.40
    # One clip against one clip ("still the same voice as the wake word").
    # A false reject drops a real follow-up, so this sits at ~4% of same-speaker
    # pairs rejected (7.4% when a clip is 1 s) and lets 6.0% of different-
    # speaker pairs through. Resemblyzer's 0.4 let 89% through — it was an
    # identity check in name only.
    anchor_threshold: 0.25
    device: cpu          # resemblyzer only; CAM++ runs on onnxruntime CPU
    num_threads: 2       # CAM++ onnxruntime intra-op threads; ~20 ms a 1 s clip, ~60 ms at 4 s
    unknown_label: Unknown
# Self-modification loop: worktree -> gate -> promote, with guardian rollback.
# `enabled: false` is the master switch and the default. The machinery lands
# inert; turning it on is a deliberate human act.
automod:
  # Enabled 2026-09-06, after the autonomous path was fixed. It had shipped
  # inert since it was written, and the two landings in its history were both
  # driven from a terminal — the MCP path would have failed on first use,
  # because the promoter ran inside the process it restarts.
  enabled: true
  # The chamber (2026-09-14). On: the next autocode round may start while a
  # promotion is `observing` — its turn and gate (~33 min median) hide the
  # 15-minute window — and its landing waits for that promotion to settle
  # before it lands (scripts/automod/promote.py wait_for_settle). A
  # `landing` promotion, a pending rollback request and a halt still stop
  # new rounds. The observation windows cost 31.7 h in the week to 09-14.
  # Ships OFF: the plan turns it on after the turn-end reaper and the
  # land.running marker (a round waiting to land must not be reaped while it
  # waits) have run in production for 2-3 days.
  # ON 2026-09-15 (Alan): one day of both in production, the three reaper
  # calls in the log were all correct, and the observation windows were
  # costing ~2 h/day of round time against a 156-item confirmed queue.
  chamber: true
  # A round may only be opened from a turn with Inner Voice attached. Two
  # reasons: the observer watches the one activity that rewrites production,
  # and an IV session is the only kind the Inner Voice tab lists, so this is
  # what makes a round reviewable afterwards rather than just a ledger row and
  # a diff. `automod_start` enables the flag and refuses once, because the
  # observer attaches at turn start and cannot be added to a turn in flight.
  # The CLI is exempt: no bound session, and a human is their own observer.
  require_inner_voice: true
  gate:
    # Rung reuse. A gate with review runs 7-12 minutes and every re-gate
    # replays the whole ladder, so a 60-minute round gets about one fix
    # cycle. A rung is answered from the round's own cache only when the
    # base has not moved, the cached head is an ancestor of this one, the
    # entry is fresher than `reuse_max_age_s`, and the delta since could not
    # have changed that rung's answer. `preflight`, `static` and `review`
    # always run; `tests` is never reused bare, but a delta that is only
    # test files (and no conftest or helper) re-runs just those files.
    reuse_rungs: true
    reuse_max_age_s: 3600
    # The `tests` rung's FULL runs, in parallel (pytest-xdist, `--dist
    # loadfile`). The suite went 153 s -> ~600 s serial in the week to
    # 2026-09-18 on a 32-core box, holding gate-tests.lock the whole time, so
    # each extra round in flight queued that long again; 8 workers run it in
    # ~70 s. A failure under load is never believed: every file that failed is
    # re-run serially and THAT run is the verdict (`parallel_only_failures`
    # in the rung data names what flinched). 1 = serial, as before; also
    # serial, saying so, whenever xdist is not importable in the gate's venv.
    # Read by each gate process at start: no restart needed.
    test_workers: 8
    # A `tests` failure that reproduces at the round's base PASSES the rung
    # (recorded as `pre_existing_failures`) — 157 rounds a week died on a red
    # tree they did not break. The base probe's answer is cached per base sha
    # for this long (state dir `red_set.json`), so the next round on that base
    # skips the probe.
    red_set_max_age_s: 21600
    # ...and the breakage is filed as one `high`, pre-confirmed `red-tree`
    # item that the next round takes, closed by the gate on the first full
    # green run at a descendant base. false = pass and record, file nothing.
    file_red_tree: true
  # The review rung's policy knobs. The rung refused 86% of the rounds it
  # graded over 2026-09-11 and the two largest contributors were both
  # findings that are real and usually unfixable INSIDE the round.
  review:
    # `never` (2026-09-24): an unverified seam never refuses a round; it
    # rides to the item as a post-landing check (`post_landing_seams`).
    # Over the week before, 72 of 130 review send-backs had every clause
    # `met` and were refused only on a seam on attempt 1 — each a ~5 min
    # review (457 graded, median 326 s), a ~15 min fix cycle and a full
    # re-gate. `first` (the code default) blocks on attempt 1 only; `always`
    # blocks every attempt. Both stay for `review_tools redecide --seams-policy`.
    seams_block: never
  landing:
    # How long the backend may stay busy with NOTHING of the pool's in flight
    # (a chat turn, a leaked counter) before a landing gives up. While a
    # paused pool's job is what it is waiting on the clock does not run —
    # #1204 lost a gate-passed landing to a 37-minute scheduled task by 112 s
    # (2026-09-17) — and `idle_hard_max_wait_s` bounds the whole wait,
    # including the wait for another round's turn. Read by promote.py since
    # that day; before it these keys were read by nothing.
    idle_max_wait_s: 900
    idle_hard_max_wait_s: 4500
    # One commit on main per landing (Alan, 2026-09-17). The promoter squashes
    # the round's branch after the last gate and before the fast-forward, to
    # a commit whose tree is proved identical to the gated one; the working
    # history stays under refs/automod/rounds/<round>. false: every commit
    # of the branch lands, as before.
    squash: true
    # A landing that changes no file the backend or the aggregator has
    # loaded restarts nothing (2026-09-19): no drain, no pool pause, no wait
    # for the other rounds' turns. The promoter asks both processes
    # (app/loaded_paths.py) and fails closed; nine of nineteen promotions on
    # the night of 09-18 were tests, eval/, docs and per-invocation scripts.
    # false: every landing drains and restarts, as before.
    skip_restart: true
    idle_quiet_polls: 3
    drain_ttl_s: 180
    # The observation window: how long the guardian judges a promotion before
    # it settles and becomes the last-known-good. It is also what every other
    # landing queues behind (promote.wait_for_settle), which is what makes it
    # the loop's throughput knob as much as its safety one.
    #
    # 900 until 2026-09-20, when it cost 13.5 h of a 24 h day across 54
    # promotions while every rollback it has EVER caused fired within 5.5 min
    # of the landing (4 s, 147 s, 262 s, 327 s — all four false positives or
    # misattributions). 450 cleared the longest of those with margin; 300
    # since 2026-09-24 (Alan's ruling, with the land train below): the crash
    # fired at 147 s and the error spike at 4 s, the 327 s trip was a .git
    # repack miscount, and a data-home or vault wipe is caught on every
    # guardian tick, inside a window or not.
    #
    # The unrestarted window is for a landing that replaced no process
    # (`skip_restart` above). The guardian already skips liveness and the
    # error rate for one: the code that could crash is the code that was
    # already running. It still judges data damage, because a script the
    # landing changed can be run by a job inside the window, so this is
    # shortened rather than removed. 24 of the 55 promotions on 09-20
    # restarted nothing.
    #
    # promote.py clamps both to [60, 3600]: a window under a minute cannot
    # judge anything (the guardian ticks at 5 s and `crash` needs three failed
    # probes) yet still settles and advances the LKG, which would quietly turn
    # "last known good" into "last landed".
    errors_window_s: 300
    errors_window_unrestarted_s: 120
    # The land train (2026-09-24, architecture/automod.md §3.2i). On, a
    # landing that need not restart anything NOW only merges: `main` moves,
    # `promoted` is written, the regression check starts, and the landing goes
    # on pending_restart.json with no window. A flush (`round flush`, or the
    # implement source at a natural gap / after restart_after_s / at
    # restart_batch_max) restarts ONCE for all of it and writes one record
    # with `commits`, which the guardian rolls back as a batch. An eager
    # landing (candidate venv, agent-services/) restarts inline and carries
    # the batch. Read as off while the STAGED guardian lacks BATCH_SCHEMA 2
    # (the interlock), and for batch_suspend_after_rollback_s after a batch
    # rollback, so re-landings are judged one at a time. Ships false: flip it
    # after the guardian is restaged and `rehearse --batch` is green.
    # On since 2026-09-24: guardian restaged (BATCH_SCHEMA 2) and
    # `rehearse --batch` green on all four routes (reset, revert, batch-reset,
    # batch-revert keeping a foreign commit).
    defer_restart: true
    restart_after_s: 2700
    restart_batch_max: 4
    batch_suspend_after_rollback_s: 21600

# Write-time dedupe for backlog_write_task (agent_mcp/backlog_similar.py).
# Every create is checked against the board: the qmd daemon's reranked vector
# search over the `backlog` collection it already embeds, plus a lexical
# Jaccard over the item heads on disk. A create tagged `spawned-by-*` whose
# finding an open item already covers is appended to that item instead of
# filed beside it; a human's write is only ever advised. Every decision is
# logged to ~/.local/state/lloyd-automod/dedupe.jsonl so the threshold can
# be tuned from data. `merge: false` is the observation mode.
backlog:
  dedupe:
    enabled: true
    merge: true
    # Reranker score floor. Measured 2026-09-11: a verbatim title scores its
    # own item 1.0, the nearest distinct neighbour 0.55-0.60, and an
    # unrelated query still put 0.75 on its top hit — which is why the
    # lexical leg must agree (rule A) and the score alone never merges.
    threshold: 0.78
    lexical_min: 0.4
    shared_min: 4
    # Rule B: a strong lexical match on an item created inside this window
    # is the same session filing the same finding twice, before the qmd
    # watcher (2 s debounce plus embed time) has seen the first copy.
    recent_lexical_min: 0.6
    recent_window_seconds: 600

server:
  host: 0.0.0.0
  port: 8080
services:
  backend: http://127.0.0.1:8080
  lloyd_mcp: http://127.0.0.1:8500/mcp
  qmd: http://localhost:8181/query
youtube:
  transcript_fallback_chain:
  - youtube_transcript_api
  - browser_evaluate_transcript_extractor
  - vtt_parsing
  max_retries: 5
  retry_delay_seconds: 2
skills:
  directories:
  - ~/obsidian/skills
  - ~/lloyd/skills
workers:
  db_path: ${LLOYD_DATA}/workers.db
  enabled: true
  max_attempts: 3
  # 5, not 2 (2026-09-17): two autocode rounds and two autotriage turns may
  # run at once (their `max_inflight` below), plus one slot so a scheduled
  # task is never queued behind them. At 2, a finished round's next claim
  # waited 8-30 min on three nights' worth of rows whenever a scheduled task
  # and a triage held both slots. The engine, not the slot count, is the
  # bound on long-lived turns: see kv_gate. Back to 3 with depth 1 and 1.
  # 6 since 2026-09-18: autocode went to 4 rounds (c130287) beside 1 triage,
  # and the rule is rounds + triages + 1 — `tests/test_loop_depth.py` pins it,
  # so at 5 every round's `tests` rung was red on a test no round had touched.
  slots: 6
  # KV budget gate (workers/pool.py). A source that declares LONG_LIVED —
  # autocode, autotriage, deep-research, arch-review: tens of iterations, each
  # re-submitting a 100-200k context — is not claimed while the primary's KV
  # usage is above `max_kv_usage`; everything else claims as before. A held
  # item stays queued with its attempt intact, and no reading means open.
  # The reading is the median over `window_seconds`, because a cold 200k
  # prefill alone drives the gauge from 0.20 to 0.96 for its ~21 s (measured
  # 2026-09-10) and the gate is about residents, not prefills.
  # Visible as `pool.kv_gate` on /api/workers/status and on the dashboard.
  kv_gate:
    enabled: true
    max_kv_usage: 0.60
    window_seconds: 60
  # Round hold (workers/pool.py). While an `autocode` round is in flight,
  # nothing else claims a slot except the sources named here. A round is the
  # rarest and most expensive job in the pool — one worktree, nine gate rungs,
  # a landing that restarts the backend — and the one most damaged by sharing
  # the primary: it re-submits a 100-200k context every iteration, so anything
  # else claiming a slot evicts its prefix. On 2026-09-11 every autocode
  # session showed cold re-prefills (0.14-0.85M tokens per session), with 14
  # scheduled-task and 15 autotriage runs on the same engine in one window.
  #
  # The KV gate above asks "is the engine full now"; this asks "is the one job
  # worth protecting running at all". Different questions, both cheap.
  #
  # `scheduled-task` is exempt: those are short and time-sensitive, and a
  # user-visible schedule slipping by an hour is its own failure.
  # `autotriage` is exempt since 2026-09-15 (Alan: an autocoder round runs
  # 100% of the time, no downtime). The hold used to keep triage to the gaps
  # between rounds; with no gaps it would never run. The 09-11 evictions were
  # measured on the BF16 cache; the FP8 pool is 1.74x that, a sweep batch is
  # ~40k tokens beside a round's ~150k, and the KV gate above still holds a
  # long-lived triage while the engine's median KV is over 60%.
  round_hold:
    enabled: true
    # autoresearch is exempt (2026-09-16) because a round is in flight nearly
    # 100% of the time and a held source never runs; its 4 h interval bounds
    # what it takes from the engine.
    # automod-regression is exempt (2026-09-18) for the same reason and an
    # easier one: its job is now a few milliseconds — it only starts the
    # detached runner — and the comparison it starts has no LLM in it.
    exempt: [scheduled-task, autotriage, autoresearch, automod-regression]
  # Poison sweep — periodic triage of the dead-letter pile. Runs from the
  # pool's scheduler loop (not a work source: a source that repairs the queue
  # would be starved by a backed-up queue) and is deterministic (no model:
  # #76 Queue Health Check is the analyst on top, and it needs the very
  # things that are in doubt when items are poisoning). See
  # workers/maintenance.py.
  maintenance:
    enabled: true
    interval_seconds: 900
    # A transient failure buys exactly one more claim, ever. Task #76's log:
    # "a weekly reset that does not fix the cause just re-poisons".
    max_revives: 1
    revive_delay_seconds: 300
    # Nth poisoning of the same (source, signature) stops looking transient.
    repeat_threshold: 3
    tally_retention_days: 14
    scan_limit: 200
  sources:
    # Cut 3 of senses-not-supervision: one steward turn instead of the
    # backlog state machine (`desired_statuses`, `reconcile_statuses`,
    # `implement_outcomes` and its caps, quarantine, expiry, the three-tier
    # `select_confirmed`). Every 15 minutes it reads the ledger since its
    # last pass and the open board and answers with the moves and the next
    # pick. `apply: false` is the state it ships and runs in today: it
    # records how far its answer agrees with the machine's (`agreement()`,
    # on its `board_steward` ledger rows) and writes nothing. Flip to
    # `apply: true` only after a run of live ticks at `apply: false` whose
    # `rate` stands over a minimum event count — `rate` reads 1.0 over zero
    # judged decisions, so a few ticks prove nothing — and with the
    # `autocode.status_pipeline` / `close_on_settle` handover decided as a
    # precondition of the flip, not as its consequence. With `apply: true`
    # it writes through the one status writer and `select_confirmed` takes
    # its pick. It may never set `done`: closing is
    # gated on a settled promotion that said `met`, and stays mechanical.
    # Primary since the first live tick: on the secondary it made ordering
    # errors in two of five dry-runs and the live tick died at max_turns on
    # tool reads with no answer. A two-minute judgment every fifteen minutes
    # is a cost the primary can carry, and the round hold keeps it off the
    # engine while a round runs.
    board-steward:
      enabled: true
      apply: false
      interval_seconds: 900
      max_inflight: 1
      max_duration_seconds: 600
      model: primary
      max_turns: 16
      max_events: 300
      max_items: 80
      priority: 68
      # Off, like every other unattended turn since cut 1 of
      # senses-not-supervision (2026-09-12). It landed the same day with no
      # key and inherited the old True fallback, so it was the one source
      # still watched on the primary every 900 s (#1015).
      inner_voice: false
    # OFF since 2026-09-08. This source promoted generated prompt variants
    # straight over the live `lloyd/SOUL.md` / `MEMORY.md` every hour with no
    # gate, no test, no review and no revert. It is what produced the #464
    # MEMORY.md clobber, and at 09:54 on 2026-09-08 it overwrote the operating
    # contract *during* the round that was trimming it — re-inflating the gate
    # stack to 64% ninety minutes after #377 cut it to 48%, with a variant
    # whose own hypothesis was "add negative constraints to fix the shape
    # benchmarks", the technique #377 was filed against.
    #
    # `promote()` now refuses a variant that breaks the prompt-surface
    # invariants and commits what it does apply through `automod_vault_land`,
    # so the writer is bounded rather than removed. It stays off until backlog
    # #506 closes the rest — `variant.json` written with `json.dump`, and the
    # snapshot directory wired up as a real rollback target. Flip `enabled` to
    # re-arm; nothing else needs changing.
    #
    # 2026-09-13 (Alan): #506 is done, but do NOT re-arm yet — since fe40af3
    # `run_round` never benches a variant (#876), so every round is baseline-
    # only and can promote nothing. Re-arm once #876 lands.
    # 2026-09-16: #876 landed 09-15 (every variant is benched again) and
    # Alan pre-approved the re-arm on 09-13. Every 4 h, not hourly: a round
    # runs ~100% of the time now and autoresearch is exempt from the round
    # hold (below), so this is the share of the primary it may take beside
    # a round — at most 30 min in 4 h.
    autoresearch:
      enabled: true
      interval_seconds: 14400
      max_inflight: 1
      max_duration_seconds: 1800
    # Behavioural-regression check for a landed self-modification. Off until
    # the loop itself is enabled — it is a no-op without a promotion under
    # observation, but there is no reason to schedule it before then.
    automod-regression:
      # Enabled as a POST-LANDING check, not a gate rung. The gate's canary is
      # deliberately data-isolated (its own empty scratch vault), so a quality
      # eval run there would score an empty corpus and measure nothing. This
      # has to run against live data in a separate worktree, which is what the
      # paired A/B does. It measures once per promotion and dedups on the
      # commit, so an hourly interval means "shortly after a landing", not
      # hourly evals.
      # Since 2026-09-18 the comparison runs DETACHED, one per promotion off
      # the ledger (architecture/automod.md §8.1): the promoter starts the
      # runner the moment a landing is verified, and this source is only the
      # safety net for a runner that could not start — hence 900, not 3600.
      # On that day 8 of 17 promotions had been measured, 0 of the last 4.
      enabled: true
      interval_seconds: 900
      max_inflight: 1
      max_duration_seconds: 1800
    # Re-checks one backlog item per run against the system as it is today.
    # Read-only: it reaches a verdict and retires stale items, and never
    # implements anything — confirmed items go through the automod gate as a
    # separate, explicit act.
    #
    # 1800 -> 3600 on 2026-09-08. At 30 minutes this pass is a net PRODUCER of
    # backlog: its first 40 runs closed 28 items and filed 78 (R = 1.95), and
    # because spawned items are written `draft` — an OPEN status — every one
    # re-entered the queue it came from. The open board went 19 -> 122 in 48
    # hours with 110 of the 122 self-filed. `backlog.is_quarantined` is the
    # actual fix; this interval is the second half of it. Triage is a pass
    # over a finite stale backlog, not a service, and once it has worked
    # through that backlog the right cadence is "occasionally", not "twice an
    # hour" — it now reports how many items it is holding rather than
    # claiming the board is clear.
    autotriage:
      enabled: true
      # 3600 -> 900 on 2026-09-11, back to autocode's cadence. The hour was
      # the second half of the quarantine fix above, for a pass that filed
      # ~2 items per item it read. Filing now merges into an existing item
      # (backlog.dedupe) and a group run closes several at once, so the
      # cadence is bounded by the work, not by its own output. Two pool
      # slots and the KV gate arbitrate against an in-flight autocode round.
      # 900 -> 300 (Alan, 2026-09-15) for the sweep: a batch takes ~5 min,
      # so 300 s is back-to-back while the board is being read. Back to 900
      # on 2026-09-16 14:35Z: the sweep read the whole board (67 batches,
      # 423 ranked) and at 300 s single triage ran back to back, confirming
      # into a pool the loop cannot drain (39 held) while sharing the engine
      # with rounds. New items still get swept: the sweep takes precedence
      # whenever the pool is non-empty, at whatever cadence this is.
      interval_seconds: 900
      # Triage DEPTH: how many triage turns run at once. Each claims what it
      # reads (`backlog.claim_for_triage`) so two turns never take the same
      # item, cluster or sweep batch. 2 with autocode's (Alan, 2026-09-17);
      # back to 1 when the board is caught up. Needs a backend restart.
      max_inflight: 1
      # The sweep (2026-09-15, Alan's "switch gears"): while any open item
      # is unread, a run takes `sweep_batch` items in one turn instead of a
      # cluster or a single item, quarantine lifted, and either retires each
      # (stale / already_done / duplicate_of) or ranks it (worth × size on
      # the item, tag `swept`; a `low` draft is also `parked`: out of every
      # pool, never expired, promoted by removing the tag). Every pool then
      # orders on the rank (backlog.rank_key). Autocode yields to it
      # (`yield_to_sweep` below), so the board of ~560 is read in a day
      # rather than in the gaps between rounds. Group and single triage
      # resume by themselves once `round sweep-status` reads unswept 0.
      # Off: never runs, nothing yields.
      sweep: true
      sweep_batch: 8
      sweep_max_turns: 60
      # Off 2026-09-15 for the sweep (56 umbrellas of 8-12 clauses sat in
      # up_next landing 1 in 5; `round unfold-oversized` sent their members
      # back to be ranked). On again 2026-09-16: measured after the sweep,
      # umbrellas closed 1.47 items per round-hour against 0.51 for singles,
      # in rounds no longer. group_max_items 4 and MAX_CLAUSES 6 keep them
      # the shape that landed.
      form_umbrellas: true
      # Group mode: when clusters.json (the nightly backlog-cluster source)
      # holds a cluster with >= group_min_items untriaged members, this run
      # takes the cluster instead of one item and consolidates it — closes
      # duplicates, retires stale ones, folds the rest into one umbrella
      # item. Off: this source runs exactly as before and clusters.json is
      # ignored.
      group_triage: true
      group_min_items: 2
      # 8 -> 4 (2026-09-14): umbrellas of 8-12 clauses were 56 of 92 up_next
      # items and 5 of 68 formed had landed; four members is a contract one
      # round can meet. Clauses are capped at 6 (backlog.MAX_CLAUSES).
      group_max_items: 4
      group_max_turns: 120
      # Inner Voice. Every background run is RECORDED regardless
      # (`harness.background_recording`); this is whether the observer
      # watches. It runs on the primary at priority 1 and spends a
      # goal-extraction call plus a critique per turn, so it is on only
      # where the judgement is worth a second opinion. Meaningful only
      # for a source that runs through `run_prompt_in_session` — the
      # observer is wired in the chat endpoint and nowhere else.
      # OFF for unattended turns since 2026-09-12 (plan: senses-not-supervision,
      # cut 1). Measured effect on rounds was negative: #874 abandoned at
      # iteration 38 with 44 min left on an invented premise, 16 false
      # repetition fires in one day, an inject into #875 with no room to
      # answer. Stall rescue, budget and context pressure are deterministic
      # anchors now; the gate is the real check. Stays on for chat, where a
      # human reads it and its value was measured there.
      inner_voice: false
      # Runs as a real session through /api/message/stream, so it has Inner
      # Voice and a transcript. Budgets are measured, not guessed: the three
      # hand-driven triages took 45, 65 and 76 iterations and 8-30 minutes.
      max_duration_seconds: 3600
      max_turns: 90
      # The item body is truncated from the END, which is where appended triage
      # sections live, so the original content survives. 6000 cut more than
      # half of the oldest item on the board.
      body_chars: 30000
      # New items one single triage may file, and only when the item it read
      # is closing; a kept item gets its findings appended instead. 3 -> 1 on
      # 2026-09-13: triage filed 0.989 items per item it closed, and 80 of
      # the first 100 confirmed triages filed at least one.
      spawn_cap: 1
      # The implement-pool depth gate. The pool is full while the items
      # autocode would actually take (backlog.ready_confirmed) number at
      # least max(implement_pool_floor, distinct items landed in the last
      # 7 d): confirmations beyond a week's drain only age. Raise the floor
      # to loosen it.
      implement_pool_floor: 20
      # Under a full pool, triage still runs — its stale/already_done closes
      # are the loop's largest outflow — and a `confirmed` verdict is HELD in
      # draft (tag confirmed-held) until a slot opens, oldest first. false:
      # a full pool pauses single triage outright (the 2026-09-13 gate, which
      # stopped the retirements too) and everything held is released.
      hold_confirmations: true
    # Picks up items triage has CONFIRMED (with an acceptance check) and runs
    # one automod round on each through the normal gate. This is the only
    # automated path from a backlog item to landed code, and it is gated
    # hard: refuses while a promotion is under observation, while halted or
    # broken, or while a round is open. One item per run, oldest first.
    #
    # 14400 -> 3600 on 2026-09-08. Four hours made the only drain in this
    # system eight times rarer than the pass that fills it, which is the wrong
    # way round whatever the spawn rate is. It cannot actually run hourly —
    # `_loop_is_free` refuses while a round is open or a promotion is under
    # observation, and a round plus its 15-minute window is most of an hour —
    # so this is "try as soon as the loop is free", with the gates doing the
    # throttling. That is the correct place for it: they know whether a round
    # is safe to start and a clock does not.
    #
    # 3600 -> 900 on 2026-09-09, which is the same argument carried to its
    # end: if the gates decide when a round may start, the clock's only job
    # is to ask them often enough. At an hour it did not. Round
    # SM_20260909_185311 landed at 19:00 and settled at 19:16, and the poll
    # was not due again until 19:50 — 34 minutes of a free loop, four
    # confirmed items sitting in `up_next`, and nothing running. That gap is
    # pure loss: the observation window has already closed, so there is
    # nothing the wait is protecting. Three things stop 15 minutes from
    # meaning four rounds an hour, and all three predate this change:
    # `_loop_is_free` (no queue while a round is open, a promotion is under
    # observation, or a rollback is pending, re-checked in `execute` because
    # a queued item can sit), the `autocode:round` dedup key (coalesces
    # against any queued/claimed/running row), and `max_inflight: 1`. A poll
    # that finds any of those returns in milliseconds and logs one line. The
    # housekeeping at the top of `enqueue_if_due` — reap, close settled,
    # reconcile statuses, expire spawns — keeps this 900 s clock on its own
    # watermark (`last_housekeeping`).
    #
    # retry_seconds, 2026-09-13: the 900 s clock still idled the loop, because
    # a poll that DECLINED (a promotion under observation, a round still open)
    # stamped the watermark like one that ran, and the next look was a full
    # interval later. Median round-end → next-start was 9.6–14.5 min, ~12 h
    # of a free loop over the last fifty rounds. A declined check now looks
    # again in `retry_seconds`; a poll that enqueued, or found nothing
    # confirmed, still waits the interval.
    autocode:
      enabled: true
      interval_seconds: 900
      retry_seconds: 60
      # On: no round starts while autotriage's sweep still has open items to
      # read (backlog.sweep_pending > 0); the poll is declined and retried in
      # retry_seconds. OFF since 2026-09-15 22:50Z, three batches in (Alan: an
      # autocoder round runs 100% of the time). The sweep shares the engine
      # with rounds instead — see round_hold.exempt above — and reads the
      # board in ~5 h either way.
      yield_to_sweep: false
      # The loop's DEPTH: how many rounds may be open at once. One key sets
      # the queue's claim cap, the number of queue rows offered, and how many
      # worktrees `_loop_is_free` tolerates. Each round has its own worktree
      # and branch; gates queue for the full test suite and the canary ports
      # (`gate-tests.lock`, `gate-canary.lock`); landings stay one at a time
      # under the automod lock, and a landing waits out the other round's
      # turn before it pauses the pool. 2 (Alan, 2026-09-24, once the board was
      # cleared by hand; it was 4 during the 09-18 catch-up). Needs a backend restart.
      max_inflight: 2
      max_duration_seconds: 3600
      # 150, not 100 — the code's own default and its reason
      # (workers/sources/autocode.py DEFAULT_MAX_TURNS): a round called
      # automod_land at 91/100, #278 died at 101 with a gated change
      # unlanded, and the review rung now adds a fix-and-regate cycle.
      # 150 -> 250 (2026-09-17): iterations, not the clock, were what ended
      # rounds. 26 of 176 finished turns in the week died at max_turns, and
      # #1210 spent all 151 in 23 minutes of steady work (160 small tool
      # calls, ~9 s each, 19 edits, 23 pytest runs) with 37 minutes of its
      # 3600 s left and no gate run — the prompt's own pacing asks for the
      # first gate "by minute 30". `max_duration_seconds` is the bound that
      # means something; this one now sits past it for a turn of small steps.
      # Under agent.max_turns_ceiling_worker (300), or it is clamped.
      max_turns: 250
      # On: this source rewrites production. See `autotriage.inner_voice`.
      # OFF for unattended turns since 2026-09-12 (plan: senses-not-supervision,
      # cut 1). Measured effect on rounds was negative: #874 abandoned at
      # iteration 38 with 44 min left on an invented premise, 16 false
      # repetition fires in one day, an inject into #875 with no room to
      # answer. Stall rescue, budget and context pressure are deterministic
      # anchors now; the gate is the real check. Stays on for chat, where a
      # human reads it and its value was measured there.
      # The abandoned-round reaper's grace follows this key (2026-09-14): 20
      # minutes while an observer could still send #278's rescue, none while
      # it is off — a round the turn left open is then closed the moment the
      # turn ends, unless its gate or landing is still running. Turning this
      # back on brings the grace back with it.
      inner_voice: false
      # The rescue the observer used to make (#278: "if the gate passed, land
      # it"), done by the reaper since 2026-09-18: a round whose gate PASSED at
      # the commit it still holds, and whose turn is over, is landed rather
      # than aborted and re-offered for a whole new round. Four rounds that
      # day; architecture/automod.md §3.2g. Off: aborted, as before.
      land_passed_gates: true
      # Its sibling, one step earlier (2026-09-19): a round whose turn is over
      # and whose ONLY failed rung was a review that could not run — the
      # grader was unreachable, usually behind another round's landing — is
      # gated again by the loop (twice at most) instead of aborted and
      # re-offered for a whole new turn. About eleven rounds on the night of
      # 09-18. Off: aborted, as before.
      regate_unreviewed: true
      # The hard bound on the board. A self-filed draft that nothing —
      # clustering, group triage, a human — picked up in
      # expire_spawns_after_days is closed, tagged `expired`, and reopens by
      # setting its status back to draft. Runs in this source's housekeeping
      # beside the settle closer. Off: held items only accumulate, visible in the
      # triage skip summary and the scorecard's over-bound gauge, never lost.
      expire_spawns: true
      # 14, not the code's 30-day fallback (Alan, 2026-09-13): at 30 expiry had
      # never fired while 400 self-spawned items sat open. Read by expiry,
      # autotriage's skip summary and the scorecard gauge through one function.
      # 14 -> 7 (Alan, 2026-09-14): at 14 it still had never fired — the
      # oldest open self-spawned item was 7.0 days old — while 7 d of intake
      # was 733 created against 209 closed, and 79 quarantined drafts sat
      # waiting on a bound that had not yet come due. Closed items keep their
      # text and reopen by setting status back to draft.
      # 7 -> 30 (Alan, 2026-09-15): expiry was the ONLY exit for a quarantined
      # draft, so it closed items nothing had read — 27 were due within 24 h
      # and 29 of the 82 quarantined were youtube-eval ideas. The sweep
      # (autotriage.sweep) now reads every item once and ranks it; a swept
      # item is expiry-exempt, so this bound only reaches what the sweep has
      # not yet seen.
      expire_spawns_after_days: 30
      # When an umbrella (a group-triage consolidation) lands `met`, its
      # members close with it. Off: members stay folded until a human
      # unfolds the umbrella.
      close_members_on_settle: true
      # One automatic second life (2026-09-14). An item whose one implement
      # attempt is spent goes back through TRIAGE once — tag `re-triage`,
      # needs-human dropped, the refused round's findings and per-clause
      # verdicts in its <origin> — for a contract a round can meet, or a
      # retirement. Its earlier triage and implement rows stop counting, so
      # the attempt count starts over. The second spend is a human's, as
      # before. ~35 items a week went to needs-human, and 42 of the 67 a
      # person had reopened later landed. Never umbrellas (unfolded instead)
      # or landings. false: a spent item parks needs-human at once.
      retriage_spent: true
    # Nightly clustering of the open backlog (scripts/automod/cluster.py):
    # qmd's stored vectors + shared file paths + parent links, an optional
    # pair-judge on the secondary for the ambiguous edges, written to
    # ~/.local/state/lloyd-automod/clusters.json for autotriage's group mode.
    # "Nightly" is the age of the last output: polled hourly, runs when the
    # file is older than min_age_seconds, so a restart never doubles it up.
    backlog-cluster:
      enabled: true
      interval_seconds: 3600
      min_age_seconds: 72000
      # A younger file is rebuilt anyway once group triage has used it up
      # (nothing select_cluster would take), but no more often than this.
      exhausted_min_age_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 900
      # No session and no `inner_voice` key: a numpy pass plus a few JSON
      # calls to the secondary, so there is no turn to observe and
      # /api/workers/health renders it null (#1015).
      threshold: 0.75
      # Kill switch for the LLM pair-judge; off = cosine, paths and parents only.
      judge: true
      max_pairs_judged: 200
      # Write `parent:` frontmatter from the prose first line, once.
      persist_parents: true
    # One architecture review unit per real session: either a whole
    # architecture/*.md doc, or one functional group of autonomy-jobs.md /
    # workers-jobs.md (the `groups` list below, kept by hand). Oldest
    # last-reviewed first. The session checks the unit's claims and paths
    # against the tree and the health routes, reviews the code it names,
    # files findings as `arch-review` drafts (tag `spawned-by-review`:
    # merged at write time, expired at 30 d, NOT quarantined — a review
    # finding is exactly the kind of claim single triage should judge) and
    # edits the one doc in place; a group only inside its own section. The
    # source reverts every other write in this repo and in the vault's
    # skills/ and autonomy/, throws away a diff that breaks its bounds, and
    # commits the doc to main itself — the model never runs git.
    # State: ~/.local/state/lloyd-automod/arch_review.json.
    arch-review:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 3600
      max_turns: 90
      # On: it edits a production doc and files from its own judgement.
      # OFF for unattended turns since 2026-09-12 (plan: senses-not-supervision,
      # cut 1). Measured effect on rounds was negative: #874 abandoned at
      # iteration 38 with 44 min left on an invented premise, 16 false
      # repetition fires in one day, an inject into #875 with no room to
      # answer. Stall rescue, budget and context pressure are deterministic
      # anchors now; the gate is the real check. Stays on for chat, where a
      # human reads it and its value was measured there.
      inner_voice: false
      # Below youtube-digest (45) and autocode (40), above backlog-cluster
      # (65): routine maintenance that must not delay a round or a digest.
      priority: 62
      batch: 2
      review_interval_days: 30      # a unit rests this long after a review
      retry_spacing_seconds: 21600  # between failed attempts
      max_attempts: 3               # then the unit is parked for that spacing
      daily_max: 4                  # a first pass over the picklist in ~a week
      max_open_items: 25            # open arch-review items before a tick skips
      spawn_cap: 5
      max_delta_lines: 400          # a group section is <= 162 lines; 400 is a doc refresh
      max_shrink_pct: 30            # waived for a `superseded`/`aspirational` banner
      # The functional groups of the two jobs docs, one unit each. Each entry
      # is `<doc slug>:<section name>`; the name is matched against the `## `
      # heading with a leading `N. ` and anything from `:` or ` — ` stripped,
      # case-insensitively. A name with no matching heading is skipped and
      # recorded as `section_missing` — and the doc's own review is shown this
      # list and told to file a finding when it no longer matches its tables.
      groups:
        - autonomy-jobs:Ingest
        - autonomy-jobs:Distil
        - autonomy-jobs:Build the graph
        - autonomy-jobs:Canonicalize
        - autonomy-jobs:Queue the work
        - autonomy-jobs:Bound entropy
        - autonomy-jobs:Measure
        - workers-jobs:Dispatch
        - workers-jobs:Self-modification
        - workers-jobs:Intake
        - workers-jobs:Mining
    bench-mine:
      enabled: true
      interval_seconds: 7200
      max_inflight: 1
      max_duration_seconds: 1800
      # Iteration ceiling for one mining turn (#896). It was a literal 8 at
      # both call sites, and 112 of 115 all-time failures to 2026-09-18 were
      # `stop_reason=max_turns, turns=9` against it — 217 GPU-minutes writing
      # nothing. Raised to 12; the item's post-landing measurement is that
      # cap deaths with nothing written stay under 25 % of ≥10 consecutive
      # runs, read from `runs` after the landing. Absent, the code's default
      # is 8. Carried in the queue payload, so a change reaches new items only.
      max_turns: 12
    # Researches one registry topic per run through the deep-dive-research
    # skill, and records the outcome back on the topic. Replaces
    # `domain-research`, whose prompt never told the model to search the web:
    # 142 notes, 90 of them empty, none ever promoted. Left disabled until the
    # legacy import has run — an empty registry makes it a no-op either way.
    # One tracked YouTube video per real session (Inner Voice on): the
    # script fetches the transcript into a bundle, the session reads it,
    # writes the vault note, judges it against eval/lloyd_profile.md and
    # files a draft backlog item when something would improve Lloyd.
    # Replaces autonomy task #75's script-only digest for both channels.
    # `batch` is how many sit queued at once (refilled each tick), not a
    # daily cap; `max_inflight: 1` keeps one primary-heavy turn at a time.
    youtube-digest:
      enabled: true
      interval_seconds: 300
      max_inflight: 1
      # On: it evaluates untrusted transcripts against Lloyd's own profile
      # and files backlog items from the answer. See `autotriage.inner_voice`.
      # OFF for unattended turns since 2026-09-12 (plan: senses-not-supervision,
      # cut 1). Measured effect on rounds was negative: #874 abandoned at
      # iteration 38 with 44 min left on an invented premise, 16 false
      # repetition fires in one day, an inject into #875 with no room to
      # answer. Stall rescue, budget and context pressure are deterministic
      # anchors now; the gate is the real check. Stays on for chat, where a
      # human reads it and its value was measured there.
      inner_voice: false
      # 45, not the source default of 60: scheduled-task maps autonomy
      # priorities critical/high/medium/low/background to 10/20/30/50/70
      # and may hold both slots, so at 60 a digest only ran in the gaps
      # between due autonomy tasks — three sat queued for 25 minutes on
      # 2026-09-09 while two low-priority KG jobs held both slots. At 45
      # with max_inflight 1 the digest takes one slot whenever it has work
      # and beats low/background autonomy work for it; medium and above,
      # and an autocode round (40), still go first.
      priority: 45
      max_duration_seconds: 1800
      max_turns: 40
      batch: 3
      # OFF for unattended turns since 2026-09-12 (plan: senses-not-supervision,
      # cut 1). Measured effect on rounds was negative: #874 abandoned at
      # iteration 38 with 44 min left on an invented premise, 16 false
      # repetition fires in one day, an inject into #875 with no room to
      # answer. Stall rescue, budget and context pressure are deterministic
      # anchors now; the gate is the real check. Stays on for chat, where a
      # human reads it and its value was measured there.
      inner_voice: false
      channels: [ai-engineer, discover-ai]
      # Items this source files (tag `youtube-eval`) are loop output, like a
      # `spawned-by-*` item (Alan, 2026-09-14): held out of single-item
      # triage, closed by the self-spawn expiry, merged at write time into
      # an open item that already covers them, counted on the scorecard's
      # self-spawned gauge. 125 were filed in the week to 09-14 and 101 were
      # still open, bounded by nothing. false: they read as a human's items.
      loop_spawned: true
    deep-research:
      enabled: true
      interval_seconds: 3600
      max_inflight: 1
      # Off: a research summary is read by a human before anything acts on
      # it, and this source runs often enough that observing it would put a
      # goal extraction plus a critique per turn in front of chat all day.
      # It was a `inner_voice=False` literal in the source until 2026-09-10,
      # which is to say it was not a setting at all.
      inner_voice: false
      # The turn's own budget is this minus POOL_TIMEOUT_MARGIN_SECONDS, so it
      # cancels itself in the backend rather than being cancelled from outside.
      max_duration_seconds: 1800
      max_turns: 60
      # A hard ceiling on GPU spent researching per day. The registry can hold
      # 40 topics; without this, one night's proposals become one day's work.
      daily_max: 3
    scheduled-task:
      enabled: true
      interval_seconds: 60
      max_inflight: 2
      # BOTH caps apply, min wins: the task-level timeout_seconds in the .md
      # frontmatter is enforced by autonomy.run_task, this source-level cap by
      # pool.py's asyncio.wait_for. See USER.md tool_reliability "Timeout caps".
      # 1800 -> 3600 on 2026-09-03 (autonomy audit): when the two caps were equal
      # the POOL timer won the race, cancelling run_task with CancelledError so its
      # own handler never ran — no run record, no activity-log line, task file left
      # in_progress (237 such runs / 73.6 GPU-h in workers.db had a NULL task_id).
      # run_task now derives an effective timeout of (this cap - 30s), so the task
      # handler always wins; this headroom also lets #39 (2400s) and #81 (5700s)
      # actually finish instead of being deterministically killed.
      max_duration_seconds: 3600
    session-distill:
      enabled: true
      interval_seconds: 1800
      max_inflight: 1
      max_duration_seconds: 600
  staging_root: ${LLOYD_DATA}/_pipeline/vault-derived/pending-research

# Fact writes through the fact_add MCP tool. The rebuild sets this
# false so a chat turn cannot add a fact to a tree about to be renamed.
knowledge_graph:
  write_enabled: true
