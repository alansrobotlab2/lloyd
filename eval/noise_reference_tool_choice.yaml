what: 'Backlog #875 acceptance clause 2, pinned against the real engine. These are the artifacts `875noise-a`
  and `875noise-b` as recorded on 2026-09-13: two runs of the SAME unmodified tree, 75 seconds apart (13:59:49Z
  and 14:01:04Z), n=20, identical recorded `config`. They moved correct_rate 0.900 -> 0.850 (-0.050) and
  http_tool_first_rate 0.857 -> 0.786 (-0.071) while control_correct_rate held at 1.000. #691 measured
  the same instrument and the same two magnitudes 82 s apart on 2026-09-09, at the opposite sign.'
proves: 'Comparing b against a must exit 0: no regression, no instrument failure. Nothing here is synthesised
  — the overall block and every per-query scoring are byte-for-byte what the eval wrote, which is why
  the file is big. Only prompt and response text was dropped, and neither is read by the comparison.'
why_yaml_and_not_the_json_artifacts: '`*.json` is ignored repo-wide (.gitignore:33) and `eval/baselines/`
  is ignored outright, so the live pair exists only on the box that ran it. A clause-2 check that reads
  those files skips on every fresh clone and proves nothing on the machine grading it, which is the fence-blind
  failure this item is about. YAML is the tracked form; the numbers inside are not a reconstruction of
  the pair, they are it.'
