# eval/skill_activation_cases.yaml — which skills the activation eval covers (#711).
#
# The cases themselves are NOT here. They are derived from the labelled turns in
# eval/skill_match_queries.yaml (#557): for each skill below, a turn labelled with
# it is a should_trigger case and every other turn is a should-not-trigger case
# carrying the skill that should have fired instead, or none. See
# scripts/skill_activation.py.
#
# Skills were picked as the five with the most labelled turns in that set.
# `recall_floor` is the recall the vault-landing gate will not let a rewrite of
# that skill push it under; it was set from the first baseline run
# (eval/run_skill_activation_eval.py), not chosen.
#
# `extra_records` are AUTHORED turns, not transcript turns, added only where the
# real set covers a skill with fewer than five positives. They use the same
# schema and join the corpus for every skill.
#
# The three skills #2812 added (youtube-digest, paper-digest,
# nightly-skills-management) have ZERO labelled turns in the #557 set — `git grep`
# for their slugs there returns nothing — because they are the protocols the
# recurring worker jobs run, and a job's own dispatch never hands an interactive
# turn to the matcher. So all fifteen of their positives are `extra_records`,
# labelled here rather than inherited from a transcript, and each `source` says
# whether the wording is quoted verbatim from a real session or modelled on one.
# Their floors are the recall the first grown-corpus run measured on 2026-10-16,
# recorded the same not-chosen way as the original five.
#
# What those floors do and do not guard, worth reading before rewriting one of
# these three files: scoring runs the INTERACTIVE injection leg — what `prefetch`
# would inject into a turn. A worker job never takes that path;
# `workers/sources/youtube_digest.py` reads `~/obsidian/skills/<slug>/SKILL.md` by
# path when it builds its prompt. That is this corpus's boundary, NOT a limit in
# the runner — the runner scores all three skills, and a PASS on a rewritten
# youtube-digest SKILL.md means only that its interactive activation held.

skills:
  # recall at the 2026-09-24 baseline (positives in brackets)
  voice-mode: {recall_floor: 0.375}                  # 3/8
  local-llm-gotchas: {recall_floor: 0.3333}          # 2/6
  poisoned-worker-troubleshoot: {recall_floor: 1.0}  # 6/6
  system-health-check: {recall_floor: 1.0}           # 5/5
  voice-clone-sample: {recall_floor: 0.6}            # 3/5
  # recall at the 2026-10-16 grown-corpus baseline, five authored positives each.
  # Five positives is a coarse instrument: its recall moves in steps of 0.2, so a
  # floor of 1.0 here means one missed positive is already under it and the landing
  # is refused — the same shape #711 shipped for system-health-check (5/5, 1.0).
  youtube-digest: {recall_floor: 1.0}                  # 5/5
  paper-digest: {recall_floor: 1.0}                    # 5/5
  nightly-skills-management: {recall_floor: 1.0}       # 5/5

extra_records:
- id: sac001
  turn: "the cloned voice sounds off again. can you cut a fresh reference clip for it from a different video and play me a sample?"
  expected_skills: [voice-clone-sample]
  expected_empty: false
  note: "authored 2026-09-24 for #711: the real set has four voice-clone-sample turns"
  source: "authored (#711), not a transcript turn"

