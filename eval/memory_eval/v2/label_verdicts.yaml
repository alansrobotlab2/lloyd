# Every v2 dev item's judged gold label: clean / brittle / defective.
# This file: eval/memory_eval/v2/label_verdicts.yaml — the census behind the
# per-category table in AUDIT.md, recomputed from it by tests/test_label_audit.py.
#
# A census of all 264 dev items, read 2026-10-09 for #2486. The rubric is
# eval/memory_eval/v1/AUDIT.md:9-13 and the precedent is that file's own line 3 — v1's 35
# verdicts were "judged by hand (Claude Code, for #1480)", one agent reading every item once.
# (35, not the 25 of v1's `random.Random(25)` seed: 24 clean + 8 brittle + 3 defective.)
# Same here: each item's prompt, its `accept.all_of` gold, its `none_of` anti-value, its
# grounding lines and its cited session text were read, and the counts published in AUDIT.md
# are computed from THIS file and pinned to it by a node in tests/test_label_audit.py.
#
# One row per dev item, in dev/questions.yaml order, at the SET ROOT. That placement is
# mechanical, not stylistic: `write_manifest` (eval/run_memory_eval.py:355-386) hashes the
# output of `_leg_files`, which rglobs *inside* each leg, so a file added under `dev/` would
# move `set_sha` and `load_set` would then refuse the set with `manifest edited after
# freezing` (run_memory_eval.py:565-566). Nothing here is read by the runner: the frozen set
# still verifies as `set_sha=16ec1ae14c046c61 label_status=pilot`, and `manifest.label_audit`
# still reports `audited: 32` with `derived_from: v1` — moving v2 off pilot is a ruling that
# follows the census, not part of it (AUDIT.md).
#
# `reason` names the thing actually inspected: the gold or anti value, the grounding line, or
# the slot the prompt asks for versus the one the gold fills. It is JSON-quoted because a plain
# YAML scalar over prose that quotes gold values verbatim breaks on the apostrophes.
