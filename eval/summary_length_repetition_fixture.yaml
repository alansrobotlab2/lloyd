  content: '**Disk layout** — Two 4 TB disks in `btrfs raid1`, mounted at `/data`. A separate 500 GB system
    SSD, never pooled into the array. Holding 14 years of sensor archives, ~2.9 TB of small files (4 KB–300
    KB each); block pointers left uncompressed because compression cost more CPU than the disk it saved
    on that file mix.


    **Ports** — Service on **8182**; admin on **8183**, management interface only. Plain HTTP, no TLS
    (accepted risk).


    **Pinned memory** — **48 GB** pinned for the archive cache. Below **32 GB** tail latency jumps from
    **9 ms to 140 ms**.


    **Export schedule** — The nightly export runs **Thursday at 16:00**, taking **40 minutes**.


    **Mount option that must not be removed** — `qmd-pin-overlay`. It keeps sequential reads from evicting
    the cache; dropping it is what makes the box feel slow.


    These are restated from the handover text as it appeared in this session''s earlier turns — I have
    not re-read the file from disk, so if precision matters, check the original.'
