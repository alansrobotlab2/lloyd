# eval/skill_match_queries.yaml — labelled query -> skill set for the prefetch skill matcher (#557).
#
# Purpose: the ONLY measurement of whether the skill matcher can FIND the skill a
# turn needs. Before this file there was no recall-side number anywhere: #311
# hardened precision (the matcher was injecting off-topic skills on 96% of turns),
# and nothing has measured what that hardening cost since.
#
# Provenance: every `turn` is verbatim user text from a real session transcript
# in the sessions directory (under the data root since 2026-09-22; the `source`
# line gives the file and message index).
# `lexical_arm_returned_nothing` is the run's own replay of the current matcher
# over the turn: the 68 live "No skills matched automatically" hints are that
# function's output, so replaying it reproduces the hint-emitting population
# rather than depending on a hint string that is not stored in transcripts.
#
# Labelling: assigned by reading each turn against the full 189-skill inventory.
# Both arms' top hits were displayed while labelling (pooled labelling), which
# biases labels toward what retrieval already finds; ~10 of the empty labels are
# turns where the arms confidently named a skill and that name is recorded as
# wrong on purpose. Labels name a skill when running its procedure is the turn's
# job; a question ABOUT a skill's subject is expected-empty.
#
# Caveats to keep honest:
#   * Skills are renamed/retired, so an `expected_skills` entry can go stale. The
#     eval fails loudly (not silently) when an expected skill is not in the
#     active set, so this file roars rather than drifting.
#   * `expected_empty` is the #311 precision control: on these turns the correct
#     answer is that nothing matched, and it is the population where a hint that
#     names a wrong skill costs tokens and misdirects the model.
#   * #711's per-skill should_trigger files are meant to consume these same
#     records: `turn` is the query, `expected_skills` membership is the trigger
#     label, so a per-skill file is a filter over this file, not a second corpus.
#
# Run: .venvs/lloyd/bin/python eval/run_skill_match_eval.py


