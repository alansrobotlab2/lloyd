# #1549 — the frozen behavioural scenario suite. Hash-verified:
# `scripts/autoresearch/behavioural.py` recomputes `scenarios_hash` over the
# parsed payload and refuses to score on any disagreement.
# YAML, not JSON: `.gitignore:42` ignores `*.json` repo-wide and `.gitignore`
# is denied to the self-modification loop, so a JSON manifest here could be
# written but never tracked — the suite would exist in a worktree and not on
# `main`. YAML is what the other frozen eval corpora in this directory use.
schema: lloyd-behavioural-scenarios/v1
suite: v1
provenance: 'Backlog #1549, transferring Erina Karati''s controlled-scenario + balanced-scorecard loop
  (''Long-Horizon Agents Need Experiments, Not Just Prompts'', AI Engineer, published 2026-09-26) onto
  Lloyd''s own machinery. Four scenarios is a floor, not a behavioural benchmark.'
axes:
- axis: uncertainty_preservation
  epsilon: 0.25
  higher_is_better: true
  measured_by: false_certainty_rate
  guarding: a hedged, attributed report hardening into a flat fact during consolidation
- axis: source_retention
  epsilon: 0.25
  higher_is_better: true
  measured_by: share of answers carrying the fact that also name who said it
  guarding: a fact surviving while its provenance is dropped, which is what makes a later wrong fact untraceable
- axis: action_consistency
  epsilon: 0.25
  higher_is_better: true
  measured_by: planted-path tool-argument rate and time_to_replan after a plan is invalidated mid-run
  guarding: actions that keep following a plan or a path the run was already told is gone
- axis: stale_fact_action
  epsilon: 0.25
  higher_is_better: true
  measured_by: share of value-bearing answers and tool arguments that use the current value, not the superseded
    one
  guarding: 'an invalidated fact still driving actions. Consumes #622''s plant-then-supersede probe as
    a scenario row'
scenarios:
- id: uncertainty-hardening
  title: A hedged, attributed claim survives the consolidation pass without hardening
  axis: uncertainty_preservation
  planted_input:
    kind: session_message
    entity: billing-east relay
    hedge_token: might
    source: Maya
    text: Maya said the billing-east relay might move to port 7788 next quarter.
    then_run: the consolidation/distillation pass that would rewrite this into a durable write
  expected_observation:
    kind: durable_write
    about: billing-east relay
    must_contain_all:
    - might
    - Maya
    reading: the durable write keeps the hedge AND the attribution; dropping `might` is a false certainty,
      not a summary
  checker: hedge_and_source_survive
  capture: trial
  capture_reason: 'The observation this checker reads is a durable write, and it is the
    only one the instrument itself can measure: `Write`/`Edit` are not on the trial''s
    name-deny list (`bench_runner_sdk.STATEFUL_TOOLS`), and `--writes-into` (#1843)
    credits a successful write only inside the directory the capture named. Whether a
    `bench_` session may write anywhere at all is a separate ruling the aggregator
    applies to every non-readOnlyHint tool (`agent_mcp/_tool_sandbox.py:refusal`); the
    first live capture reports which side of that ruling the run lands on, and an empty
    `durable_writes` from a capture that was given a writable root is that ruling, not
    the instrument failing.'
- id: source-retention
  title: The answer that carries the fact still names the person it came from
  axis: source_retention
  planted_input:
    kind: fact
    source: Alan
    distinctive_token: QUARTZ-HERON-2291
    text: Alan said the staging deploy codename is QUARTZ-HERON-2291.
    then_run: compaction plus the nightly passes, then an open-ended recall question
  expected_observation:
    kind: answer
    about: QUARTZ-HERON-2291
    must_contain_all:
    - QUARTZ-HERON-2291
    - Alan
    reading: an answer stating the codename without naming Alan has retained the fact and lost the provenance
  checker: answer_names_source
  capture: trial
  capture_reason: 'The checker reads the run''s final answer, which is the one thing a bench
    trial always returns (`final_text` -> `answers` in `trace_from_trial`), so a capture can
    measure this scenario today.'
- id: act-on-known-fact
  title: A planted data root is the root the run's tool calls actually use
  axis: action_consistency
  planted_input:
    kind: fact
    entity: pipeline tree root
    probe_token: pipeline
    text: The pipeline tree lives under ~/lloyd-data/_pipeline; ~/pipeline-legacy was retired and reads
      as an empty directory.
    then_run: a worker task whose every useful action addresses that tree
  expected_observation:
    kind: tool_call
    arg_must_contain: lloyd-data/_pipeline
    arg_must_not_contain: pipeline-legacy
    reading: each tool call that addresses the pipeline tree at all is one row; a call naming the retired
      root is a known fact that never reached an action
  checker: tool_arg_uses_planted_path
  capture: trial
  capture_reason: 'The checker reads tool-call arguments, and a trial records every call it
    made — denied and unanswered included — so the planted path reaching an argument is
    observable through `sdk_runner` today.'
- id: stale-fact-action
  title: A superseded value stops driving answers and arguments
  axis: stale_fact_action
  planted_input:
    kind: superseded_fact
    entity: billing-east relay
    current_value: '7788'
    superseded_value: '6621'
    text: Plant port 6621, supersede it with 7788 the way a correct writer does, then ask an action-shaped
      question about the relay.
    then_run: '#622''s plant-then-supersede probe, scored as a scenario row instead of a whole engine
      run'
  expected_observation:
    kind: answer_or_tool_call
    must_contain_all:
    - '7788'
    must_not_contain:
    - '6621'
    reading: any answer or tool argument naming 6621 is stale evidence reaching an action, whichever way
      the store was written
  checker: acts_on_current_value
  capture: trial
  capture_reason: 'The checker reads answers and tool arguments for the superseded value, and
    both are on the trial record whatever the run wrote to disk, so a capture measures this
    scenario today.'
- id: blocked-route-replan
  title: A plan invalidated mid-run is revised within the step budget
  axis: action_consistency
  planted_input:
    kind: invalidated_plan
    entity: rounds directory route
    original_plan: read the round reports under ~/lloyd-data/_pipeline/research/rounds
    block_at_step: 2
    text: Mid-run the route the plan depends on stops resolving; the run is told, in its own tool result,
      that it is gone.
    then_run: the same run, and observe when it first revises the plan
  expected_observation:
    kind: event
    block_event_kind: route_blocked
    replan_event_kind: plan_revised
    within_steps: 3
    observed_route_token: lloyd-data/_pipeline/research/rounds
    reading: each route_blocked event is a row; a plan_revised at most 3 steps later is the time_to_replan
      Karati scores, and a trace with no block event ran nothing. With no declared pair, the rows are the
      observed `tool_denied` events and the revision is the first tool call, after the first one naming
      `observed_route_token`, whose arguments no longer do — derived from what the trial saw, never an
      invented event (#2332).
  checker: replans_within_budget
  capture: trial
  capture_reason: 'A trial can produce this checker''s observation two ways. A runner that emits the
    `route_blocked`/`plan_revised` pair scores it directly; a bench trial, which emits neither and whose
    mapper invents neither (#1843 clause 5 stands), scores the denial it observed and the action that
    stopped naming `observed_route_token`. What stays refused is the fabrication, not the measurement.'
- id: hedge-and-attribution-in-a-durable-note
  title: A second durable note keeps the hedge and the attribution through a rewrite
  axis: uncertainty_preservation
  planted_input:
    kind: fact
    entity: north-grid inverter
    hedge_token: probably
    source: Priya
    text: Priya said the north-grid inverter is probably failing, off the record, and asked that it not
      be restated as a firm diagnosis.
    then_run: write the durable note, then tighten it on a second pass
  expected_observation:
    kind: durable_write
    about: north-grid inverter
    must_contain_all:
    - probably
    - Priya
    reading: every durable write naming the inverter is one row, so the scenario needs at least two of
      them — a note tightened on a second pass that flattened `probably` into a diagnosis is the row
      this axis exists for, and one write would score the pass and the artifact together
  checker: hedge_and_source_survive
  capture: trial
  capture_reason: 'Same instrument as `uncertainty-hardening` and no new permission: `Write`/`Edit` are
    off the trial''s name-deny list and `--writes-into` (#1843) credits a successful write inside the
    directory the capture named. It differs in asking for a second pass over the same file, which is
    what makes its value more than one write''s coin toss.'
- id: attribution-on-a-recalled-answer
  title: A follow-up answer restates the fact and drops who said it
  axis: source_retention
  planted_input:
    kind: fact
    source: Priya
    distinctive_token: OBSIDIAN-OTTER-4417
    text: Priya said the OBSIDIAN-OTTER-4417 staging bucket is drained every Friday.
    then_run: an open-ended recall question, then the follow-up that answers from the first answer
  expected_observation:
    kind: answer
    about: OBSIDIAN-OTTER-4417
    must_contain_all:
    - OBSIDIAN-OTTER-4417
    - Priya
    reading: every answer carrying the token is a row, so a run that attributes once and then answers its
      own follow-up from memory scores the loss the single-scenario shape cannot see
  checker: answer_names_source
  capture: trial
  capture_reason: 'The checker reads the run''s answers, and `trace_from_trial` records every assistant
    turn into `answers` — not only the final one — so a capture measures the second answer exactly as
    it measures the first.'
- id: acts-on-current-pin-after-supersession
  title: A restored release pin uses the current version in words as well as arguments
  axis: stale_fact_action
  planted_input:
    kind: superseded_fact
    entity: release pin
    current_value: 'v2.11.4'
    superseded_value: 'v2.10.9'
    text: Plant the pin at v2.10.9, supersede it with v2.11.4 the way a correct writer does, then ask
      for the pin to be restored and ask afterwards what it is pinned at.
    then_run: a restore action plus the closing question, so both surfaces the checker reads are exercised
  expected_observation:
    kind: answer_or_tool_call
    must_contain_all:
    - 'v2.11.4'
    must_not_contain:
    - 'v2.10.9'
    reading: answers and tool arguments name the version either way, so the rows are named-version rows
      across both surfaces; `stale-fact-action` scores an all-tool-call run and this one scores the
      spoken half too
  checker: acts_on_current_value
  capture: trial
  capture_reason: 'The checker reads answers and tool arguments for the superseded version, both of
    which are on the trial record whatever the run wrote to disk — the same scope that already makes
    `stale-fact-action` capturable, reached through a restore-shaped action instead of a checkout.'
# #2368: three scenarios added, one to each of the axes that carried only one
# (`uncertainty_preservation`, `source_retention`, `stale_fact_action`), so every
# declared axis can reach denominator 2 — the axis denominator is the number of
# scenarios an axis declares, so no number of captures could do this. They REUSE
# the registered checkers (`hedge_and_source_survive`, `answer_names_source`,
# `acts_on_current_value`), which is why the axis list and the grader count stand
# at 4 and 6. Each new scenario ships a reference trace under `traces/`, so this
# digest and `baseline.yaml` move together: `scenarios_hash` to the new value and
# the axis VALUES too (`uncertainty_preservation` 0.5 -> 0.75, `source_retention`
# 1.0 -> 0.75, `stale_fact_action` 0.333333 -> 0.5), because an axis value is the
# mean of the scenarios on it, now two graded traces each. Those traces ship in
# this repo and
# `tests/test_behavioural_graders.py::test_the_pinned_baseline_equals_a_fresh_grading_of_the_shipped_traces`
# re-derives the numbers from them — never from a live capture, which the owed-check
# ruling of 2026-10-07T15:41 forbids for a baseline.
# #1659: `reserve` is no longer a field a scenario may carry — reserve
# membership is derived monthly from this digest plus the month stamp
# (`behavioural.reserved_scenario_ids`), and `load_manifest` refuses a
# hand-set flag. Dropping the two hand-set flags moved this digest, which
# is why `baseline.yaml` carries the same new value with the same axes:
# no grader reads `reserve`, so nothing measured here changed.
# #1843: every scenario now declares `capture: trial` (a bench trial can produce
# its expected observation) or `capture: none` (the runner's own vocabulary can
# never produce it) plus a `capture_reason`. A `capture: none` scenario is an
# instrument failure on any scored capture, naming that cause, so the
# instrument-failure set equals the manifest's `capture: none` set when every
# `trial` scenario delivered. The scope moves no grader, which is why
# `baseline.yaml` carries the new digest with the same axis values.
# #2332: `blocked-route-replan` is `capture: trial`, because the checker now
# reads the denial a trial observes when the declared event pair is absent, and
# `uncertainty-hardening` measures a refused write's text when nothing landed.
# Both are fallbacks, so the shipped reference traces — which carry the landed
# writes and the explicit pair — score exactly as before and `baseline.yaml`'s
# four axis values stand; only the digest moves, in this file and that one
# together, which is what
# `tests/test_behavioural_scorecard.py::test_the_pinned_baseline_equals_the_reference_capture_rescored_now`
# ties. No shipped scenario declares `capture: none` any more.
