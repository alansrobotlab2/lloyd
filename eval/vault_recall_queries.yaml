# Evaluation set for vault_recall / vault_search.
#
# Purpose: baseline current retrieval, then re-run after any Phase 3
# (graph-vote re-ranking) change to measure impact.
#
# Schema:
#   id: short slug
#   query: the user-facing query string (verbatim, as if typed/spoken)
#   category: query class (single, multi-hop, recent, technical, fuzzy, hard)
#   expect_entities: entities that SHOULD appear in returned facts/graph_neighbors
#     (case-insensitive substring match against entity dir names)
#   expect_docs: substrings any of which should appear in returned document paths
#     (relative to ~/obsidian/) — at least one match counts as a hit
#   notes: why this query is in the set, especially for hard/known-fail cases
#
# Scoring (simple, per-query):
#   entity_hit:   any expected entity appears in result.facts entities or graph_neighbors
#   doc_hit:      any expected doc substring appears in result.documents paths
#   topk_overlap: fraction of expect_entities that appear in top-K facts/neighbors
#
# 2026-08-06 (#380 Phase 0b) — expectation audit.
#   9 of 46 expect_entities were UNSATISFIABLE: no entity directory contained
#   the string, so no retrieval improvement could ever score them. They were
#   silently capping ent_recall / fER and masking graph changes.
#
#   Rule applied: only remove an expectation that is factually wrong, and only
#   replace it with the entity that is genuinely the correct answer — never
#   substitute an easier target to inflate the score. Each change is annotated
#   inline. Two changes make a query HARDER (FACT_GODNODE_THRESHOLD,
#   Agent Harness); one is a genuine WEAKENING and is flagged as such
#   (nightly-reflection).
#
# 2026-09-21 (#1319) — GOLD-SET GROWTH 20 → 87 QUERIES. THIS IS THE RE-BASE POINT.
#   At n=20 the trend audit's own exact-McNemar power search measured the power to
#   detect a 0.10 paired change at 0.011, so the nightly could not see the shift it
#   exists to see; 78 is what 0.10 at 80 % power (alpha 0.05) requires. Approved by
#   Alan on 2026-09-20 as the discharge of #608's third human_clause.
#   DO NOT COMPARE ABSOLUTE VALUES ACROSS THIS POINT. Every rate the
#   2026-09-04 → 2026-09-17 series carries (entity_hit_rate, doc_recall_avg, ndcg10)
#   is a mean over 20 questions; the 87-query mean is over different questions, not
#   the same questions rescored. The paired tests in scripts/eval_trend_stats.py
#   join on ids present in both nights, so the old series stays joinable on the
#   original 20, whose `query` text is byte-identical — pinned by
#   tests/test_eval_corpus_guard.py::test_the_gold_set_is_big_enough_for_its_own_power_claim
#   — while their `expect_*` labels were re-pointed wherever they named nothing.
#   Category mix before → after: single 5→20, multi-hop 5→19, technical 3→14,
#   hard 3→12, recent 2→11, fuzzy 2→11. Whether that mix is representative of real
#   use is a person's call and is carried as needs-human on #1319.
#   The 67 new labels were authored from the vault and the entity table, and each
#   was written before any recall run on its query: a gold label read off what the
#   retriever currently returns manufactures the passing eval this growth exists to
#   prevent, which is why the spot-check is owed by a person and not by this file.

queries:
  # --- Single-entity lookups (basic retrieval) ---
  - id: backlog-363
    query: "tell me about backlog item 363"
    category: single
    # ENTITY-NAME satisfiability is what this comment is about, not vault paths and
    # not where the answer file lives. 2026-08-06 retargeted "Backlog Item 363" →
    # "Backlog Item #363" on the grounds that the name was a real DIR NAME. It is a
    # real fact-tree dir and NOT a real entity name — no entity row contains that
    # string — so the retarget moved the query from one unsatisfiable expectation to
    # another, and the query kept scoring a retrieval failure no retrieval change
    # could clear. `entity_hit` was false and `entity_recall` capped at 0.5 forever;
    # the movement got read as a seed-identification defect (#400, #513, #878).
    # 2026-09-20 (#878): re-pointed at rows the entity table holds for item 363.
    # `Task #363` was already reachable and is KEPT — dropping it would be exactly
    # the easier-target substitution the audit rule at the top of this file forbids.
    # `#363 TGS-RAG Implementation` replaces the dead name: item 363 IS the TGS-RAG
    # implementation task, so it is the correct second hop rather than a softer one.
    # Neither string contains the other, so no single returned entity can satisfy
    # both — the query got harder, not easier. The doc leg keeps expecting the vault
    # path, which is right there: `expect_docs` matches paths, not entity names.
    # `tests/test_eval_corpus_guard.py` now fails CI when any expectation in this
    # file is contained in no entity name, so re-breaking it is a red test rather
    # than a nightly number that quietly reads as a retrieval regression.
    expect_entities: ["Task #363", "#363 TGS-RAG Implementation"]
    # expect_docs re-pointed 2026-09-21 (#1319): the old labels (a code path, or an entity name handed to a path matcher) matched no
    # path under ~/obsidian, so the query could never reach full doc recall. New labels are vault paths, chosen from the
    # live vault listing, that a correct answer to THIS query would cite.
    expect_docs: ['backlog/363-implement-tgs-rag-visited-memory-orphan-entity-bri.md', 'knowledge/ai/tgs-rag-bidirectional-text-graph-synergy.md']

