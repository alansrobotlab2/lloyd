  # being the model that runs; primary is Qwen3.8-Flash-Next.
  # The replacement keeps the shape that made the original valuable — multi-hop,
  # a concept resolving to the several notes that cover it — and points at
  # documents the vault genuinely owns. The expected docs were chosen by
  # reading them, deliberately NOT by checking what the retriever already
  # returns: picking targets it already hits would raise the score by moving
  # the goalpost, which is the eval scoring itself rather than the retriever.
  # Phrased conceptually, without echoing the target filenames. The first
  # draft asked "what do we know about running Qwen3.8-Flash-Next locally?"
  # and scored ndcg10 0.947 with first_doc_rank 1 — the expected file names
  # contain the query's own words, so it tested lexical matching rather than
  # the concept-to-instances hop the original was there to exercise. The
  # expected documents are unchanged; only the question is.
  - id: qwen38-local-serving
    query: "how do we serve a hybrid linear-attention model on a single 24GB GPU?"
    category: multi-hop
    # 2026-09-20 (#878): `Qwen3.8-27B` names no entity and is contained in no
    # entity name — the store writes this model with spaces (`Qwen 3.8 27B`) and
    # `_norm` folds only case and `-`/`_`, never spaces, so `qwen3_8_27b` matches
    # nothing and the query scored a permanent entity-leg failure beside a healthy
    # doc leg. Third dead name in this file and the one the 2026-09-11 item could
    # not see; the corpus-wide guard now catches it, which is the guard earning its
    # keep on day one rather than only on the name it was written for. Re-pointed at
    # `Qwen 3.8 27B`, the same model, spelled the way the entity table spells it —
    # the correct answer to the question, not an easier one. `Qwen3.8-Flash-Next` is
    # reachable and stays.
    expect_entities: ["Qwen3.8-Flash-Next", "Qwen 3.8 27B"]
    expect_docs: ["hybrid-gdn-qsa-inference-serving", "qwen38-27b-local-24gb",
                  "qwen38-flash-next-engram"]

  # --- Recent / project-status (recency-biased — historically hard for semantic search) ---
  - id: tgs-rag-state
    query: "what's the current state of TGS-RAG research?"
    category: recent
    # 2026-08-06: both were unsatisfiable, leaving no scorable entity target.
    # → "real dirs" "Backlog Item #363" and "TGS-RAG Implementation" — a claim
    # about DIRECTORY names, which is not what an `expect_entities` entry has to
    # satisfy. ENTITY-NAME satisfiability is the subject of this comment, and the
    # two names went two different ways: neither is an entity row, but `_score`
    # matches an expectation as a substring of a returned name, so
    # `TGS-RAG Implementation` is reached through the row `#363 TGS-RAG
    # Implementation` and stayed satisfiable, while `Backlog Item #363` is contained
    # in no entity name at all (`Backlog Task #363`, `Issue #363`, `Task #363` are
    # the nearest rows and none CONTAINS it). So this query — the one #513 was filed
    # to fix — still carried an unreachable target, and still reported
    # `entity_hit: false` / `entity_recall: 0.0` against `doc_hit: true` /
    # `rr_doc: 1.0`: retrieval worked, the target could not be hit.
    # 2026-09-20 (#878): only the unreachable name moves, to
    # `Task #363 (TGS-RAG Multi-Hop Reasoning)` — the entity that holds this
    # project's implementation status. `TGS-RAG Implementation` was kept then, as a
    # containment-reachable target. 2026-09-20 (#1260): it moves too, to `TGS-RAG`,
    # and the reason is the sentence above this one — the scorer's containment route
    # is now an explicit, separately-pinned property of the guard rather than a
    # side-effect of the matcher, so keeping a name that is no entity row buys
    # nothing and costs the clause-3 property ("every expect_entities string resolves
    # to an entity the store can return"). `TGS-RAG` is a real row and the row
    # `#363 TGS-RAG Implementation` carries the alias surface `tgs-rag implementation`
    # pointing at it, so the same retrieval still satisfies the gold.
    # `Conversation Relation Linking` and `Data Pipeline`, by contrast, ARE real
    # directories and stay: a miss on those is a retrieval gap, not a corpus defect.
    # Re-breaking this is now a CI red, not a nightly number that reads as a retrieval
    # regression (`tests/test_eval_corpus_guard.py`,
    # `tests/test_retrieval_seed_anchoring.py::test_every_gold_entity_name_resolves_to_an_entity_the_store_can_return`).
    expect_entities: ["Task #363 (TGS-RAG Multi-Hop Reasoning)", "TGS-RAG"]
    expect_docs: ["tgs-rag", "neuro-symbolic-rag", "363-implement-tgs-rag"]

