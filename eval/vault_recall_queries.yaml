# Evaluation set for vault_recall / vault_search.
#
# Purpose: baseline current retrieval, then re-run after any Phase 3
# (graph-vote re-ranking) change to measure impact.
#
# Schema:
#   id: short slug
#   query: the user-facing query string (verbatim, as if typed/spoken)
#   category: query class (single, multi-hop, recent, technical, fuzzy, hard)
#   expect_entities: entities that SHOULD appear in returned facts/graph_neighbors
#     (case-insensitive substring match against entity dir names)
#   expect_docs: substrings any of which should appear in returned document paths
#     (relative to ~/obsidian/) — at least one match counts as a hit
#   notes: why this query is in the set, especially for hard/known-fail cases
#
# Scoring (simple, per-query):
#   entity_hit:   any expected entity appears in result.facts entities or graph_neighbors
#   doc_hit:      any expected doc substring appears in result.documents paths
#   topk_overlap: fraction of expect_entities that appear in top-K facts/neighbors
#
# 2026-08-06 (#380 Phase 0b) — expectation audit.
#   9 of 46 expect_entities were UNSATISFIABLE: no entity directory contained
#   the string, so no retrieval improvement could ever score them. They were
#   silently capping ent_recall / fER and masking graph changes.
#
#   Rule applied: only remove an expectation that is factually wrong, and only
#   replace it with the entity that is genuinely the correct answer — never
#   substitute an easier target to inflate the score. Each change is annotated
#   inline. Two changes make a query HARDER (FACT_GODNODE_THRESHOLD,
#   Agent Harness); one is a genuine WEAKENING and is flagged as such
#   (nightly-reflection).

queries:
  # --- Single-entity lookups (basic retrieval) ---
  - id: backlog-363
    query: "tell me about backlog item 363"
    category: single
    # 2026-08-06: "Backlog Item 363" → "Backlog Item #363" (real dir; the
    # expectation was missing the '#' and could never match).
    expect_entities: ["Backlog Item #363", "Task #363"]
    expect_docs: ["backlog/363-implement-tgs-rag", "Backlog Item 363"]

  - id: entity-resolution-sweep
    query: "what does the entity resolution sweep skill do?"
    category: single
    expect_entities: ["Entity Resolution Sweep"]
    expect_docs: ["skills/entity-resolution-sweep", "autonomy/48-entity-resolution"]

  - id: inner-voice
    query: "explain the inner voice architecture"
    category: single
    # 2026-08-06: dropped "Inner Voice (Task #345)" — no such dir; the
    # parenthetical variant was redundant with the satisfiable "Inner Voice".
    expect_entities: ["Inner Voice"]
    expect_docs: ["lloyd/inner_voice", "inner_voice"]

  - id: vault-recall
    query: "what is vault_recall and how does it work?"
    category: single
    expect_entities: ["vault_recall"]
    expect_docs: ["agent_mcp/vault.py", "vault_recall"]

  - id: qmd
    query: "what is QMD?"
    category: single
    expect_entities: ["qmd", "QMD"]
    expect_docs: ["qmd"]

  # --- Multi-hop / cross-entity (where graph-vote should help most) ---
  - id: kg-maintenance-tasks
    query: "which autonomy tasks maintain the knowledge graph?"
    category: multi-hop
    expect_entities: ["Entity Resolution Sweep", "Conversation Relation Linking", "KG Mention Classifier", "Semantic Entity Resolution", "Data Pipeline"]
    expect_docs: ["autonomy/48-", "autonomy/51-", "autonomy/67-", "autonomy/74-", "autonomy/24-"]
    notes: "Should surface ≥3 of the 5 KG-chain tasks. Pure semantic search may miss some."

  - id: lloyd-vllm-rel
    query: "how does Lloyd use vLLM?"
    category: multi-hop
    expect_entities: ["lloyd", "vLLM"]
    expect_docs: ["vllm", "harness", "config.yaml"]

  - id: harness-tools
    query: "how does the agent harness dispatch tool calls?"
    category: multi-hop
    # 2026-08-06: "app/harness" → "Agent Harness". The old value is a code
    # path, which looks_like_junk_entity() deliberately refuses to create —
    # the eval was requiring an entity the system is designed never to make.
    # "Agent Harness" is the real entity and a stricter target than "lloyd".
    expect_entities: ["Agent Harness", "lloyd"]
    expect_docs: ["app/harness/loop.py", "app/harness/tool_schema.py", "harness"]

  - id: nightly-reflection
    query: "what skills are involved in nightly reflection?"
    category: multi-hop
    # 2026-08-06: BOTH original expectations were unsatisfiable (no such dirs),
    # leaving this query with no scorable entity target at all. Replaced with
    # the general concept, which many real dirs satisfy
    # ("Nightly Reflection Process/Cluster/Cron/...").
    # ⚠️ THIS IS A GENUINE WEAKENING — the original named two specific skills;
    # the replacement only tests that *some* nightly-reflection entity surfaces.
    # Restore specific skill names if/when those entities actually exist.
    expect_entities: ["Nightly Reflection"]
    expect_docs: ["autonomy/39-", "autonomy/42-", "nightly-reflection"]

  - id: qwen35-users
    query: "what runs on Qwen3.5?"
    category: multi-hop
    expect_entities: ["Qwen3.5", "Qwen3.5-122B", "primary"]
    expect_docs: ["start-llm-122b", "Qwen3.5", "config.yaml"]

  # --- Recent / project-status (recency-biased — historically hard for semantic search) ---
  - id: tgs-rag-state
    query: "what's the current state of TGS-RAG research?"
    category: recent
    # 2026-08-06: both were unsatisfiable, leaving no scorable entity target.
    # → real dirs "Backlog Item #363" and "TGS-RAG Implementation".
    expect_entities: ["Backlog Item #363", "TGS-RAG Implementation"]
    expect_docs: ["tgs-rag", "neuro-symbolic-rag", "363-implement-tgs-rag"]

  - id: graph-quality
    query: "what's the noise floor in our relationship graph?"
    category: recent
    expect_entities: ["KG Mention Classifier", "Knowledge Graph"]
    expect_docs: ["kg-mention-classifier", "knowledge-health"]
    notes: "Touches the mention-noise problem we discussed today."

  # --- Specific technical detail ---
  - id: classifier-v4
    query: "how does the v4 mention classifier decide what to upgrade?"
    category: technical
    expect_entities: ["KG Mention Classifier", "Knowledge Graph v4 Classifier"]
    expect_docs: ["classify-relationships-v4", "kg-mention-classifier"]

  - id: godnode-threshold
    query: "what's the FACT_GODNODE_THRESHOLD and why does it exist?"
    category: technical
    # 2026-08-06: "facts.py" → "FACT_GODNODE_THRESHOLD". The old value is a
    # code path the junk guard correctly rejects; the new one is the actual
    # subject of the question and a STRICTER, more precise target.
    expect_entities: ["FACT_GODNODE_THRESHOLD", "Knowledge Graph"]
    expect_docs: ["agent_mcp/facts.py", "fact_graph"]
    notes: "Niche technical detail — tests whether retrieval finds source code references."

  - id: relationships-location
    query: "where is the relationships index stored?"
    category: technical
    expect_entities: ["Knowledge Graph"]
    expect_docs: ["facts.py", "vault-derived/facts", "_relationships"]

  # --- Conceptual / fuzzy ---
  - id: memory-persistence
    query: "how does Lloyd remember things across sessions?"
    category: fuzzy
    expect_entities: ["Memory Capture", "MEMORY.md", "Knowledge Graph"]
    expect_docs: ["memory", "MEMORY.md", "autonomy/25-"]

  - id: autonomy-pipeline
    query: "describe the autonomy pipeline end to end"
    category: fuzzy
    expect_entities: ["Autonomy Data Pipeline", "Data Pipeline", "Conversation Relation Linking"]
    expect_docs: ["autonomy/24-", "autonomy-data-pipeline", "autonomy.py"]

  # --- Known-difficult / cross-domain ---
  - id: robotics-projects
    query: "what robotics projects have I worked on?"
    category: hard
    # 2026-08-06: "3D-Printing-Robotics Project" → "3D Printing" (no dir for
    # the compound project name; "3D Printing" is the real entity).
    expect_entities: ["GR00T", "Isaac GR00T N1.7", "1X Neo", "Six-Servo Robot Dog", "3D Printing"]
    expect_docs: ["GR00T", "robot", "robotics"]
    notes: "Cross-domain. Many candidates, semantic search may favor only the most-mentioned."

  - id: this-week-autonomy
    query: "what changed in the autonomy system this week?"
    category: hard
    expect_entities: ["Autonomy Data Pipeline", "KG Mention Classifier", "Entity Resolution Sweep"]
    expect_docs: ["autonomy/", "kg-pipeline"]
    notes: "Recency-biased; semantic similarity alone tends to miss 'this week' framing."

  - id: backlog-overview
    query: "anything interesting in the backlog we should tackle?"
    category: hard
    expect_entities: ["Backlog System"]
    expect_docs: ["backlog/"]
    notes: "Open-ended; current vault_recall probably returns weak results. Useful baseline."
