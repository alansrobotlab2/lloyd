    # ("Nightly Reflection Process/Cluster/Cron/...").
    # ⚠️ THIS IS A GENUINE WEAKENING — the original named two specific skills;
    # the replacement only tests that *some* nightly-reflection entity surfaces.
    # Restore specific skill names if/when those entities actually exist.
    # 2026-09-20 (#1260): the surviving replacement is re-pointed at the entity
