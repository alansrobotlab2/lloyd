# Evaluation set for vault_recall / vault_search.
#
# Purpose: baseline current retrieval, then re-run after any Phase 3
# (graph-vote re-ranking) change to measure impact.
#
# Schema:
#   id: short slug
#   query: the user-facing query string (verbatim, as if typed/spoken)
#   category: query class (single, multi-hop, recent, technical, fuzzy, hard)
#   expect_entities: entities that SHOULD appear in returned facts/graph_neighbors
#     (case-insensitive substring match against entity dir names)
#   expect_docs: substrings any of which should appear in returned document paths
#     (relative to ~/obsidian/) — at least one match counts as a hit
#   notes: why this query is in the set, especially for hard/known-fail cases
#
# Scoring (simple, per-query):
#   entity_hit:   any expected entity appears in result.facts entities or graph_neighbors
#   doc_hit:      any expected doc substring appears in result.documents paths
#   topk_overlap: fraction of expect_entities that appear in top-K facts/neighbors
#
# 2026-08-06 (#380 Phase 0b) — expectation audit.
#   9 of 46 expect_entities were UNSATISFIABLE: no entity directory contained
#   the string, so no retrieval improvement could ever score them. They were
#   silently capping ent_recall / fER and masking graph changes.
#
#   Rule applied: only remove an expectation that is factually wrong, and only
#   replace it with the entity that is genuinely the correct answer — never
#   substitute an easier target to inflate the score. Each change is annotated
#   inline. Two changes make a query HARDER (FACT_GODNODE_THRESHOLD,
#   Agent Harness); one is a genuine WEAKENING and is flagged as such
#   (nightly-reflection).

queries:
  # --- Single-entity lookups (basic retrieval) ---
  - id: backlog-363
    query: "tell me about backlog item 363"
    category: single
    # ENTITY-NAME satisfiability is what this comment is about, not vault paths and
    # not where the answer file lives. 2026-08-06 retargeted "Backlog Item 363" →
    # "Backlog Item #363" on the grounds that the name was a real DIR NAME. It is a
    # real fact-tree dir and NOT a real entity name — no entity row contains that
    # string — so the retarget moved the query from one unsatisfiable expectation to
    # another, and the query kept scoring a retrieval failure no retrieval change
    # could clear. `entity_hit` was false and `entity_recall` capped at 0.5 forever;
    # the movement got read as a seed-identification defect (#400, #513, #878).
    # 2026-09-20 (#878): re-pointed at rows the entity table holds for item 363.
    # `Task #363` was already reachable and is KEPT — dropping it would be exactly
    # the easier-target substitution the audit rule at the top of this file forbids.
    # `#363 TGS-RAG Implementation` replaces the dead name: item 363 IS the TGS-RAG
    # implementation task, so it is the correct second hop rather than a softer one.
    # Neither string contains the other, so no single returned entity can satisfy
    # both — the query got harder, not easier. The doc leg keeps expecting the vault
    # path, which is right there: `expect_docs` matches paths, not entity names.
    # `tests/test_eval_corpus_guard.py` now fails CI when any expectation in this
    # file is contained in no entity name, so re-breaking it is a red test rather
    # than a nightly number that quietly reads as a retrieval regression.
    expect_entities: ["Task #363", "#363 TGS-RAG Implementation"]
    expect_docs: ["backlog/363-implement-tgs-rag", "Backlog Item 363"]

  - id: entity-resolution-sweep
    query: "what does the entity resolution sweep skill do?"
    category: single
    expect_entities: ["Entity Resolution Sweep"]
    expect_docs: ["skills/entity-resolution-sweep", "autonomy/48-entity-resolution"]

  - id: inner-voice
    query: "explain the inner voice architecture"
    category: single
    # 2026-08-06: dropped "Inner Voice (Task #345)" — no such dir; the
    # parenthetical variant was redundant with the satisfiable "Inner Voice".
    expect_entities: ["Inner Voice"]
    expect_docs: ["lloyd/inner_voice", "inner_voice"]

  - id: vault-recall
    query: "what is vault_recall and how does it work?"
    category: single
    expect_entities: ["vault_recall"]
    expect_docs: ["agent_mcp/vault.py", "vault_recall"]

  - id: qmd
    query: "what is QMD?"
    category: single
    expect_entities: ["qmd", "QMD"]
    expect_docs: ["qmd"]

  # --- Multi-hop / cross-entity (where graph-vote should help most) ---
  - id: kg-maintenance-tasks
    query: "which autonomy tasks maintain the knowledge graph?"
    category: multi-hop
    expect_entities: ["Entity Resolution Sweep", "Conversation Relation Linking", "KG Mention Classifier", "Semantic Entity Resolution", "Data Pipeline"]
    expect_docs: ["autonomy/48-", "autonomy/51-", "autonomy/67-", "autonomy/74-", "autonomy/24-"]
    notes: "Should surface ≥3 of the 5 KG-chain tasks. Pure semantic search may miss some."

  - id: lloyd-vllm-rel
    query: "how does Lloyd use vLLM?"
    category: multi-hop
    expect_entities: ["lloyd", "vLLM"]
    expect_docs: ["vllm", "harness", "config.yaml"]

  - id: harness-tools
    query: "how does the agent harness dispatch tool calls?"
    category: multi-hop
    # 2026-08-06: "app/harness" → "Agent Harness". The old value is a code
    # path, which looks_like_junk_entity() deliberately refuses to create —
    # the eval was requiring an entity the system is designed never to make.
    # "Agent Harness" is the real entity and a stricter target than "lloyd".
    expect_entities: ["Agent Harness", "lloyd"]
    expect_docs: ["app/harness/loop.py", "app/harness/tool_schema.py", "harness"]

  - id: nightly-reflection
    query: "what skills are involved in nightly reflection?"
    category: multi-hop
    # 2026-08-06: BOTH original expectations were unsatisfiable (no such dirs),
    # leaving this query with no scorable entity target at all. Replaced with
    # the general concept, which many real dirs satisfy
    # ("Nightly Reflection Process/Cluster/Cron/...").
    # ⚠️ THIS IS A GENUINE WEAKENING — the original named two specific skills;
    # the replacement only tests that *some* nightly-reflection entity surfaces.
    # Restore specific skill names if/when those entities actually exist.
    # 2026-09-20 (#1260): the surviving replacement is re-pointed at the entity
    # itself, `Nightly Reflection Pipeline`. `Nightly Reflection` is a real
    # directory but the store resolves it to `Nightly Reflection Pipeline` — it is
    # an ALIAS row, not the canonical — so the scorer was asked to look for a name
    # retrieval does not return. Same question, target spelled the way the store
    # spells it; the weakening note above is about the generality of the target, and
    # generality is unchanged: one entity either surfaces or does not.
    expect_entities: ["Nightly Reflection Pipeline"]
    expect_docs: ["autonomy/39-", "autonomy/42-", "nightly-reflection"]

  # 2026-09-07: retargeted, and the id changed with the question.
  # It was `qwen35-users`: "what runs on Qwen3.5?", expecting `start-llm-122b`
  # and `config.yaml`. Both live in ~/lloyd, and qmd indexes ~/obsidian only,
  # so no amount of retrieval quality could ever satisfy it — a permanent zero
  # dragging mrr_doc, ndcg10 and doc_hit_rate down. Qwen3.5 had also stopped
  # being the model that runs; primary is Qwen3.8-Flash-Next.
  # The replacement keeps the shape that made the original valuable — multi-hop,
  # a concept resolving to the several notes that cover it — and points at
  # documents the vault genuinely owns. The expected docs were chosen by
  # reading them, deliberately NOT by checking what the retriever already
  # returns: picking targets it already hits would raise the score by moving
  # the goalpost, which is the eval scoring itself rather than the retriever.
  # Phrased conceptually, without echoing the target filenames. The first
  # draft asked "what do we know about running Qwen3.8-Flash-Next locally?"
  # and scored ndcg10 0.947 with first_doc_rank 1 — the expected file names
  # contain the query's own words, so it tested lexical matching rather than
  # the concept-to-instances hop the original was there to exercise. The
  # expected documents are unchanged; only the question is.
  - id: qwen38-local-serving
    query: "how do we serve a hybrid linear-attention model on a single 24GB GPU?"
    category: multi-hop
    # 2026-09-20 (#878): `Qwen3.8-27B` names no entity and is contained in no
    # entity name — the store writes this model with spaces (`Qwen 3.8 27B`) and
    # `_norm` folds only case and `-`/`_`, never spaces, so `qwen3_8_27b` matches
    # nothing and the query scored a permanent entity-leg failure beside a healthy
    # doc leg. Third dead name in this file and the one the 2026-09-11 item could
    # not see; the corpus-wide guard now catches it, which is the guard earning its
    # keep on day one rather than only on the name it was written for. Re-pointed at
    # `Qwen 3.8 27B`, the same model, spelled the way the entity table spells it —
    # the correct answer to the question, not an easier one. `Qwen3.8-Flash-Next` is
    # reachable and stays.
    expect_entities: ["Qwen3.8-Flash-Next", "Qwen 3.8 27B"]
    expect_docs: ["hybrid-gdn-qsa-inference-serving", "qwen38-27b-local-24gb",
                  "qwen38-flash-next-engram"]

  # --- Recent / project-status (recency-biased — historically hard for semantic search) ---
  - id: tgs-rag-state
    query: "what's the current state of TGS-RAG research?"
    category: recent
    # 2026-08-06: both were unsatisfiable, leaving no scorable entity target.
    # → "real dirs" "Backlog Item #363" and "TGS-RAG Implementation" — a claim
    # about DIRECTORY names, which is not what an `expect_entities` entry has to
    # satisfy. ENTITY-NAME satisfiability is the subject of this comment, and the
    # two names went two different ways: neither is an entity row, but `_score`
    # matches an expectation as a substring of a returned name, so
    # `TGS-RAG Implementation` is reached through the row `#363 TGS-RAG
    # Implementation` and stayed satisfiable, while `Backlog Item #363` is contained
    # in no entity name at all (`Backlog Task #363`, `Issue #363`, `Task #363` are
    # the nearest rows and none CONTAINS it). So this query — the one #513 was filed
    # to fix — still carried an unreachable target, and still reported
    # `entity_hit: false` / `entity_recall: 0.0` against `doc_hit: true` /
    # `rr_doc: 1.0`: retrieval worked, the target could not be hit.
    # 2026-09-20 (#878): only the unreachable name moves, to
    # `Task #363 (TGS-RAG Multi-Hop Reasoning)` — the entity that holds this
    # project's implementation status. `TGS-RAG Implementation` was kept then, as a
    # containment-reachable target. 2026-09-20 (#1260): it moves too, to `TGS-RAG`,
    # and the reason is the sentence above this one — the scorer's containment route
    # is now an explicit, separately-pinned property of the guard rather than a
    # side-effect of the matcher, so keeping a name that is no entity row buys
    # nothing and costs the clause-3 property ("every expect_entities string resolves
    # to an entity the store can return"). `TGS-RAG` is a real row and the row
    # `#363 TGS-RAG Implementation` carries the alias surface `tgs-rag implementation`
    # pointing at it, so the same retrieval still satisfies the gold.
    # `Conversation Relation Linking` and `Data Pipeline`, by contrast, ARE real
    # directories and stay: a miss on those is a retrieval gap, not a corpus defect.
    # Re-breaking this is now a CI red, not a nightly number that reads as a retrieval
    # regression (`tests/test_eval_corpus_guard.py`,
    # `tests/test_retrieval_seed_anchoring.py::test_every_gold_entity_name_resolves_to_an_entity_the_store_can_return`).
    expect_entities: ["Task #363 (TGS-RAG Multi-Hop Reasoning)", "TGS-RAG"]
    expect_docs: ["tgs-rag", "neuro-symbolic-rag", "363-implement-tgs-rag"]

  - id: graph-quality
    query: "what's the noise floor in our relationship graph?"
    category: recent
    expect_entities: ["KG Mention Classifier", "Knowledge Graph"]
    expect_docs: ["kg-mention-classifier", "knowledge-health"]
    notes: "Touches the mention-noise problem we discussed today."

  # --- Specific technical detail ---
  - id: classifier-v4
    query: "how does the v4 mention classifier decide what to upgrade?"
    category: technical
    expect_entities: ["KG Mention Classifier", "Knowledge Graph v4 Classifier"]
    expect_docs: ["classify-relationships-v4", "kg-mention-classifier"]

  - id: godnode-threshold
    query: "what's the FACT_GODNODE_THRESHOLD and why does it exist?"
    category: technical
    # 2026-08-06: "facts.py" → "FACT_GODNODE_THRESHOLD". The old value is a
    # code path the junk guard correctly rejects; the new one is the actual
    # subject of the question and a STRICTER, more precise target.
    expect_entities: ["FACT_GODNODE_THRESHOLD", "Knowledge Graph"]
    expect_docs: ["agent_mcp/facts.py", "fact_graph"]
    notes: "Niche technical detail — tests whether retrieval finds source code references."

  - id: relationships-location
    query: "where is the relationships index stored?"
    category: technical
    expect_entities: ["Knowledge Graph"]
    expect_docs: ["facts.py", "vault-derived/facts", "_relationships"]

  # --- Conceptual / fuzzy ---
  - id: memory-persistence
    query: "how does Lloyd remember things across sessions?"
    category: fuzzy
    expect_entities: ["Memory Capture", "MEMORY.md", "Knowledge Graph"]
    expect_docs: ["memory", "MEMORY.md", "autonomy/25-"]

  - id: autonomy-pipeline
    query: "describe the autonomy pipeline end to end"
    category: fuzzy
    expect_entities: ["Autonomy Data Pipeline", "Data Pipeline", "Conversation Relation Linking"]
    expect_docs: ["autonomy/24-", "autonomy-data-pipeline", "autonomy.py"]

  # --- Known-difficult / cross-domain ---
  - id: robotics-projects
    query: "what robotics projects have I worked on?"
    category: hard
    # 2026-08-06: "3D-Printing-Robotics Project" → "3D Printing" (no dir for
    # the compound project name; "3D Printing" is the real entity).
    expect_entities: ["GR00T", "Isaac GR00T N1.7", "1X Neo", "Six-Servo Robot Dog", "3D Printing"]
    expect_docs: ["GR00T", "robot", "robotics"]
    notes: "Cross-domain. Many candidates, semantic search may favor only the most-mentioned."

  - id: this-week-autonomy
    query: "what changed in the autonomy system this week?"
    category: hard
    expect_entities: ["Autonomy Data Pipeline", "KG Mention Classifier", "Entity Resolution Sweep"]
    expect_docs: ["autonomy/", "kg-pipeline"]
    notes: "Recency-biased; semantic similarity alone tends to miss 'this week' framing."

  - id: backlog-overview
    query: "anything interesting in the backlog we should tackle?"
    category: hard
    expect_entities: ["Backlog System"]
    expect_docs: ["backlog/"]
    notes: "Open-ended; current vault_recall probably returns weak results. Useful baseline."
