# Item set for the secondary-engine routing eval (item #551).
#
# Each item names a finished user session and the sha256 of the input
# that the routed job would have sent it. The input itself is not
# checked in: it is a record of a person's day, and this repo has a
# remote. `eval/secondary_routing_eval.py` rebuilds it from the local
# session store with the production transcript builder and refuses to
# run when the hash moves, so a stale item is an error rather than a
# different measurement. Re-pin with `--build-items N`.
#
# `anchors` are identifying tokens (paths, identifiers, numbers) lifted
# from that input; the scorer's groundedness floor is how many of them
# the output names.
